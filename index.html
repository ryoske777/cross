<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Momentum Checker Pro — 모멘텀 점수 분석기</title>

<link rel="preconnect" href="https://corsproxy.io" crossorigin>
<link rel="preconnect" href="https://api.allorigins.win" crossorigin>
<link rel="preconnect" href="https://api.codetabs.com" crossorigin>
<link rel="preconnect" href="https://query1.finance.yahoo.com" crossorigin>
<link rel="preconnect" href="https://query2.finance.yahoo.com" crossorigin>
<link rel="dns-prefetch" href="https://m.stock.naver.com">
<link rel="dns-prefetch" href="https://finance.naver.com">
<link rel="dns-prefetch" href="https://finviz.com">

<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<header>
<h1>📈 모멘텀 신호 체크 Pro</h1>
<div class="subtitle">이평선 + RSI + 거래량 + 기간 수익률 + 펀더멘털 · 미국 &amp; 한국 주식</div>
</header>

<div class="card">
<div class="search-row">
<input id="ticker" class="ticker-input" placeholder="티커 또는 회사명 (예: AAPL, 005930, 삼성전자)" autocomplete="off">
<button class="primary" onclick="run()">분석하기</button>
<div id="suggest-list" role="listbox"></div>
</div>
<div class="quick-buttons">
<span class="quick-flag">🇺🇸</span>
<button class="quick-btn" onclick="setT('TSM')">TSM</button>
<button class="quick-btn" onclick="setT('NVDA')">NVDA</button>
<button class="quick-btn" onclick="setT('AAPL')">AAPL</button>
<button class="quick-btn" onclick="setT('MSFT')">MSFT</button>
<button class="quick-btn" onclick="setT('QQQ')">QQQ</button>
<button class="quick-btn" onclick="setT('SPY')">SPY</button>
<div class="quick-sep"></div>
<span class="quick-flag">🇰🇷</span>
<button class="quick-btn" onclick="setT('005930')">삼성전자</button>
<button class="quick-btn" onclick="setT('000660')">SK하이닉스</button>
<button class="quick-btn" onclick="setT('035420')">NAVER</button>
<button class="quick-btn" onclick="setT('005380')">현대차</button>
<button class="quick-btn" onclick="setT('051910')">LG화학</button>
</div>
<div id="recent" class="recent-row" style="display:none"></div>
</div>

<div id="results" style="display:none">
<div class="tabs">
<button class="tab-btn active" data-tab="tech" onclick="switchTab('tech')">📈 기술적 분석</button>
<button class="tab-btn" data-tab="fund" onclick="switchTab('fund')">🏢 펀더멘털 분석</button>
<button class="tab-btn" data-tab="flow" onclick="switchTab('flow')">🏦 수급 동향</button>
<button class="tab-btn" data-tab="short" onclick="switchTab('short')">🩳 공매도·이상신호</button>
<button class="tab-btn" data-tab="signal" onclick="switchTab('signal')">🔬 신호 분석</button>
</div>

<div id="tab-tech" class="tab-panel active">
<div id="result-header"></div>
<div class="card">
<div class="section-title">핵심 지표</div>
<div id="metrics" class="metrics"></div>
</div>
<div class="card">
<div class="section-title">가격 추이 (1년)</div>
<div class="legend"><span class="p">현재가</span><span class="m50">50일 이동평균</span><span class="m200">200일 이동평균</span></div>
<div id="chart-price" class="svg-chart"></div>
<div id="chart-volume" class="svg-chart svg-chart-vol"></div>
<div class="chart-caption">최근 60일 거래량 · <span class="cap-up">초록</span> 가격 상승일 / <span class="cap-down">빨강</span> 하락일</div>
</div>
<div class="card">
<div class="section-title">RSI(14)</div>
<div id="chart-rsi" class="svg-chart svg-chart-rsi"></div>
</div>
<div class="card">
<div class="section-title">종합 신호 <span class="signal-legend"><span class="lg-good">✓ 긍정</span> · <span class="lg-bad">✗ 부정</span> · <span class="lg-neutral">• 중립</span></span></div>
<div id="signals"></div>
<div id="summary"></div>
</div>
</div>

<div id="tab-fund" class="tab-panel">
<div id="fund-content"></div>
</div>

<div id="tab-flow" class="tab-panel">
<div id="flow-content"></div>
</div>

<div id="tab-short" class="tab-panel">
<div id="short-content"></div>
</div>

<div id="tab-signal" class="tab-panel">
<div id="signal-content"></div>
</div>
</div>

<div id="status" class="card" style="display:none"></div>
<div class="footer">데이터 출처: Yahoo Finance(공개 엔드포인트, CORS 프록시 경유) · 네이버 금융(한국 주식 보완) · Stooq(미국 차트 백업)</div>
</div>

<script src="main.js" defer></script>
</body>
</html>
