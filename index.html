  loadFundamental(yahooTicker,{isKorean:isKr,code:rawTicker,market:krMarket},chart)
    .finally(()=>showStaleNoticeIfAny());
}

// stale 캐시가 사용된 경우 한 번 짧은 안내를 띄움 (있을 때만).
function showStaleNoticeIfAny(){
  if(!consumeStaleFlag())return;
  let el=document.getElementById('stale-notice');
  if(!el){
    el=document.createElement('div');
    el.id='stale-notice';
    el.style.cssText='font-size:12px;color:var(--text-tertiary);margin:8px 0;padding:6px 10px;background:rgba(0,0,0,.03);border-radius:8px;display:inline-block';
    const results=document.getElementById('results');
    if(results&&results.parentNode)results.parentNode.insertBefore(el,results);
  }
  el.textContent='⏱ 캐시된 데이터로 즉시 표시됨 · 백그라운드에서 갱신 중';
  el.style.display='inline-block';
  // 5초 후 자동 숨김
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>{el.style.display='none'},5000);
}

// ─── 종합 판단 카드 생성 ─────────────────────────────────────────────────────
// 초보자도 한눈에 "좋은 기업인가? 지금 싼가? 성장하나?"를 파악할 수 있게 한다.
function generateVerdictCard({pe,fpe,peg,pb,ps,roe,margin,revGrowth,earnGrowth,debtEq,currentRatio,beta,divY,profile,isKorean,score,grade,pegCalculated}){
  // ── 1. 좋은 기업인가? (수익성·안정성)
  let qScore=0,qMax=0;const qDetails=[];
  if(roe!=null){qMax+=3;if(roe>=0.15){qScore+=3;qDetails.push(`ROE ${(roe*100).toFixed(0)}%`)}else if(roe>=0.08){qScore+=1.5;qDetails.push(`ROE ${(roe*100).toFixed(0)}% (보통)`)}else if(roe>=0){qDetails.push(`ROE ${(roe*100).toFixed(0)}% (낮음)`)}else{qDetails.push('적자 (ROE 음수)')}}
  if(margin!=null){qMax+=2;if(margin>0.15){qScore+=2;qDetails.push(`순이익률 ${(margin*100).toFixed(0)}%`)}else if(margin>0.05){qScore+=1;qDetails.push(`순이익률 ${(margin*100).toFixed(0)}%`)}else if(margin>=0){qDetails.push(`순이익률 ${(margin*100).toFixed(0)}% (낮음)`)}else{qDetails.push('적자 기업')}}
  if(debtEq!=null){qMax+=2;const dg=profile?.deqGood||100,db=profile?.deqBad||200;if(debtEq<dg){qScore+=2;qDetails.push('부채 안전')}else if(debtEq<db){qScore+=1;qDetails.push(`부채비율 ${debtEq.toFixed(0)}%`)}else{qDetails.push(`부채 부담 ${debtEq.toFixed(0)}%`)}}
  const qRatio=qMax>0?qScore/qMax:null;
  const qGrade=qRatio==null?'unknown':qRatio>=0.65?'good':qRatio>=0.35?'neutral':'bad';
  const qLabel={'good':'우수한 기업','neutral':'평균적인 기업','bad':'주의 필요','unknown':'데이터 부족'}[qGrade];
  const qIcon={'good':'✅','neutral':'⚠️','bad':'❌','unknown':'❓'}[qGrade];

  // ── 2. 지금 싼가? (밸류에이션)
  let vScore=0,vMax=0;const vDetails=[];
  if(peg!=null&&peg>0&&!pegCalculated){vMax+=3;if(peg<1){vScore+=3;vDetails.push(`PEG ${peg.toFixed(1)} (저평가)`)}else if(peg<2){vScore+=1.5;vDetails.push(`PEG ${peg.toFixed(1)} (적정)`)}else{vDetails.push(`PEG ${peg.toFixed(1)} (고평가)`)}}
  const peRef=pe&&pe>0?pe:(fpe&&fpe>0?fpe:null);
  if(peRef!=null){vMax+=2;const pg=profile?.peGood||22,pb2=profile?.peBad||35;if(peRef<pg){vScore+=2;vDetails.push(`P/E ${peRef.toFixed(0)}x (업종 기준 저평가)`)}else if(peRef<pb2){vScore+=1;vDetails.push(`P/E ${peRef.toFixed(0)}x (적정)`)}else if(peRef>0){vDetails.push(`P/E ${peRef.toFixed(0)}x (고평가 구간)`)}}
  if(pb!=null&&pb>0){vMax+=1;const pbg=profile?.pbGood||3;if(pb<pbg){vScore+=1;vDetails.push(`P/B ${pb.toFixed(1)}x`)}else{vDetails.push(`P/B ${pb.toFixed(1)}x`)}}
  const vRatio=vMax>0?vScore/vMax:null;
  const vGrade=vRatio==null?'unknown':vRatio>=0.65?'good':vRatio>=0.35?'neutral':'bad';
  const vLabel={'good':'저평가 구간','neutral':'적정 가격대','bad':'고평가 가능성','unknown':'데이터 부족'}[vGrade];
  const vIcon={'good':'✅','neutral':'⚠️','bad':'❌','unknown':'❓'}[vGrade];

  // ── 3. 성장하는가?
  let gScore=0,gMax=0;const gDetails=[];
  if(revGrowth!=null){gMax+=2;const rg=profile?.revGrowthGood||0.10;if(revGrowth>rg*2){gScore+=2;gDetails.push(`매출 +${(revGrowth*100).toFixed(0)}%`)}else if(revGrowth>rg){gScore+=1.5;gDetails.push(`매출 +${(revGrowth*100).toFixed(0)}%`)}else if(revGrowth>0){gScore+=0.5;gDetails.push(`매출 +${(revGrowth*100).toFixed(0)}% (저성장)`)}else{gDetails.push(`매출 ${(revGrowth*100).toFixed(0)}% (역성장)`)}}
  if(earnGrowth!=null){gMax+=2;const eg=profile?.earnGrowthGood||0.15;if(earnGrowth>eg*2){gScore+=2;gDetails.push(`이익 +${(earnGrowth*100).toFixed(0)}%`)}else if(earnGrowth>eg){gScore+=1.5;gDetails.push(`이익 +${(earnGrowth*100).toFixed(0)}%`)}else if(earnGrowth>0){gScore+=0.5;gDetails.push(`이익 +${(earnGrowth*100).toFixed(0)}%`)}else{gDetails.push(`이익 ${(earnGrowth*100).toFixed(0)}% (감소)`)}}
  const gRatio=gMax>0?gScore/gMax:null;
  const gGrade=gRatio==null?'unknown':gRatio>=0.65?'good':gRatio>=0.35?'neutral':'bad';
  const gLabel={'good':'고성장 중','neutral':'완만한 성장','bad':'성장 정체/하락','unknown':'데이터 부족'}[gGrade];
  const gIcon={'good':'✅','neutral':'⚠️','bad':'❌','unknown':'❓'}[gGrade];

  // ── 종합 결론
  const knownGrades=[qGrade,vGrade,gGrade].filter(g=>g!=='unknown');
  const goodN=knownGrades.filter(g=>g==='good').length;
  const badN=knownGrades.filter(g=>g==='bad').length;
  let cTitle,cBody,cClass;
  if(knownGrades.length<2){cTitle='데이터 부족으로 종합 판단 어려움';cBody='펀더멘탈 데이터가 충분히 로드되지 않았습니다. 기술적 분석 탭의 모멘텀 신호를 함께 참고하세요.';cClass='neutral'}
  else if(goodN>=2&&badN===0){cTitle='전반적으로 좋은 종목';cBody='수익성·성장성·밸류에이션이 모두 양호합니다. 기술적 추세도 함께 확인하세요.';cClass='good'}
  else if(qGrade==='good'&&vGrade==='good'){cTitle='좋은 기업, 합리적인 가격';cBody='수익성이 우수하고 현재 가격이 부담스럽지 않은 구간입니다.';cClass='good'}
  else if(qGrade==='good'&&vGrade==='bad'){cTitle='좋은 기업이지만 현재 고평가 구간';cBody='기업의 체력은 우수하지만 주가가 많이 올라있습니다. 가격 조정 시 매수를 검토해볼 수 있어요.';cClass='neutral'}
  else if(qGrade==='bad'){cTitle='재무 상태 주의 필요';cBody='수익성이나 부채 측면에서 주의가 필요합니다. 성장 기대로 보유한다면 성장 지표를 중심으로 검토하세요.';cClass='bad'}
  else if(badN>=2){cTitle='여러 지표에서 주의 신호';cBody='성장성·수익성·밸류에이션 중 여러 항목이 부진합니다. 투자 시 신중히 접근하세요.';cClass='bad'}
  else{cTitle='혼조 — 추가 검토 필요';cBody='일부 지표는 양호하지만 아닌 것도 있어 판단이 엇갈립니다. 기술적 분석과 수급 동향을 함께 살펴보세요.';cClass='neutral'}

  // 종목 유형 태그
  const typeArr=[];
  if(divY!=null&&divY>0.03)typeArr.push('배당주');
  if(revGrowth!=null&&revGrowth>0.20)typeArr.push('고성장주');
  else if(peRef!=null&&peRef>0&&peRef<(profile?.peGood||22)*0.8)typeArr.push('가치주');
  else if(revGrowth!=null&&revGrowth>0.10)typeArr.push('성장주');
  if(beta!=null&&beta>1.5)typeArr.push('고변동성');

  const vc={good:{bg:'var(--good-bg)',text:'var(--good)',border:'rgba(45,134,89,.2)'},neutral:{bg:'var(--neutral-bg)',text:'var(--neutral)',border:'rgba(176,125,46,.2)'},bad:{bg:'var(--bad-bg)',text:'var(--bad)',border:'rgba(196,67,67,.2)'},unknown:{bg:'var(--bg)',text:'var(--text-tertiary)',border:'var(--border)'}};
  const cc=vc[cClass];
  const box=(grade2,icon,cat,label2,details)=>{const c2=vc[grade2];return`<div style="background:${c2.bg};border:1px solid ${c2.border};border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:24px;line-height:1">${icon}</div><div style="font-size:10.5px;color:var(--text-secondary);font-weight:800;margin-top:2px">${cat}</div><div style="font-size:13.5px;font-weight:900;color:${c2.text};letter-spacing:-0.02em">${label2}</div>${details.length?`<div style="font-size:10px;color:var(--text-secondary);margin-top:3px;line-height:1.5">${details.slice(0,2).map(d=>escAttr(d)).join('<br>')}</div>`:''}</div>`};

  return`<div class="card" style="border-left:4px solid ${cc.text}">
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div class="section-title" style="margin-bottom:0">📊 이 주식, 어떻게 볼까요?</div>
    ${typeArr.length?`<span style="font-size:11px;background:rgba(26,77,140,.08);color:var(--primary);padding:3px 9px;border-radius:999px;font-weight:800">${typeArr.join(' · ')}</span>`:''}
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
    ${box(qGrade,qIcon,'좋은 기업인가요?',qLabel,qDetails)}
    ${box(vGrade,vIcon,'지금 싼가요?',vLabel,vDetails)}
    ${box(gGrade,gIcon,'성장하고 있나요?',gLabel,gDetails)}
  </div>
  <div style="background:${cc.bg};border:1px solid ${cc.border};border-radius:10px;padding:14px">
    <div style="font-weight:900;font-size:15px;color:${cc.text};margin-bottom:6px">💬 ${escAttr(cTitle)}</div>
    <div style="font-size:13px;color:var(--text-secondary);line-height:1.65">${escAttr(cBody)}</div>
    ${score!=null?`<div style="margin-top:8px;font-size:11.5px;color:var(--text-tertiary)">펀더멘털 점수 ${score}/100 (${escAttr(grade)}) · 기술적 분석 탭에서 추세도 확인하세요</div>`:''}
  </div>
  <div style="margin-top:10px;font-size:11px;color:var(--text-tertiary);line-height:1.6;padding:9px 12px;background:rgba(0,0,0,.02);border-radius:8px">⚠️ 이 분석은 공개 데이터 기반 <strong>참고 자료</strong>입니다. 투자 결정은 반드시 본인의 판단으로 하세요. 과거 수치가 미래 성과를 보장하지 않습니다.</div>
</div>`;
}

async function loadFundamental(ticker,opts={},chartFromCaller){
  const{isKorean=false,code='',market=''}=opts;
  const box=document.getElementById('fund-content');
  box.innerHTML='<div class="card"><span class="loader"></span> 펀더멘털 불러오는 중...</div>';
  const makeRaw=v=>v==null||!isFinite(v)?undefined:{raw:v,fmt:String(v)};

  const fallbackFundamental=async()=>{
    let q={};
    try{q=await getQuote(ticker)}catch(_){q={}}
    // 호출자(run)에서 이미 받은 차트 재사용 — 없으면 폴백 시 1회 더 받음.
    const ch=chartFromCaller&&chartFromCaller.length?chartFromCaller:await getChart(ticker);
    const cls=ch.map(x=>x.c);
    const last=cls[cls.length-1];
    const y0=cls[0];
    const yHigh=Math.max(...cls),yLow=Math.min(...cls);
    const momentum=last&&y0?pct(last,y0):null;
    // longName이 없으면 null — ticker 문자열을 이름으로 쓰면 이후 name 해석을 막아버림
    const qLongName=q.longName||q.shortName||null;
    return{
      summaryDetail:{
        marketCap:makeRaw(q.marketCap),trailingPE:makeRaw(q.trailingPE),forwardPE:makeRaw(q.forwardPE),
        dividendYield:makeRaw(q.trailingAnnualDividendYield),beta:makeRaw(q.beta),priceToSalesTrailing12Months:makeRaw(q.priceToSalesTrailing12Months)
      },
      defaultKeyStatistics:{priceToBook:makeRaw(q.priceToBook),trailingPE:makeRaw(q.trailingPE),beta:makeRaw(q.beta)},
      // 차트 모멘텀을 revenueGrowth로 쓰지 않음 — 오해를 유발하는 가짜 지표
      financialData:{},
      assetProfile:{sector:q.sector,industry:q.industry,country:q.market||''},
      price:{longName:qLongName,shortName:q.shortName||null,marketCap:makeRaw(q.marketCap)},
      quoteType:{quoteType:q.quoteType||'EQUITY'},
      _fallback:{last,yHigh,yLow,momentum}
    };
  };

  let r,usedFallback=false;
  try{r=await getQuoteSummary(ticker)}catch(_){r=await fallbackFundamental();usedFallback=true}

  // 보조 소스: 한국 주식은 네이버 금융(2곳), 미국 주식은 Finviz + StockAnalysis
  const results=await Promise.allSettled([
    isKorean?getNaverFinanceData(code):getFinvizData(ticker),
    isKorean?getKoreanStockDetailData(code):getStockAnalysisData(ticker),
    getQuote(ticker)
  ]);

  const supp1=results[0].status==='fulfilled'?results[0].value:null;
  const supp2=results[1].status==='fulfilled'?results[1].value:null;
  const qteRaw=results[2].status==='fulfilled'?results[2].value:null;

  let naver=isKorean?supp1:null;
  const naverDetail=isKorean?supp2:null;
  // 네이버 데이터 병합 (상세 페이지 데이터로 보충)
  if(naver&&naverDetail){
    naver={...naver,...Object.fromEntries(Object.entries(naverDetail).map(([k,v])=>[k,numFromText(v)]).filter(([k,v])=>v!=null&&!naver[k.toLowerCase()]))};
  }
  const fvz=isKorean?null:supp1;
  const sa=isKorean?null:supp2;
  const known=getLastKnownFundamental(isKorean?code:ticker);
  let knownUsed=false;

  try{
    const sd=r.summaryDetail||{},ks=r.defaultKeyStatistics||{},fd=r.financialData||{},ap=r.assetProfile||{},pr=r.price||{},qt=r.quoteType||{};
    const v=o=>o&&o.raw!=null?o.raw:null;
    const pickNum=(key,...vals)=>{
      const valid=vals.filter(x=>x!=null&&isFinite(x));
      if(valid.length===0){
        if(known&&known[key]!=null&&isFinite(known[key])){knownUsed=true;return known[key]}
        return null;
      }
      // 우선순위 순서대로 정렬되어 있으므로 첫 번째 유효값 사용
      // (잘못된 median 로직은 제거 — length=2일 때 outlier를 골라버리는 버그가 있었음)
      return valid[0];
    };

    const name=pr.longName||pr.shortName||qt.shortName||qteRaw?.longName||qteRaw?.shortName||qteRaw?.displayName||naver?.naverName||(isKorean?getKoreanStockName(code):null)||known?.name||ticker;
    const isETFRaw=qt.quoteType==='ETF'||qteRaw?.quoteType==='ETF';
    const sector=ap.sector||qteRaw?.sector||known?.sector||(isETFRaw?'ETF':'—');
    const industry=ap.industry||qteRaw?.industry||known?.industry||'—';
    const country=ap.country||known?.country||(isKorean?'Korea':'');
    const employees=ap.fullTimeEmployees;

    const sharesOut=v(ks.sharesOutstanding)||v(ks.impliedSharesOutstanding);
    const mcapCalc=sharesOut&&qteRaw?.regularMarketPrice?sharesOut*qteRaw.regularMarketPrice:null;
    // 시가총액: sharesOut*price 계산값이 가장 정확 → Yahoo API → 네이버 순
    let mcap=pickNum('mcap',mcapCalc,v(sd.marketCap),v(pr.marketCap),qteRaw?.marketCap,naver?.mcap,fvz?.mcap,sa?.mcap);
    // 계산값이 없을 때만 API 값 사용, API값이 계산값과 2배 이상 차이나면 계산값 우선
    if(mcap&&mcapCalc&&mcapCalc>0){const ratio=mcap/mcapCalc;if(ratio>2||ratio<0.5)mcap=mcapCalc;}
    let mcapApprox=false;
    // KNOWN_MCAP / P/S × 매출 등 보강 fallback은 ps · stmtRevenue 계산 이후로 미룬다.

    // ─── 손익계산서·재무상태표에서 직접 계산 ────────────────────────────────────
    // financialData 모듈이 없거나 불완전할 때 보완.
    // 1순위: 연간 (안정적), 2순위: 최근 4분기 합산 TTM (연간이 없거나 오래된 경우)
    const isAnn=r.incomeStatementHistory?.incomeStatementHistory;
    const bsAnn=r.balanceSheetHistory?.balanceSheetHistory;
    const isAnnLast=isAnn?.[0]||{};
    const isAnnPrev=isAnn?.[1]||{};
    const bsLast=bsAnn?.[0]||{};
    // TTM (최근 4분기 합산) — 연간 데이터가 비었을 때만 사용
    const isQtrAll=r.incomeStatementHistoryQuarterly?.incomeStatementHistory||[];
    const sumQtr=(field,n=4)=>{
      if(!Array.isArray(isQtrAll)||isQtrAll.length<n)return null;
      let s=0,ok=0;
      for(let i=0;i<n;i++){const x=v(isQtrAll[i]?.[field]);if(x!=null){s+=x;ok++}}
      return ok===n?s:null;
    };
    const annRevenue=v(isAnnLast.totalRevenue);
    const annNetIncome=v(isAnnLast.netIncome);
    const annGrossProfit=v(isAnnLast.grossProfit);
    const annOpIncome=v(isAnnLast.operatingIncome)||v(isAnnLast.ebit);
    const ttmRevenue=sumQtr('totalRevenue');
    const ttmNetIncome=sumQtr('netIncome');
    const ttmGrossProfit=sumQtr('grossProfit');
    const ttmOpIncome=sumQtr('operatingIncome')||sumQtr('ebit');
    // 직전 4분기(=8분기 중 5~8번째) 합 — TTM 기준 YoY 매출 성장률 비교용
    const sumQtrPrior=field=>{
      if(!Array.isArray(isQtrAll)||isQtrAll.length<8)return null;
      let s=0,ok=0;
      for(let i=4;i<8;i++){const x=v(isQtrAll[i]?.[field]);if(x!=null){s+=x;ok++}}
      return ok===4?s:null;
    };
    const ttmPrevRevenue=sumQtrPrior('totalRevenue');
    const stmtRevenue=annRevenue??ttmRevenue;
    // stmtRevenue 가 어느 기준이냐에 따라 prev도 같은 기준으로 매칭 (단위 일치)
    const stmtPrevRevenue=annRevenue!=null?v(isAnnPrev.totalRevenue):ttmPrevRevenue;
    const stmtNetIncome=annNetIncome??ttmNetIncome;
    const stmtGrossProfit=annGrossProfit??ttmGrossProfit;
    const stmtOpIncome=annOpIncome??ttmOpIncome;
    const stmtSE=v(bsLast.totalStockholderEquity);
    const stmtAssets=v(bsLast.totalAssets);
    const stmtLiabilities=v(bsLast.totalLiab)||v(bsLast.totalLiabilities);
    // totalDebt(=장단기 합)을 우선 사용 — longTermDebt만 잡으면 단기 부채 누락
    const stmtDebt=v(bsLast.totalDebt)??(((v(bsLast.longTermDebt)||0)+(v(bsLast.shortTermDebt)||0))||null);
    const calcROE=stmtNetIncome!=null&&stmtSE!=null&&stmtSE!==0?stmtNetIncome/stmtSE:null;
    const calcROA=stmtNetIncome!=null&&stmtAssets!=null&&stmtAssets!==0?stmtNetIncome/stmtAssets:null;
    const calcProfitM=stmtNetIncome!=null&&stmtRevenue!=null&&stmtRevenue!==0?stmtNetIncome/stmtRevenue:null;
    const calcGrossM=stmtGrossProfit!=null&&stmtRevenue!=null&&stmtRevenue!==0?stmtGrossProfit/stmtRevenue:null;
    const calcOpM=stmtOpIncome!=null&&stmtRevenue!=null&&stmtRevenue!==0?stmtOpIncome/stmtRevenue:null;
    const calcRevGrowth=stmtRevenue!=null&&stmtPrevRevenue!=null&&stmtPrevRevenue!==0?(stmtRevenue-stmtPrevRevenue)/Math.abs(stmtPrevRevenue):null;
    // 데이터 신선도 — 가장 최근 결산일 (연간 우선, 없으면 분기)
    const annEndRaw=v(isAnnLast.endDate);
    const qtrEndRaw=v(isQtrAll?.[0]?.endDate);
    const reportEndTs=qtrEndRaw&&(!annEndRaw||qtrEndRaw>annEndRaw)?qtrEndRaw:annEndRaw;
    const reportIsAnnual=reportEndTs===annEndRaw&&annEndRaw!=null;
    const reportLabel=(()=>{
      if(!reportEndTs)return null;
      const d=new Date(reportEndTs*1000);
      if(isNaN(d.getTime()))return null;
      const y=d.getFullYear(),m=d.getMonth()+1,q=Math.ceil(m/3);
      return reportIsAnnual?`${y} 연간 결산`:`${y} Q${q}`;
    })();
    // P/S 계산 (시가총액 / 매출) — 여러 소스에서 시도
    let calcPS=null;
    if(mcapCalc&&stmtRevenue&&stmtRevenue!==0){
      calcPS=mcapCalc/stmtRevenue;
    }else if(mcap&&stmtRevenue&&stmtRevenue!==0){
      calcPS=mcap/stmtRevenue;
    }
    // 연간 매출이 없으면 분기 데이터로 TTM(최근 4분기 합) 산출 — 단순 ×4 는 계절성 왜곡
    if(calcPS==null){
      const isQtr=r.incomeStatementHistoryQuarterly?.incomeStatementHistory;
      if(Array.isArray(isQtr)&&isQtr.length>=4&&(mcapCalc||mcap)){
        const ttmRev=isQtr.slice(0,4).reduce((s,q)=>{const x=v(q?.totalRevenue);return x!=null?s+x:s},0);
        if(ttmRev>0)calcPS=(mcapCalc||mcap)/ttmRev;
      }else if(isQtr?.[0]?.totalRevenue&&(mcapCalc||mcap)){
        // 분기 1개만 있을 때만 ×4 근사 (마지막 폴백)
        const annRevEst=v(isQtr[0].totalRevenue)*4;
        if(annRevEst>0)calcPS=(mcapCalc||mcap)/annRevEst;
      }
    }
    let usedStmtCalc=false; // 재무제표 계산값 사용 여부

    // qteRaw (Yahoo v7 quote) + 재무제표 계산값을 pickNum fallback에 직접 연결
    // 한국/미국 모두 Yahoo 우선 — 네이버 스크래핑은 부정확하므로 fallback 전용
    let pe=pickNum('pe',v(sd.trailingPE),v(ks.trailingPE),qteRaw?.trailingPE,naver?.pe,fvz?.pe,sa?.pe);
    let fpe=pickNum('fpe',v(sd.forwardPE),v(ks.forwardPE),qteRaw?.forwardPE,naver?.fpe,fvz?.fpe,sa?.fpe);
    // P/E 검증: 극단값 수정 (적자 표시 무효화)
    if(pe!=null&&pe<-100)pe=null;
    if(fpe!=null&&fpe<-100)fpe=null;
    let pb=pickNum('pb',v(ks.priceToBook),qteRaw?.priceToBook,naver?.pb,fvz?.pb,sa?.pb);
    let ps=pickNum('ps',v(sd.priceToSalesTrailing12Months),qteRaw?.priceToSalesTrailing12Months,naver?.ps,calcPS,fvz?.ps,sa?.ps);
    let divY=pickNum('divY',v(sd.dividendYield),qteRaw?.trailingAnnualDividendYield,naver?.divY,fvz?.divY,sa?.divY);
    // Yahoo financialData 우선 → 재무제표 계산 → 네이버 fallback
    const _roe0=pickNum('roe',v(fd.returnOnEquity),fvz?.roe,sa?.roe,naver?.roe);
    let roe=(()=>{if(_roe0!=null)return _roe0;if(calcROE!=null){usedStmtCalc=true;return calcROE}return null})();
    const _roa0=pickNum('roa',v(fd.returnOnAssets),fvz?.roa,sa?.roa,naver?.roa);
    let roa=(()=>{if(_roa0!=null)return _roa0;if(calcROA!=null){usedStmtCalc=true;return calcROA}return null})();
    const _margin0=pickNum('profitM',v(fd.profitMargins),v(ks.profitMargins),fvz?.profitM,sa?.profitM,naver?.profitM);
    let margin=(()=>{if(_margin0!=null)return _margin0;if(calcProfitM!=null){usedStmtCalc=true;return calcProfitM}return null})();
    const _opM0=pickNum('opMargin',v(fd.operatingMargins),fvz?.opMargin,sa?.opMargin,naver?.opMargin);
    let opMargin=(()=>{if(_opM0!=null)return _opM0;if(calcOpM!=null){usedStmtCalc=true;return calcOpM}return null})();
    const _revG0=pickNum('revGrowth',v(fd.revenueGrowth),fvz?.revGrowth,sa?.revGrowth,naver?.revGrowth);
    let revGrowth=(()=>{if(_revG0!=null)return _revG0;if(calcRevGrowth!=null){usedStmtCalc=true;return calcRevGrowth}return null})();
    const _earnG0=pickNum('earnGrowth',v(fd.earningsGrowth),v(fd.earningsQuarterlyGrowth),fvz?.earnGrowth,sa?.earnGrowth,naver?.earnGrowth);
    let earnGrowth=(()=>{if(_earnG0!=null)return _earnG0;return null})();
    const _debtEq0=pickNum('debtEq',v(fd.debtToEquity),fvz?.debtEq,sa?.debtEq,naver?.debtEq);
    let debtEq=(()=>{if(_debtEq0!=null)return _debtEq0;return null})();
    // D/E 단위 자동 정규화: Yahoo는 보통 %(예: 63.5)지만 일부 응답에서 비율(0.63)로 옴.
    // 0~5 범위면 비율로 간주해 ×100, 그 외는 % 그대로.
    // (다만 절대값이 아주 작은 진짜 % 케이스(예: 0.5% = 거의 무차입)는 0~5 비율 범위와
    //  구분 어려우므로 재무제표 직접 계산값과 비교해 보정)
    if(debtEq!=null&&debtEq>=0&&debtEq<=5&&stmtLiabilities!=null&&stmtSE!=null&&stmtSE>0){
      const calcDe=(stmtLiabilities/stmtSE)*100;
      if(calcDe>10&&Math.abs(debtEq*100-calcDe)<Math.abs(debtEq-calcDe)){debtEq=debtEq*100;}
    }
    const _currRatio0=pickNum('currRatio',v(fd.currentRatio),fvz?.currRatio,sa?.currRatio,naver?.currRatio);
    let currentRatio=(()=>{if(_currRatio0!=null)return _currRatio0;return null})();
    const beta=pickNum('beta',v(sd.beta),v(ks.beta),qteRaw?.beta,fvz?.beta,sa?.beta);
    let peg=pickNum('peg',v(ks.pegRatio),fvz?.peg,sa?.peg);
    let pegCalculated=false;
    if((peg==null||!isFinite(peg))&&pe!=null&&pe>0&&earnGrowth!=null&&earnGrowth>0){peg=pe/(earnGrowth*100);pegCalculated=true}

    // ─── 빠진 지표 보완 계산 ────────────────────────────────────────────────────
    // 0. 순이익률 역산: margin = (P/S) / (P/E) — 흑자 기업에 한해 정확
    let marginCalculated=false;
    if(margin==null&&pe!=null&&pe>0&&ps!=null&&ps>0){margin=ps/pe;marginCalculated=true;}
    // ROE × Equity/Sales = NI/Sales 관계로도 시도 (PB·PS·ROE 모두 양수일 때)
    if(margin==null&&roe!=null&&roe>0&&pb!=null&&pb>0&&ps!=null&&ps>0){margin=roe*ps/pb;marginCalculated=true;}
    // (제거) ROE = PB × ROA 폴백: 수학적으로 ROE = ROA × (Assets/Equity) 이며
    //   PB는 가격 멀티플이라 ROE와 무관 — 잘못된 값을 만들어 등급 왜곡 원인이었음.
    // (제거) margin/(1-D/E) 폴백: D/E 단위 혼선과 결합해 비현실적 ROE 양산.
    // (제거) ROA = margin × 0.5 추정: 자산회전율은 업종별 0.1~3+ 으로 편차가 커
    //   고정 0.5 가정이 점수 결과를 왜곡시킴.
    // ROE/ROA는 재무제표 직접 계산(calcROE/calcROA)이 가능할 때만 채워짐.
    // 3. P/S 계산: P/E × 순이익률
    if(ps==null&&pe!=null&&margin!=null&&pe>0&&margin>0){ps=pe*margin;}
    // 4. PB 역산: PB = PE × ROE
    if(pb==null&&pe!=null&&roe!=null&&pe>0&&roe>0){pb=pe*roe;}
    // 5. 성장률 추정: ROE - 배당수익률 = 내부 성장률
    if(earnGrowth==null&&roe!=null&&divY!=null&&roe>0){
      earnGrowth=Math.max(0,roe-divY);
    }
    // 6. ROE 역산 (이미 위에서 계산했으면 스킵)
    // 7. ROA 역산 (이미 위에서 계산했으면 스킵)
    // 8. 부채비율은 위의 stmtLiabilities 기반 계산 참고
    // 6. 부채비율 계산: 재무제표 기반 D/E = 부채/자기자본
    if(debtEq==null&&stmtLiabilities!=null&&stmtSE!=null&&stmtSE!==0){
      debtEq=(stmtLiabilities/stmtSE)*100;
    }else if(debtEq==null&&stmtDebt!=null&&stmtSE!=null&&stmtSE!==0){
      debtEq=(stmtDebt/stmtSE)*100;
    }
    // (제거) 유동비율→D/E 환산 폴백: 두 지표는 수학적으로 무관해 잡음만 만듦
    // (제거) D/E 300% 캡: 부채 위험 기업을 정상처럼 보이게 만들던 가림막
    //   실제 위험을 그대로 노출하기 위해 상한 강제 절단을 하지 않는다.

    // ─── 최종 값 sanity 검증: 명백히 비현실적인 값은 null로 ─────────────────────
    // (네이버/Finviz 정규식이 다른 필드 숫자를 잘못 매칭하는 케이스 차단)
    // Yahoo 2024년 변경: 일부 응답에서 dividendYield를 비율(0.025) 대신 퍼센트(2.5)로 반환.
    // 0.20(20%) 초과 ~ 30 이하면 퍼센트 형식으로 간주해 ÷100 보정 후 sanity 검사 통과시킴.
    if(divY!=null&&divY>0.20&&divY<=30)divY=divY/100;
    if(divY!=null&&(divY<0||divY>0.20))divY=null;          // 배당수익률 >20% 비현실적 (배당성향 오인)
    // 적자 성장주(예: IONQ)도 진짜 값을 통과시킨다.
    // 상한은 잘못된 정규식 매칭 차단용으로 좁게 유지하고, 하한만 크게 완화.
    if(margin!=null&&(margin<-50||margin>1))margin=null;
    if(opMargin!=null&&(opMargin<-50||opMargin>1))opMargin=null;
    // ROE 상한을 3배(=300%)에서 1.5배(=150%)로 좁힘 — 자기자본 잠식 직전 잡음 방지
    if(roe!=null&&(roe<-10||roe>1.5))roe=null;
    if(roa!=null&&(roa<-10||roa>1))roa=null;
    if(pe!=null&&(pe>1000||pe<-1000))pe=null;
    if(fpe!=null&&(fpe>1000||fpe<-1000))fpe=null;
    if(pb!=null&&(pb<0||pb>100))pb=null;
    if(ps!=null&&(ps<0||ps>100))ps=null;
    if(revGrowth!=null&&(revGrowth<-1||revGrowth>10))revGrowth=null;
    // earnGrowth 상한을 20배(=2000%)에서 5배(=500%)로 좁힘 — 비현실적 분기 비교 잡음 차단
    if(earnGrowth!=null&&(earnGrowth<-2||earnGrowth>5))earnGrowth=null;
    if(currentRatio!=null&&(currentRatio<0||currentRatio>50))currentRatio=null;
    // D/E 자체 sanity: 음수는 자기자본 잠식 — 상한 캡 없이 노출 (실제 위험 표시)
    if(debtEq!=null&&debtEq<0)debtEq=null;

    // P/S 추가 fallback: mcap/매출이 가능하면 계산
    if(ps==null&&mcap!=null&&stmtRevenue!=null&&stmtRevenue>0){
      const calc=mcap/stmtRevenue;
      if(calc>0&&calc<100)ps=calc;
    }

    // ─── 시가총액 보강 fallback (직접 소스가 모두 비었을 때) ─────────────────
    // 1) P/S × 매출 = 시가총액 (대수적으로 정확)
    if(mcap==null&&ps!=null&&ps>0&&stmtRevenue!=null&&stmtRevenue>0){
      mcap=ps*stmtRevenue;
    }
    // 2) P/E × 순이익 = 시가총액 (흑자 기업만)
    if(mcap==null&&pe!=null&&pe>0&&stmtNetIncome!=null&&stmtNetIncome>0){
      mcap=pe*stmtNetIncome;
    }
    // 3) 마지막 수단: 알려진 시가총액 스냅샷
    if(mcap==null){
      const kmKey=isKorean?code:String(ticker).toUpperCase();
      const km=KNOWN_MCAP[kmKey];
      if(km!=null){mcap=km;mcapApprox=true;}
    }

    const sourceParts=[];
    if(!usedFallback)sourceParts.push('Yahoo Finance');
    else if(qteRaw)sourceParts.push('Yahoo Finance (기본)');
    if(usedStmtCalc)sourceParts.push('Yahoo 재무제표 계산');
    if(naver)sourceParts.push('네이버 금융');
    if(fvz)sourceParts.push('Finviz');
    if(sa)sourceParts.push('StockAnalysis');
    if(knownUsed&&known)sourceParts.push(`${known.source}(${known.asOf})`);
    const sourceNote=sourceParts.length?sourceParts.join(' + '):'공개 가격/차트 데이터';
    const freshnessNote=reportLabel?` · 재무 기준일: ${reportLabel}`:'';

    // ─── 펀더멘털 점수 (0~100) ────────────────────────────────────────────────
    const isETF=isETFRaw;
    // 섹터 프로필: 영문 sector 우선, 없으면 한국어 industry 키워드로 매핑
    const profile=getSectorProfile(sector||mapKoreanIndustryToSector(industry),isKorean);
    const {peGood,peBad,pbGood,pbBad,psGood,psBad,
           roeGood,roeBad,profitMGood,profitMBad,
           grossMGood,grossMBad,opMGood,opMBad,
           revGrowthGood,revGrowthBad,earnGrowthGood,earnGrowthBad,
           deqGood,deqBad}=profile;

    let rawScore=0,maxScore=0;
    const add=(val,maxPts,pts)=>{if(val==null||!isFinite(val))return;rawScore+=pts;maxScore+=maxPts};

    if(!isETF){
      // P/E가 음수(적자)이면서 Forward P/E가 양수이면 회복 중으로 간주해 과도한 감점 방지
      const peRecovering=pe!=null&&pe<0&&fpe!=null&&fpe>0&&fpe<peBad;
      add(pe,10, pe>0&&pe<peGood?10:pe>0&&pe<peBad?4:pe>0?-4:peRecovering?-2:-8);
      add(peg,8,  peg>0&&peg<1?8:peg>0&&peg<2?4:peg>0?-3:0);
      add(roe,15, roe>roeGood?15:roe>roeBad?8:roe>=0?2:-12);
      // margin이 P/S÷P/E 역산값이면 점수 산정에서 제외 (시각화에는 그대로 표시)
      if(!marginCalculated)add(margin,12, margin>profitMGood?12:margin>profitMBad?6:margin>=0?1:-12);
      add(revGrowth,12, revGrowth>revGrowthGood?12:revGrowth>revGrowthBad?5:-10);
      add(earnGrowth,10, earnGrowth>earnGrowthGood?10:earnGrowth>earnGrowthBad?4:-8);
      add(debtEq,6, debtEq<deqGood?6:debtEq<deqBad?2:-8);
      add(currentRatio,5, currentRatio>1.5?5:currentRatio>1?2:-5);
    }
    // ETF는 펀더멘털 점수 산정에서 제외 — 무조건 만점을 주던 기존 로직은
    // 모든 ETF를 "양호 이상"으로 보이게 만들어 의미가 없었음.
    // (등급은 grade='데이터 부족'이 표시되며, 카드/시각화는 그대로 노출)
    // 점수 계산: 유효한 지표가 너무 적으면 등급을 매기지 않고 "데이터 부족"으로 표기
    // (기존의 +15 보정은 부실 기업을 가리는 부작용이 있어 제거)
    // 임계: 유효 지표의 max 가중치 합이 30 미만이면 표본 부족으로 판단
    // (전체 가중치 합은 약 78점 — pe10+peg8+roe15+margin12+revGrowth12+earnGrowth10+debtEq6+currRatio5)
    const score=maxScore?Math.max(0,Math.min(100,Math.round((rawScore/maxScore)*100))):null;
    const dataInsufficient=(maxScore<30);
    const adjustedScore=score;
    let grade,gColor;
    if(isETF){grade='ETF (점수 미산정)';gColor='var(--text-tertiary)'}
    else if(dataInsufficient||adjustedScore==null){grade='데이터 부족';gColor='var(--text-tertiary)'}
    else if(adjustedScore>=70){grade='우수';gColor='var(--good)'}
    else if(adjustedScore>=55){grade='양호';gColor='var(--primary)'}
    else if(adjustedScore>=40){grade='보통';gColor='var(--neutral)'}
    else{grade='주의';gColor='var(--bad)'}

    const tagList=[];
    if(market)tagList.push({t:market,kr:true});
    if(sector&&sector!=='—')tagList.push({t:sector});
    if(industry&&industry!=='—')tagList.push({t:industry});
    if(country&&!isKorean)tagList.push({t:country});
    const displayQuoteType=qt.quoteType||qteRaw?.quoteType;
    if(displayQuoteType&&!isKorean)tagList.push({t:displayQuoteType});

    // 통화 포매터
    const fmtMcap=n=>isKorean?fmtBigKRW(n):fmtBig(n);
    const fmtCurr=n=>isKorean?fmtPriceKRW(n):('$'+fmtNum(n));

    const grossM=pickNum('grossM',v(fd.grossMargins),calcGrossM);
    // 배당 미지급 판정: 다른 펀더멘털은 받아왔는데 배당값이 0/null이면 무배당으로 간주.
    // (분기 누락 vs 미지급을 구분하기 위해 다른 데이터가 들어왔을 때만 적용)
    const hasFundamentalSignal=pe!=null||pb!=null||ps!=null||roe!=null||margin!=null||revGrowth!=null||opMargin!=null;
    const isNoDividend=hasFundamentalSignal&&(divY==null||divY===0);
    const peDesc=(()=>{
      if(pe==null)return'주가/이익 비율';
      if(pe<0&&fpe!=null&&fpe>0)return`Forward ${fmtNum(fpe)} (실적 회복 중)`;
      if(pe<0)return'적자 (TTM 기준)';
      return fpe!=null?'Forward '+fmtNum(fpe):'주가/이익 비율';
    })();
    const cards=[
      {t:'시가총액',k:'mcap',m:fmtMcap(mcap)+(mcapApprox?' *':''),d:mcapApprox?'근사값 (API 제한)':'기업 규모'},
      {t:'P/E (TTM)',k:'pe',m:pe!=null?fmtNum(pe):'—',d:peDesc},
      {t:'PEG',k:'peg',m:peg!=null?fmtNum(peg):'—',d:pegCalculated?'이익 성장률 기반 계산값':'성장 대비 밸류'},
      {t:'P/B',k:'pb',m:pb!=null?fmtNum(pb):'—',d:'주가/순자산'},
      {t:'P/S',k:'ps',m:ps!=null?fmtNum(ps):'—',d:'주가/매출'},
      {t:'배당수익률',k:'divY',m:divY!=null&&divY>0?(divY*100).toFixed(2)+'%':isNoDividend?'무배당':'—',d:isNoDividend?'배당 미지급 종목':'연간 배당'},
      {t:'ROE',k:'roe',m:roe!=null?(roe*100).toFixed(1)+'%':'—',d:roa!=null?'ROA '+(roa*100).toFixed(1)+'%':'자기자본이익률'},
      {t:'순이익률',k:'margin',m:margin!=null?(margin*100).toFixed(1)+'%'+(marginCalculated?' *':''):'—',d:margin==null?(usedFallback?'외부 소스 미제공':'데이터 없음'):marginCalculated?'P/S÷P/E 역산':opMargin!=null?'영업 '+(opMargin*100).toFixed(1)+'%':grossM!=null?'매출총이익 '+(grossM*100).toFixed(1)+'%':'순이익/매출'},
    ];
    // 핵심 지표가 하나도 없을 때만 차트 기반 대체 카드 표시
    const hasFundamentals=pe!=null||pb!=null||ps!=null||roe!=null||margin!=null;
    if(usedFallback&&r._fallback&&!hasFundamentals){
      cards.splice(0,0,
        {t:'현재가',m:fmtCurr(r._fallback.last),d:'공개 가격 데이터 기준'},
        {t:'1년 범위',m:fmtCurr(r._fallback.yLow)+' ~ '+fmtCurr(r._fallback.yHigh),d:'52주 유사 범위'},
        {t:'1년 변화',m:fmtPct(r._fallback.momentum),d:'차트 기반 대체 지표'}
      );
    }

    // ─── 시각화 막대 정의 ─────────────────────────────────────────────────────
    // pos(x): 값을 막대 위 0~100% 위치로 매핑 (구간별 piecewise 매핑으로
    //   임계값이 시각적으로 같은 위치에 오게 함)
    // zones: 막대 배경의 빨강·노랑·초록 영역(폭은 % 합계 100)
    // hint: 막대 아래에 보일 임계 기준 설명 (초보자용)
    // 섹터 임계값 기반 퍼센트 포맷 헬퍼 (소수→% 표기)
    const pctThr=x=>(x*100).toFixed(0)+'%';
    const bars=[
      {l:'매출 성장',sub:'전년 대비',k:'revGrowth',v:revGrowth,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?Math.max(0,25+x*100):x<0.1?25+(x/0.1)*25:x<0.3?50+((x-0.1)/0.2)*25:Math.min(100,75+((x-0.3)/0.7)*25),
       zones:[{w:25,c:'bad'},{w:25,c:'neutral'},{w:50,c:'good'}],
       cls:x=>x>revGrowthGood?'good':x>revGrowthBad?'neutral':'bad',
       verdict:x=>x>revGrowthGood*2?'고성장':x>revGrowthGood?'양호':x>revGrowthBad?'성장 중':'역성장',
       hint:`${pctThr(revGrowthBad)} 미만 = 부진 · ${pctThr(revGrowthGood)} 이상 = 양호`},
      {l:'이익 성장',sub:'전년 대비',k:'earnGrowth',v:earnGrowth,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?Math.max(0,25+x*100):x<0.1?25+(x/0.1)*25:x<0.3?50+((x-0.1)/0.2)*25:Math.min(100,75+((x-0.3)/0.7)*25),
       zones:[{w:25,c:'bad'},{w:25,c:'neutral'},{w:50,c:'good'}],
       cls:x=>x>earnGrowthGood?'good':x>earnGrowthBad?'neutral':'bad',
       verdict:x=>x>earnGrowthGood*2?'우수':x>earnGrowthGood?'양호':x>earnGrowthBad?'성장 중':'이익 감소',
       hint:`${pctThr(earnGrowthBad)} 미만 = 감소 · ${pctThr(earnGrowthGood)} 이상 = 양호`},
      {l:'ROE',sub:'자기자본이익률',k:'roe',v:roe,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?Math.max(0,15+x*150):x<0.08?15+(x/0.08)*30:x<0.15?45+((x-0.08)/0.07)*30:Math.min(100,75+((x-0.15)/0.15)*25),
       zones:[{w:15,c:'bad'},{w:30,c:'neutral'},{w:55,c:'good'}],
       cls:x=>x>roeGood?'good':x>roeBad?'neutral':'bad',
       verdict:x=>x>roeGood*1.3?'매우 우수':x>roeGood?'우수':x>roeBad?'양호':x>=0?'평범':'손실',
       hint:`${pctThr(roeBad)} 이상 = 양호 · ${pctThr(roeGood)} 이상 = 우수`},

// ─── 수급 동향 / 공매도·이상신호 탭 ────────────────────────────────────────
// 한국: 네이버 금융 frgn.naver / short.naver HTML 파싱
// 미국: Yahoo quoteSummary (institutionOwnership, majorHolders, defaultKeyStatistics)
// 이상신호: 이미 받아둔 차트로 거래량 급증 + 가격 급변일 탐지

function _parseKRDate(s){
  // "2026.05.09" 형식만 신뢰 (다른 셀의 가격/숫자 오인 방지)
  const m=String(s||'').trim().match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})$/);
  return m?`${m[1]}.${m[2].padStart(2,'0')}.${m[3].padStart(2,'0')}`:null;
}
function _parseSignedNum(s){
  if(s==null)return null;
  const t=String(s).replace(/[,\s]/g,'').replace(/[+]/g,'');
  if(t===''||t==='-'||t==='—')return null;
  const n=parseFloat(t);
  return isFinite(n)?n:null;
}

// 네이버 frgn.naver: 일자별 기관/외국인 순매매 + 외국인 보유율
async function getNaverInvestorFlow(code){
  try{
    const url=`https://finance.naver.com/item/frgn.naver?code=${encodeURIComponent(code)}`;
    const html=await fetchText(url,TTL.HTML);
    const doc=new DOMParser().parseFromString(html,'text/html');
    const rows=[];
    // 표 구조: 날짜 | 종가 | 전일비 | 등락률 | 거래량 | 기관 순매매 | 외국인 순매매 | 외국인 보유주수 | 외국인 보유율
    doc.querySelectorAll('table tr').forEach(tr=>{
      const tds=tr.querySelectorAll('td');
      if(tds.length<7)return;
      const date=_parseKRDate(tds[0].textContent);
      if(!date)return;
      // 등락률 셀이 +/- 표시(이미지 포함)이라 종가 변동분만 참고
      const close=_parseSignedNum(tds[1].textContent);
      const volume=_parseSignedNum(tds[4].textContent);
      const inst=_parseSignedNum(tds[5].textContent);
      const foreign=_parseSignedNum(tds[6].textContent);
      const fHold=tds.length>=9?_parseSignedNum(tds[8].textContent):null; // %
      rows.push({date,close,volume,inst,foreign,fHold});
    });
    return rows.length?rows:null;
  }catch(_){return null}
}

// 네이버 short.naver: 일자별 공매도 거래량/거래대금
async function getNaverShort(code){
  try{
    const url=`https://finance.naver.com/item/frgn.naver?code=${encodeURIComponent(code)}`.replace('frgn.naver','short.naver');
    const html=await fetchText(url,TTL.HTML);
    const doc=new DOMParser().parseFromString(html,'text/html');
    const rows=[];
    // 표 구조: 날짜 | 종가 | 전일비 | 등락률 | 거래량 | 공매도 거래량 | 공매도 거래대금
    doc.querySelectorAll('table tr').forEach(tr=>{
      const tds=tr.querySelectorAll('td');
      if(tds.length<6)return;
      const date=_parseKRDate(tds[0].textContent);
      if(!date)return;
      const volume=_parseSignedNum(tds[4].textContent);
      const shortVol=_parseSignedNum(tds[5].textContent);
      const shortVal=tds.length>=7?_parseSignedNum(tds[6].textContent):null;
      rows.push({date,volume,shortVol,shortVal,shortPct:volume&&shortVol?shortVol/volume*100:null});
    });
    return rows.length?rows:null;
  }catch(_){return null}
}

// 차트에서 이상신호 추출 (거래량 급증 + 가격 급변일)
function detectAnomalies(chart,opts={}){
  if(!chart||chart.length<25)return[];
  const{volMul=2.0,pctTh=4.0,maxOut=10}=opts;
  const out=[];
  for(let i=Math.max(20,chart.length-120);i<chart.length;i++){
    const row=chart[i];
    const prev=chart[i-1];
    if(!row||!prev||!row.v||!row.c||!prev.c)continue;
    // 직전 20일 평균 거래량 (당일 제외)
    let s=0,n=0;
    for(let j=Math.max(0,i-20);j<i;j++){if(chart[j]&&chart[j].v){s+=chart[j].v;n++}}
    const avg=n?s/n:null;
    const ratio=avg?row.v/avg:null;
    const ch=(row.c-prev.c)/prev.c*100;
    const tags=[];
    if(ratio!=null&&ratio>=volMul)tags.push({k:'vol',label:`거래량 ${ratio.toFixed(1)}x`});
    if(ch>=pctTh)tags.push({k:'up',label:`+${ch.toFixed(1)}%`});
    else if(ch<=-pctTh)tags.push({k:'dn',label:`${ch.toFixed(1)}%`});
    if(tags.length){
      const d=row.d;
      if(!(d instanceof Date)||isNaN(d))continue;
      const dStr=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      out.push({date:dStr,close:row.c,change:ch,volRatio:ratio,tags});
    }
  }
  return out.slice(-maxOut).reverse();
}

function _flowStat(label,value,sub){
  return `<div class="flow-stat"><div class="flow-stat-label">${label}</div><div class="flow-stat-value">${value}</div>${sub?`<div class="flow-stat-sub">${sub}</div>`:''}</div>`;
}
function _miniBar(val,maxAbs){
  if(val==null||!maxAbs)return '<span class="flow-mini-bar"></span>';
  const w=Math.min(50,Math.abs(val)/maxAbs*50);
  const cls=val>0?'pos':val<0?'neg':'';
  const left=val>=0?50:50-w;
  return `<span class="flow-mini-bar"><span class="fill ${cls}" style="left:${left}%;width:${w}%"></span></span>`;
}
function _signed(v,unit=''){
  if(v==null||!isFinite(v))return '<span style="color:var(--text-tertiary)">—</span>';
  const cls=v>0?'pos':v<0?'neg':'';
  const sign=v>0?'+':'';
  return `<span class="${cls}">${sign}${Math.round(v).toLocaleString('ko-KR')}${unit}</span>`;
}

  const insiderPct=mh?.insidersPercentHeld?.raw;
  const instCount=mh?.institutionsCount?.raw;

  const fmtPctRaw=v=>v!=null&&isFinite(v)?(v*100).toFixed(2)+'%':'—';
  const fmtBigSh=v=>{
    if(v==null||!isFinite(v))return '—';
    const a=Math.abs(v);const s=v<0?'-':'';
    if(a>=1e9)return s+(a/1e9).toFixed(2)+'B';
    if(a>=1e6)return s+(a/1e6).toFixed(2)+'M';
    if(a>=1e3)return s+(a/1e3).toFixed(0)+'K';
    return s+Math.round(a).toString();
  };

  if(!mh&&!io.length&&!ns){
    box.innerHTML=`<div class="card"><div class="empty-state">Yahoo 공개 API에서 이 종목의 보유 정보를 가져오지 못했습니다. 미국 종목은 13F 분기 공시 기반이라 실시간성이 낮고, 일부 ETF/소형주는 공개되지 않을 수 있어요.</div></div>`;
    return;
  }

  const topHolders=io.slice(0,8);
  const topFunds=fo.slice(0,5);
  const recentInsiders=insiders.slice(0,8);

  const netInfo=ns?{
    period:ns.period||'',
    buyShares:ns.buyInfoShares?.raw,
    sellShares:ns.sellInfoShares?.raw,
    netShares:ns.netInfoShares?.raw,
    totalInsider:ns.totalInsiderShares?.raw,
    netPct:ns.netPercentInsiderShares?.raw,
  }:null;

  box.innerHTML=`
    <div class="card">
      <div class="section-title">소유 구조 (13F·SEC 공시 기반)</div>
      <div class="flow-summary">
        ${_flowStat('기관 보유 비중',fmtPctRaw(instPct),instCount?`보고 기관 ${instCount.toLocaleString()}곳`:'')}
        ${_flowStat('내부자 보유 비중',fmtPctRaw(insiderPct),'임원·이사·10%+ 주주')}
        ${_flowStat('펀드 보유 비중',fmtPctRaw(mh?.institutionsFloatPercentHeld?.raw),'유동 주식 기준')}
        ${_flowStat('내부자 순거래',netInfo?.netShares!=null?(netInfo.netShares>=0?'+':'')+fmtBigSh(netInfo.netShares):'—',netInfo?.period?`${netInfo.period} 합산`:'')}
      </div>
    </div>
    ${topHolders.length?`<div class="card">
      <div class="section-title">주요 기관 보유자 Top ${topHolders.length}</div>
      <div style="overflow-x:auto"><table class="flow-table">
        <thead><tr><th>기관</th><th>보유 주식</th><th>보유 비중</th><th>분기 변동</th><th>보고일</th></tr></thead>
        <tbody>
          ${topHolders.map(h=>`<tr>
            <td>${escAttr(h.organization||'—')}</td>
            <td>${fmtBigSh(h.position?.raw)}</td>
            <td>${fmtPctRaw(h.pctHeld?.raw)}</td>
            <td class="${(h.pctChange?.raw||0)>0?'pos':(h.pctChange?.raw||0)<0?'neg':''}">${h.pctChange?.raw!=null?(h.pctChange.raw>=0?'+':'')+(h.pctChange.raw*100).toFixed(2)+'%':'—'}</td>
            <td style="color:var(--text-secondary)">${h.reportDate?.fmt||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`:''}
    ${topFunds.length?`<div class="card">
      <div class="section-title">주요 펀드 보유자 Top ${topFunds.length}</div>
      <div style="overflow-x:auto"><table class="flow-table">
        <thead><tr><th>펀드</th><th>보유 주식</th><th>보유 비중</th><th>보고일</th></tr></thead>
        <tbody>
          ${topFunds.map(h=>`<tr>
            <td>${escAttr(h.organization||'—')}</td>
            <td>${fmtBigSh(h.position?.raw)}</td>
            <td>${fmtPctRaw(h.pctHeld?.raw)}</td>
            <td style="color:var(--text-secondary)">${h.reportDate?.fmt||'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`:''}
    ${recentInsiders.length?`<div class="card">
      <div class="section-title">최근 내부자 거래</div>
      <div style="overflow-x:auto"><table class="flow-table">
        <thead><tr><th>이름</th><th>거래</th><th>주식</th><th>가치</th><th>일자</th></tr></thead>
        <tbody>
          ${recentInsiders.map(t=>{
            const isBuy=/buy|purchase/i.test(t.transactionText||'');
            const isSell=/sale|sell/i.test(t.transactionText||'');
            const cls=isBuy?'pos':isSell?'neg':'';
            return `<tr>
              <td>${escAttr(t.filerName||'—')}<div style="color:var(--text-tertiary);font-size:11px">${escAttr(t.filerRelation||'')}</div></td>
              <td class="${cls}">${escAttr(t.transactionText||'—')}</td>
              <td>${fmtBigSh(t.shares?.raw)}</td>
              <td>${t.value?.raw!=null?'$'+fmtBigSh(t.value.raw):'—'}</td>
              <td style="color:var(--text-secondary)">${t.startDate?.fmt||'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </div>`:''}
    <div class="disclaimer">⓵ 미국 주식의 기관 보유 데이터는 SEC 13F 공시 기반으로 <strong>분기 단위·45일 지연</strong> 발표입니다. 단기 매매 동향이 아닌 큰 흐름 참고용으로 사용하세요.</div>
  `;
}

async function loadShort(yahooTicker,opts={},chart=[]){
  const{isKorean=false,code=''}=opts;
  const box=document.getElementById('short-content');
  box.innerHTML='<div class="card"><span class="loader"></span> 공매도·이상신호 불러오는 중...</div>';

  // 이상신호는 한·미 공통 (이미 로드된 차트 활용)
  const anomalies=detectAnomalies(chart);
  const anomalyCard=anomalies.length?`
    <div class="card">
      <div class="section-title">이상 거래 신호 <span style="color:var(--text-tertiary);font-weight:500;font-size:11.5px">· 최근 120일 중 거래량 2x↑ 또는 가격 ±4%↑ 일자</span></div>
      ${anomalies.map(a=>`<div class="anom-row">
        <span><span class="anom-date">${escAttr(a.date)}</span> <span class="anom-detail">${isKorean?fmtPriceKRW(a.close):'$'+fmtNum(a.close)}</span></span>
        <span style="display:flex;gap:6px;flex-wrap:wrap">${a.tags.map(t=>`<span class="anom-tag ${t.k}">${escAttr(t.label)}</span>`).join('')}</span>
      </div>`).join('')}
      <div class="mini-note">※ "이상신호" = 평소와 다른 거래 패턴. 호재·악재 뉴스나 기관 수급 변화로 발생하며, 그 자체로 매매 신호는 아닙니다.</div>
    </div>
  `:`<div class="card"><div class="empty-state">최근 120일 내 거래량/가격 측면의 이상 신호가 감지되지 않았습니다 (차분한 흐름).</div></div>`;

  if(isKorean){
    const shortRows=await getNaverShort(code);
    if(!shortRows||!shortRows.length){
      box.innerHTML=`${anomalyCard}<div class="card"><div class="empty-state">네이버 금융에서 이 종목의 공매도 데이터를 가져오지 못했어요.</div></div>`;
      return;
    }
    const recent=shortRows.slice(0,10);
    const avgShortPct=(()=>{const a=recent.filter(r=>r.shortPct!=null);return a.length?a.reduce((s,x)=>s+x.shortPct,0)/a.length:null})();
    const totalShortVol=recent.reduce((s,r)=>s+(r.shortVol||0),0);
    const totalShortVal=recent.reduce((s,r)=>s+(r.shortVal||0),0);
    const peakRow=recent.slice().sort((a,b)=>(b.shortPct||0)-(a.shortPct||0))[0];
    const fmtVol=v=>{
      if(v==null||!isFinite(v))return '—';
      const a=Math.abs(v);
      if(a>=1e8)return (a/1e8).toFixed(1)+'억주';
      if(a>=1e4)return Math.round(a/1e4).toLocaleString('ko-KR')+'만주';
      return Math.round(a).toLocaleString('ko-KR');
    };
    box.innerHTML=`
      <div class="card">
        <div class="section-title">공매도 요약 <span style="color:var(--text-tertiary);font-weight:500;font-size:11.5px">· 최근 ${recent.length}거래일</span></div>
        <div class="flow-summary">
          ${_flowStat('평균 공매도 비중',avgShortPct!=null?avgShortPct.toFixed(2)+'%':'—','거래량 대비')}
          ${_flowStat('최고 공매도 비중',peakRow?.shortPct!=null?peakRow.shortPct.toFixed(2)+'%':'—',peakRow?.date||'')}
          ${_flowStat('누적 공매도량',fmtVol(totalShortVol),'')}
          ${_flowStat('누적 공매도 거래대금',fmtBigKRW(totalShortVal),'')}
        </div>
      </div>
      <div class="card">
        <div class="section-title">일별 공매도</div>
        <div style="overflow-x:auto">
          <table class="flow-table">
            <thead><tr><th>날짜</th><th>거래량</th><th>공매도 거래량</th><th>비중</th><th>거래대금</th></tr></thead>
            <tbody>
              ${recent.map(r=>{
                const hot=r.shortPct!=null&&r.shortPct>=10;
                return `<tr>
                  <td>${escAttr(r.date)}</td>
                  <td style="color:var(--text-secondary)">${r.volume!=null?Math.round(r.volume).toLocaleString('ko-KR'):'—'}</td>
                  <td>${r.shortVol!=null?Math.round(r.shortVol).toLocaleString('ko-KR'):'—'}</td>
                  <td class="${hot?'neg':''}" style="font-weight:${hot?800:600}">${r.shortPct!=null?r.shortPct.toFixed(2)+'%':'—'}</td>
                  <td style="color:var(--text-secondary)">${r.shortVal!=null?fmtBigKRW(r.shortVal):'—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="mini-note">공매도 비중이 높은 날 = 그 날 거래된 주식 중 빌려서 판 비율이 큼 → 단기 약세 압력 신호일 수 있음. 다만 시장조성·헤지·차익거래 등 정상 거래도 포함됩니다.</div>
      </div>
      ${anomalyCard}
      <div class="disclaimer">데이터: 네이버 금융 일별 공매도. 공매도 잔고(미상환 수량) 정보는 KRX에서만 공식 제공되며 본 화면에는 미포함입니다.</div>
    `;
    return;
  }

  // 미국: Yahoo defaultKeyStatistics 스냅샷
  // getQuoteSummary 가 이미 동일 모듈을 검증된 race+fallback 으로 가져옴 (cachedFetch로 loadFundamental 과 캐시 공유).
  let ks={};
  try{ks=await getQuoteSummary(yahooTicker)||{}}catch(_){ks={}}
  const dks=ks.defaultKeyStatistics||{};
  const sd=ks.summaryDetail||{};
  const sharesShort=dks.sharesShort?.raw;
  const sharesShortPrev=dks.sharesShortPriorMonth?.raw;
  const shortRatio=dks.shortRatio?.raw; // days to cover
  const shortPctOfFloat=dks.shortPercentOfFloat?.raw;
  const shortPctOfShares=dks.sharesPercentSharesOut?.raw;
  const dateShortInterest=dks.dateShortInterest?.fmt;
  const float=sd.floatShares?.raw||dks.floatShares?.raw;

  const haveShort=[sharesShort,shortRatio,shortPctOfFloat].some(v=>v!=null);
  const fmtBigSh=v=>{
    if(v==null||!isFinite(v))return '—';
    const a=Math.abs(v);
    if(a>=1e9)return (a/1e9).toFixed(2)+'B';
    if(a>=1e6)return (a/1e6).toFixed(2)+'M';
    if(a>=1e3)return (a/1e3).toFixed(0)+'K';
    return Math.round(a).toString();
  };
  const shortDelta=(sharesShort!=null&&sharesShortPrev!=null)?sharesShort-sharesShortPrev:null;
  const shortDeltaPct=(sharesShort!=null&&sharesShortPrev)?(sharesShort/sharesShortPrev-1)*100:null;

  const shortCard=haveShort?`
    <div class="card">
      <div class="section-title">공매도 스냅샷 <span style="color:var(--text-tertiary);font-weight:500;font-size:11.5px">${dateShortInterest?`· 기준일 ${escAttr(dateShortInterest)}`:''}</span></div>
      <div class="flow-summary">
        ${_flowStat('공매도 잔고',fmtBigSh(sharesShort),'주')}
        ${_flowStat('Float 대비',shortPctOfFloat!=null?(shortPctOfFloat*100).toFixed(2)+'%':'—','유동 주식 기준')}
        ${_flowStat('Days to Cover',shortRatio!=null?shortRatio.toFixed(1)+'일':'—','평균 거래량으로 환매까지')}
        ${_flowStat('전월 대비',shortDeltaPct!=null?(shortDeltaPct>=0?'+':'')+shortDeltaPct.toFixed(1)+'%':'—',shortDelta!=null?(shortDelta>=0?'+':'')+fmtBigSh(shortDelta)+'주':'')}
      </div>
      <div class="mini-note">
        ${shortPctOfFloat!=null&&shortPctOfFloat>0.20?'⚠️ Float 대비 20% 초과 — 매우 높은 공매도. 숏스퀴즈 가능성도 함께 고려.':''}
        ${shortPctOfFloat!=null&&shortPctOfFloat>0.10&&shortPctOfFloat<=0.20?'🔸 Float 대비 10~20% — 공매도 압력이 큰 편.':''}
        ${shortPctOfFloat!=null&&shortPctOfFloat<=0.10?'🟢 Float 대비 10% 이하 — 일반적인 수준.':''}
      </div>
    </div>
  `:`<div class="card"><div class="empty-state">Yahoo 공개 API에서 공매도 정보를 가져오지 못했습니다. (FINRA 공시 갱신 주기 또는 ETF/소형주 미공개)</div></div>`;

  box.innerHTML=`${shortCard}${anomalyCard}<div class="disclaimer">미국 공매도 잔고는 FINRA가 <strong>2주에 1회</strong> 발표하며 시계열 차트는 본 화면에 미포함입니다. 시계열이 필요하면 NYSE/NASDAQ 공식 페이지를 참고하세요.</div>`;
}

// 탭 lazy 로드 상태 — run() 호출 시 매번 갱신
let _tabState=null;

// ─── 입력/키보드/외부클릭 핸들러 (자동완성 + 분석 트리거) ────────────────────
(function(){
  const input=document.getElementById('ticker');
  const list=document.getElementById('suggest-list');
  input.addEventListener('input',e=>handleSearchInput(e.target.value.trim()));
  input.addEventListener('focus',e=>{
    const v=e.target.value.trim();
    if(v)handleSearchInput(v);
  });
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();moveSuggest(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();moveSuggest(-1)}
    else if(e.key==='Enter'){
      if(_activeSuggest>=0){e.preventDefault();pickSuggestion(_activeSuggest)}
      else{hideSuggest();run()}
    }else if(e.key==='Escape'){hideSuggest()}
  });
  // 드롭다운 클릭은 위임 (개별 항목 핸들러 없음)
  list.addEventListener('mousedown',e=>{
    const item=e.target.closest('.suggest-item');
    if(!item)return;
    e.preventDefault(); // 인풋 blur 방지
    pickSuggestion(+item.dataset.i);
  });
  // 외부 클릭 시 닫기
  document.addEventListener('click',e=>{
    if(!e.target.closest('.search-row'))hideSuggest();
  });
})();
renderRecent();
</script>
