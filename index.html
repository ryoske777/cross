<html lang="ko">
<head>

<style>
:root{--bg:#faf8f3;--surface:#fff;--text:#1f1f1d;--text-secondary:#6c6c66;--text-tertiary:#a8a8a0;--border:rgba(0,0,0,0.08);--good:#2d8659;--good-bg:#e8f5ee;--bad:#c44343;--bad-bg:#fcebec;--neutral:#b07d2e;--neutral-bg:#fbf2e1;--primary:#1a4d8c;--primary-hover:#0e3a73;--price:#1a4d8c;--ma50:#d97942;--ma200:#6c6c66}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;min-height:100vh;line-height:1.5}
.container{max-width:840px;margin:0 auto}
header{margin-bottom:24px;text-align:center}
h1{font-size:26px;letter-spacing:-0.03em}
.subtitle{color:var(--text-secondary);font-size:13px;margin-top:6px}
.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.search-row{display:flex;gap:10px}
.ticker-input{flex:1;max-width:190px;padding:12px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;font-weight:700;text-transform:uppercase;outline:none}
.ticker-input:focus{border-color:var(--primary)}
button.primary{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
button.primary:hover{background:var(--primary-hover)}
.quick-buttons{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick-btn{background:#fff;border:1px solid var(--border);padding:6px 14px;font-size:13px;border-radius:6px;cursor:pointer;color:var(--text-secondary)}
.quick-btn:hover{border-color:var(--primary);color:var(--primary)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{padding:16px;background:var(--bg);border-radius:10px;text-align:center}
.metric-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.metric-value{font-size:18px;font-weight:850;letter-spacing:-0.02em}
.metric-note{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.signal{padding:14px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;gap:12px;font-size:14.5px;align-items:center}
.signal strong{white-space:nowrap}
.signal-good{background:var(--good-bg);color:var(--good)}
.signal-bad{background:var(--bad-bg);color:var(--bad)}
.signal-neutral{background:var(--neutral-bg);color:var(--neutral)}
.summary{margin-top:16px;padding:18px;border-radius:12px;font-weight:850;text-align:center;font-size:19px}
.summary-sub{font-size:13px;margin-top:6px;font-weight:500;opacity:0.86}
.section-title{font-size:14px;font-weight:800;margin-bottom:10px;color:var(--text-secondary)}
.legend{font-size:12px;color:var(--text-tertiary);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle;border-radius:10px}
.legend .p::before{background:var(--price)}
.legend .m50::before{background:var(--ma50)}

.loader{width:20px;height:20px;border:3px solid #CCC;border-bottom-color:var(--primary);border-radius:50%;display:inline-block;animation:rot 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes rot{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:rgba(255,255,255,0.52);border:1px solid var(--border);padding:6px;border-radius:12px}
.tab-btn{flex:1;border:none;background:transparent;color:var(--text-secondary);padding:11px 12px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.fundamental-hero{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.fundamental-hero{grid-template-columns:1.2fr 0.8fr;align-items:stretch}}
.company-box{background:var(--bg);border-radius:12px;padding:16px}
.company-name{font-size:20px;font-weight:900;letter-spacing:-0.03em}
.company-meta{font-size:12px;color:var(--text-secondary);margin-top:6px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:rgba(26,77,140,0.08);color:var(--primary)}

.fund-score .score-number{font-size:34px;font-weight:950;letter-spacing:-0.05em}
.fund-score .score-label{font-size:13px;color:var(--text-secondary);margin-top:2px}
.fund-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.fund-grid{grid-template-columns:repeat(4,1fr)}}
.fund-card{background:var(--bg);border-radius:12px;padding:15px;min-height:120px}
.fund-title{font-size:12px;color:var(--text-secondary);font-weight:800;margin-bottom:8px}
.fund-main{font-size:20px;font-weight:950;letter-spacing:-0.03em}
.fund-desc{font-size:11.5px;color:var(--text-secondary);margin-top:6px;line-height:1.45}
.bar-list{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar-label{color:var(--text-secondary);font-weight:800}
.bar-track{height:10px;background:rgba(0,0,0,0.07);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--primary);width:0%;transition:width .6s}

.empty-state{background:var(--neutral-bg);color:var(--neutral);border-radius:12px;padding:18px;font-size:14px;line-height:1.6}

<script>
const PROXIES=[
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
];

async function fetchJSON(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      const j=JSON.parse(t);
      if(!j||typeof j!=='object') throw new Error('empty response');
      return j;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('all proxies failed');
}
async function fetchText(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.text();
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('all proxies failed');
}

function setT(t){document.getElementById('ticker').value=t;run()}
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
}

async function getChart(ticker){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=2y&interval=1d`;
  try{
    const j=await fetchJSON(url);
    const r=j.chart.result[0];
    const ts=r.timestamp;
    const c=r.indicators.quote[0].close;
    const v=r.indicators.quote[0].volume;
    const out=[];
    for(let i=0;i<ts.length;i++){
      if(c[i]!=null) out.push({d:new Date(ts[i]*1000),c:c[i],v:v[i]||0});
    }
    return out;
  }catch(e){
    // Stooq backup
    const sym=ticker.toLowerCase()+'.us';
    const t=await fetchText(`https://stooq.com/q/d/l/?s=${sym}&i=d`);
    const lines=t.trim().split('\n').slice(1);
    return lines.map(l=>{const p=l.split(',');return{d:new Date(p[0]),c:+p[4],v:+p[5]||0}}).filter(x=>!isNaN(x.c)).slice(-520);
  }
}

async function getQuoteSummary(ticker){
  const modules='summaryDetail,defaultKeyStatistics,financialData,assetProfile,price,quoteType';
  const urls=[
    `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${modules}`,
    `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${modules}`
  ];
  let lastErr;
  for(const url of urls){
    try{
      const j=await fetchJSON(url);
      const row=j?.quoteSummary?.result?.[0];
      if(row) return row;
      lastErr=new Error(j?.quoteSummary?.error?.description||'no quoteSummary data');
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('no quoteSummary data');
}

async function getQuote(ticker){
  const url=`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(ticker)}`;
  const j=await fetchJSON(url);
  const row=j?.quoteResponse?.result?.[0];
  if(!row) throw new Error('no quote data');
  return row;
}

async function getFinvizData(ticker){
  try{
    const url=`https://finviz.com/quote.ashx?t=${encodeURIComponent(ticker)}&ty=c&ta=1&p=d`;
    const html=await fetchText(url);
    return parseFinvizHtml(html);
  }catch(_){return null}
}

async function getStockAnalysisData(ticker){
  try{
    const slug=String(ticker||'').toLowerCase().replace('.', '-');
    const url=`https://stockanalysis.com/stocks/${encodeURIComponent(slug)}/statistics/`;
    const html=await fetchText(url);
    return parseStockAnalysisHtml(html);
  }catch(_){return null}
}

const LAST_KNOWN_FUNDAMENTALS={
  // CORS 프록시가 모두 막힐 때 TSM 화면이 전부 공란이 되는 것을 막는 최후 대체값입니다.
  // 가능하면 Yahoo/Finviz/StockAnalysis 실시간 스크래핑 값이 먼저 사용됩니다.
  TSM:{
    asOf:'2026-05-06', source:'Finviz/StockAnalysis 스냅샷',
    name:'Taiwan Semiconductor Manufacturing ADR', sector:'Technology', industry:'Semiconductors', country:'Taiwan',
    mcap:2045.61e9, pe:32.78, fpe:20.16, peg:0.65, ps:15.40, pb:11.86,
    divY:0.0085, roe:0.3879, roa:0.2569, grossM:0.6102, opMargin:0.5318, profitM:0.4696,
    debtEq:17, currRatio:2.49, revGrowth:0.4049, earnGrowth:0.5155, beta:1.40
  }
};
function getLastKnownFundamental(ticker){return LAST_KNOWN_FUNDAMENTALS[String(ticker||'').toUpperCase()]||null}

const FUND_LABELS=[
  'Forward P/E','P/E','PEG','P/S','P/B','Market Cap','Dividend TTM','Dividend Est.','Dividend %','Dividend Yield',
  'ROE','ROA','Gross Margin','Oper. Margin','Operating Margin','Profit Margin','Debt/Eq','Debt / Equity','Current Ratio','Quick Ratio',
  'Sales Q/Q','Sales Y/Y TTM','Revenue Growth Forecast (5Y)','EPS this Y','EPS Y/Y TTM','EPS Q/Q','EPS next 5Y','EPS Growth Forecast (5Y)',
  'Beta','Beta (5Y)','PE Ratio','Forward PE','PS Ratio','PB Ratio','PEG Ratio','Return on Equity (ROE)','Return on Assets (ROA)',
  'Employees','Price','Sales','Income'
];
function decodeHtmlEntities(s){
  const text=String(s||'');
  if(typeof document!=='undefined'){
    const ta=document.createElement('textarea');
    ta.innerHTML=text;
    return ta.value;
  }
  return text
    .replace(/&nbsp;/gi,' ')
    .replace(/&amp;/gi,'&')
    .replace(/&lt;/gi,'<')
    .replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"')
    .replace(/&#39;/gi,"'");
}
function htmlToPlainText(html){
  return decodeHtmlEntities(String(html||'')
    .replace(/<script[\s\S]*?<\/script>/gi,' ')
    .replace(/<style[\s\S]*?<\/style>/gi,' ')
    .replace(/<[^>]+>/g,' '))
    .replace(/\s+/g,' ')
    .trim();
}
function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function metricBlocksFromText(text, labels=FUND_LABELS){
  const compact=String(text||'').replace(/\s+/g,' ').trim();
  const matches=[];
  const sorted=[...labels].sort((a,b)=>b.length-a.length);
  for(const label of sorted){
    const pat=escapeRegExp(label).replace(/\s+/g,'\\s+');
    const re=new RegExp(`(^|\\s)${pat}(?=\\s|:|$)`,'gi');
    let m;
    while((m=re.exec(compact))){
      const lead=m[1]?m[1].length:0;
      matches.push({label,start:m.index+lead,end:m.index+m[0].length});
    }
  }
  matches.sort((a,b)=>a.start-b.start || (b.end-b.start)-(a.end-a.start));
  const filtered=[];
  for(const m of matches){
    if(filtered.some(x=>m.start>=x.start&&m.end<=x.end)) continue;
    filtered.push(m);
  }
  filtered.sort((a,b)=>a.start-b.start);
  const out={};
  for(let i=0;i<filtered.length;i++){
    const cur=filtered[i];
    const next=filtered[i+1];
    if(out[cur.label]!=null) continue;
    let val=compact.slice(cur.end,next?next.start:cur.end+180).trim();
    val=val.replace(/^[\s:·•|–—-]+/,'').trim();
    if(val) out[cur.label]=val.slice(0,180).trim();
  }
  return out;
}
function firstMetric(m,...names){
  for(const n of names){
    const v=m?.[n];
    if(v!=null&&String(v).trim()!==''&&String(v).trim().toLowerCase()!=='n/a'&&String(v).trim()!=='-')return v;
  }
  return null;
}
function numFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const m=s.match(/-?\$?\s*([0-9]+(?:\.[0-9]+)?)/);
  if(!m)return null;
  const n=parseFloat(m[0].replace(/[$\s]/g,''));
  return isFinite(n)?n:null;
}
function pctFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const pm=s.match(/(-?[0-9]+(?:\.[0-9]+)?)\s*%/);
  if(pm){const n=parseFloat(pm[1]);return isFinite(n)?n/100:null}
  const n=numFromText(s);
  if(n==null)return null;
  return Math.abs(n)>1?n/100:n;
}
function bigFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const m=s.match(/-?\$?\s*([0-9]+(?:\.[0-9]+)?)\s*(trillion|billion|million|thousand|T|B|M|K)?/i);
  if(!m)return null;
  const n=parseFloat(m[1]);
  if(!isFinite(n))return null;
  const u=(m[2]||'').toLowerCase();
  const mult=u==='t'||u==='trillion'?1e12:u==='b'||u==='billion'?1e9:u==='m'||u==='million'?1e6:u==='k'||u==='thousand'?1e3:1;
  return n*mult;
}
function parseFinvizHtml(html){
  const m={};
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const lbls=Array.from(doc.querySelectorAll('td.snapshot-td2-cp, td[class*="snapshot"]'));
    const vals=Array.from(doc.querySelectorAll('td.snapshot-td2'));
    lbls.forEach((el,i)=>{const k=el.textContent.trim();const v=vals[i]?.textContent.trim()||'';if(k&&!m[k])m[k]=v});
  }catch(_){}
  const blocks=metricBlocksFromText(htmlToPlainText(html));
  for(const [k,v] of Object.entries(blocks)){if(!m[k])m[k]=v}
  const debt=numFromText(firstMetric(m,'Debt/Eq','LT Debt/Eq'));
  return{
    pe:        numFromText(firstMetric(m,'P/E')),
    fpe:       numFromText(firstMetric(m,'Forward P/E')),
    peg:       numFromText(firstMetric(m,'PEG')),
    ps:        numFromText(firstMetric(m,'P/S')),
    pb:        numFromText(firstMetric(m,'P/B')),
    divY:      pctFromText(firstMetric(m,'Dividend TTM','Dividend Est.','Dividend %','Dividend Yield')),
    roe:       pctFromText(firstMetric(m,'ROE')),
    roa:       pctFromText(firstMetric(m,'ROA')),
    grossM:    pctFromText(firstMetric(m,'Gross Margin')),
    opMargin:  pctFromText(firstMetric(m,'Oper. Margin','Operating Margin')),
    profitM:   pctFromText(firstMetric(m,'Profit Margin')),
    // Finviz Debt/Eq는 0.17 같은 배율 표기 → 내부 표시는 17(%)로 통일
    debtEq:    debt!=null?debt*100:null,
    currRatio: numFromText(firstMetric(m,'Current Ratio')),
    mcap:      bigFromText(firstMetric(m,'Market Cap')),
    earnGrowth:pctFromText(firstMetric(m,'EPS Y/Y TTM','EPS Q/Q','EPS this Y','EPS next 5Y')),
    revGrowth: pctFromText(firstMetric(m,'Sales Q/Q','Sales Y/Y TTM')),
    beta:      numFromText(firstMetric(m,'Beta'))
  };
}
function parseStockAnalysisHtml(html){
  const m=metricBlocksFromText(htmlToPlainText(html));
  const debt=numFromText(firstMetric(m,'Debt / Equity'));
  return{
    pe:        numFromText(firstMetric(m,'PE Ratio')),
    fpe:       numFromText(firstMetric(m,'Forward PE')),
    peg:       numFromText(firstMetric(m,'PEG Ratio')),
    ps:        numFromText(firstMetric(m,'PS Ratio')),
    pb:        numFromText(firstMetric(m,'PB Ratio')),
    divY:      pctFromText(firstMetric(m,'Dividend Yield')),
    roe:       pctFromText(firstMetric(m,'Return on Equity (ROE)')),
    roa:       pctFromText(firstMetric(m,'Return on Assets (ROA)')),
    grossM:    pctFromText(firstMetric(m,'Gross Margin')),
    opMargin:  pctFromText(firstMetric(m,'Operating Margin')),
    profitM:   pctFromText(firstMetric(m,'Profit Margin')),
    debtEq:    debt!=null?debt*100:null,
    currRatio: numFromText(firstMetric(m,'Current Ratio')),
    mcap:      bigFromText(firstMetric(m,'Market Cap')),
    earnGrowth:pctFromText(firstMetric(m,'EPS Growth Forecast (5Y)')),
    revGrowth: pctFromText(firstMetric(m,'Revenue Growth Forecast (5Y)')),
    beta:      numFromText(firstMetric(m,'Beta (5Y)'))
  };
}

function sma(arr,n){if(arr.length<n)return null;return arr.slice(-n).reduce((a,b)=>a+b,0)/n}
function rsi(closes,n=14){
  if(closes.length<n+1)return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}
  let ag=g/n,al=l/n;
  for(let i=n+1;i<closes.length;i++){const d=closes[i]-closes[i-1];const u=d>0?d:0,dn=d<0?-d:0;ag=(ag*(n-1)+u)/n;al=(al*(n-1)+dn)/n}
  if(al===0)return 100;
  return 100-100/(1+ag/al);
}
function pct(a,b){return((a-b)/b)*100}
function fmtNum(n,d=2){if(n==null||!isFinite(n))return'—';return n.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})}
function fmtPct(n,d=1){if(n==null||!isFinite(n))return'—';return(n>=0?'+':'')+n.toFixed(d)+'%'}
function fmtBig(n){if(n==null||!isFinite(n))return'—';const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2)+'T';if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';return n.toLocaleString()}

async function run(){
  const ticker=document.getElementById('ticker').value.trim().toUpperCase();
  if(!ticker)return;
  const status=document.getElementById('status');
  status.style.display='block';status.innerHTML='<span class="loader"></span> 데이터 불러오는 중...';
  document.getElementById('results').style.display='none';

  let chart,spy,qqq;
  try{
    [chart,spy,qqq]=await Promise.all([getChart(ticker),getChart('SPY'),getChart('QQQ')]);
  }catch(e){
    status.innerHTML='<div class="empty-state">차트 데이터 로드 실패: '+e.message+'</div>';return;
  }

  // Technical
  const closes=chart.map(x=>x.c);
  const vols=chart.map(x=>x.v);
  const last=closes[closes.length-1];
  const ma50=sma(closes,50),ma200=sma(closes,200);
  const r=rsi(closes);
  const r1m=closes.length>=22?pct(last,closes[closes.length-22]):null;
  const r3m=closes.length>=66?pct(last,closes[closes.length-66]):null;
  const r6m=closes.length>=132?pct(last,closes[closes.length-132]):null;
  const r1y=closes.length>=252?pct(last,closes[closes.length-252]):null;
  const volAvg=sma(vols,20);
  const volRatio=volAvg?vols[vols.length-1]/volAvg:null;

  const sLast=spy[spy.length-1].c, qLast=qqq[qqq.length-1].c;
  const sR3=spy.length>=66?pct(sLast,spy[spy.length-66].c):0;
  const qR3=qqq.length>=66?pct(qLast,qqq[qqq.length-66].c):0;
  const rsSpy=r3m!=null?r3m-sR3:null;
  const rsQqq=r3m!=null?r3m-qR3:null;

  document.getElementById('metrics').innerHTML=[
    ['현재가','$'+fmtNum(last),''],
    ['RSI(14)',r?r.toFixed(1):'—',r?(r>70?'과매수':r<30?'과매도':'중립'):''],
    ['3개월 수익률',fmtPct(r3m),''],
    ['거래량 비율',volRatio?volRatio.toFixed(2)+'x':'—','20일 평균 대비'],
  ].map(m=>`<div class="metric"><div class="metric-label">${m[0]}</div><div class="metric-value">${m[1]}</div><div class="metric-note">${m[2]}</div></div>`).join('');

  const sigs=[];
  const sig=(ok,bad,txt,val,w=1)=>sigs.push({ok,bad,txt,val,w});
  sig(ma200&&last>ma200,ma200&&last<ma200,'200일선 위',ma200?'$'+fmtNum(ma200):'—',3);
  sig(ma50&&ma200&&ma50>ma200,ma50&&ma200&&ma50<ma200,'골든크로스(50>200)','',3);
  sig(ma50&&last>ma50,ma50&&last<ma50,'50일선 위',ma50?'$'+fmtNum(ma50):'—',2);
  sig(r!=null&&r>=50&&r<70,r!=null&&r<50,'RSI 구간(50~70)',r!=null?r.toFixed(1):'—',2);
  sig(r3m!=null&&r3m>5,r3m!=null&&r3m<0,'3개월 수익률 강세',fmtPct(r3m),2);
  sig(r6m!=null&&r6m>10,r6m!=null&&r6m<0,'6개월 수익률 강세',fmtPct(r6m),2);
  sig(r1y!=null&&r1y>20,r1y!=null&&r1y<0,'1년 수익률 강세',fmtPct(r1y),2);
  sig(rsSpy!=null&&rsSpy>0,rsSpy!=null&&rsSpy<0,'SPY 대비 강세',fmtPct(rsSpy),2);
  sig(rsQqq!=null&&rsQqq>0,rsQqq!=null&&rsQqq<0,'QQQ 대비 강세',fmtPct(rsQqq),2);
  sig(r1m!=null&&r1m>0,r1m!=null&&r1m<0,'1개월 수익률 양호',fmtPct(r1m),1);
  sig(volRatio!=null&&volRatio>1.2,volRatio!=null&&volRatio<0.7,'거래량 활발',volRatio?volRatio.toFixed(2)+'x':'—',1);

  document.getElementById('signals').innerHTML=sigs.map(s=>{
    const cls=s.ok?'signal-good':s.bad?'signal-bad':'signal-neutral';
    const ic=s.ok?'✓':s.bad?'✗':'•';
    return `<div class="signal ${cls}"><span>${ic} ${s.txt}</span><strong>${s.val}</strong></div>`;
  }).join('');

  const totalW=sigs.reduce((s,x)=>s+x.w,0);
  const earnedW=sigs.filter(s=>s.ok).reduce((s,x)=>s+x.w,0);
  const ratio=totalW>0?earnedW/totalW:0;
  let verdict,bg;
  if(ratio>=0.65){verdict='🚀 강한 모멘텀';bg='var(--good-bg)';}
  else if(ratio>=0.40){verdict='⚖️ 혼조';bg='var(--neutral-bg)';}
  else{verdict='🔻 약세';bg='var(--bad-bg)';}
  document.getElementById('summary').innerHTML=`<div class="summary" style="background:${bg}">${verdict}<div class="summary-sub">가중 점수 ${earnedW} / ${totalW}</div></div>`;

  // Fundamental
  await loadFundamental(ticker);

  status.style.display='none';
  document.getElementById('results').style.display='block';
}

async function loadFundamental(ticker){
  const box=document.getElementById('fund-content');
  box.innerHTML='<div class="card"><span class="loader"></span> 펀더멘털 불러오는 중...</div>';
  const makeRaw=v=>v==null||!isFinite(v)?undefined:{raw:v,fmt:String(v)};
  const fallbackFundamental=async()=>{
    let q={};
    try{q=await getQuote(ticker)}catch(_){q={}}
    const chart=await getChart(ticker);
    const closes=chart.map(x=>x.c);
    const last=closes[closes.length-1];
    const y0=closes[0];
    const yHigh=Math.max(...closes), yLow=Math.min(...closes);
    const momentum=last&&y0?pct(last,y0):null;
    const pseudoScore=Math.max(25,Math.min(75,50+(momentum||0)/2));
    return {
      summaryDetail:{
        marketCap:makeRaw(q.marketCap), trailingPE:makeRaw(q.trailingPE), forwardPE:makeRaw(q.forwardPE),
        dividendYield:makeRaw(q.trailingAnnualDividendYield), beta:makeRaw(q.beta), priceToSalesTrailing12Months:makeRaw(q.priceToSalesTrailing12Months)
      },
      defaultKeyStatistics:{priceToBook:makeRaw(q.priceToBook), trailingPE:makeRaw(q.trailingPE), beta:makeRaw(q.beta)},
      financialData:{revenueGrowth:makeRaw(momentum!=null?momentum/100:null)},
      assetProfile:{sector:q.sector, industry:q.industry, country:q.market||''},
      price:{longName:q.longName||q.shortName||ticker, shortName:q.shortName||ticker, marketCap:makeRaw(q.marketCap)},
      quoteType:{quoteType:q.quoteType||'EQUITY'},
      _fallback:{last,yHigh,yLow,momentum,pseudoScore}
    };
  };
  let r, usedFallback=false;
  try{r=await getQuoteSummary(ticker)}catch(_){r=await fallbackFundamental();usedFallback=true}
  // Yahoo에서 빠진 값은 Finviz + StockAnalysis로 보완. 둘 다 실패하면 TSM은 최후 스냅샷 사용.
  const [fvz,sa]=await Promise.all([getFinvizData(ticker),getStockAnalysisData(ticker)]);
  const known=getLastKnownFundamental(ticker);
  let knownUsed=false;
  try{
    const sd=r.summaryDetail||{}, ks=r.defaultKeyStatistics||{}, fd=r.financialData||{}, ap=r.assetProfile||{}, pr=r.price||{}, qt=r.quoteType||{};
    const v=o=>o&&o.raw!=null?o.raw:null;
    const pickNum=(key,...vals)=>{
      for(const x of vals){if(x!=null&&isFinite(x))return x}
      if(known&&known[key]!=null&&isFinite(known[key])){knownUsed=true;return known[key]}
      return null;
    };

    const name=pr.longName||pr.shortName||qt.shortName||known?.name||ticker;
    const sector=ap.sector||known?.sector||(qt.quoteType==='ETF'?'ETF':'—');
    const industry=ap.industry||known?.industry||'—';
    const country=ap.country||known?.country||'';
    const employees=ap.fullTimeEmployees;
    const mcap=pickNum('mcap',v(sd.marketCap),v(pr.marketCap),fvz?.mcap,sa?.mcap);
    const pe=pickNum('pe',v(sd.trailingPE),v(ks.trailingPE),fvz?.pe,sa?.pe);
    const fpe=pickNum('fpe',v(sd.forwardPE),v(ks.forwardPE),fvz?.fpe,sa?.fpe);
    const pb=pickNum('pb',v(ks.priceToBook),fvz?.pb,sa?.pb);
    const ps=pickNum('ps',v(sd.priceToSalesTrailing12Months),fvz?.ps,sa?.ps);
    const divY=pickNum('divY',v(sd.dividendYield),fvz?.divY,sa?.divY);
    const roe=pickNum('roe',v(fd.returnOnEquity),fvz?.roe,sa?.roe);
    const roa=pickNum('roa',v(fd.returnOnAssets),fvz?.roa,sa?.roa);
    const margin=pickNum('profitM',v(fd.profitMargins),v(ks.profitMargins),fvz?.profitM,sa?.profitM);
    const opMargin=pickNum('opMargin',v(fd.operatingMargins),fvz?.opMargin,sa?.opMargin);
    const revGrowth=pickNum('revGrowth',v(fd.revenueGrowth),fvz?.revGrowth,sa?.revGrowth);
    const earnGrowth=pickNum('earnGrowth',v(fd.earningsGrowth),v(fd.earningsQuarterlyGrowth),fvz?.earnGrowth,sa?.earnGrowth);
    const debtEq=pickNum('debtEq',v(fd.debtToEquity),fvz?.debtEq,sa?.debtEq);
    const currentRatio=pickNum('currRatio',v(fd.currentRatio),fvz?.currRatio,sa?.currRatio);
    const beta=pickNum('beta',v(sd.beta),v(ks.beta),fvz?.beta,sa?.beta);
    let peg=pickNum('peg',v(ks.pegRatio),fvz?.peg,sa?.peg);
    let pegCalculated=false;
    if((peg==null||!isFinite(peg))&&pe!=null&&earnGrowth!=null&&earnGrowth>0){peg=pe/(earnGrowth*100);pegCalculated=true}
    const sourceParts=[];
    if(!usedFallback)sourceParts.push('Yahoo Finance');
    if(fvz)sourceParts.push('Finviz');
    if(sa)sourceParts.push('StockAnalysis');
    if(knownUsed&&known)sourceParts.push(`${known.source}(${known.asOf})`);
    const sourceNote=sourceParts.length?sourceParts.join(' + '):'공개 가격/차트 데이터';

    // scoring (0~100) — 값이 안 들어온 항목 자체를 감점하지 않고, 확보된 항목 기준으로 정규화
    const isETF=qt.quoteType==='ETF';
    const growthSectors=['Technology','Communication Services','Consumer Cyclical','Healthcare'];
    const isGrowth=growthSectors.some(s=>String(sector||'').includes(s));
    const peGood=isGrowth?38:22, peBad=isGrowth?60:38;
    let rawScore=0, maxScore=0, items=[];
    const add=(val,maxPts,pts,label)=>{if(val==null||!isFinite(val))return;rawScore+=pts;maxScore+=maxPts;items.push({label,pts,maxPts})};

    if(!isETF){
      add(pe,10, pe>0&&pe<peGood?10:pe>0&&pe<peBad?4:pe>0?-4:-8, 'P/E');
      add(peg,8, peg>0&&peg<1?8:peg>0&&peg<2?4:peg>0?-3:0, 'PEG');
      add(roe,15, roe>0.20?15:roe>0.10?8:roe>=0?2:-12, 'ROE');
      add(margin,12, margin>0.20?12:margin>0.05?6:margin>=0?1:-12, '순이익률');
      add(revGrowth,12, revGrowth>0.15?12:revGrowth>0?5:-10, '매출 성장');
      add(earnGrowth,10, earnGrowth>0.15?10:earnGrowth>0?4:-8, '이익 성장');
      add(debtEq,6, debtEq<50?6:debtEq<150?2:-8, '부채비율');
      add(currentRatio,5, currentRatio>1.5?5:currentRatio>1?2:-5, '유동비율');
    }else{
      add(1,10,10,'ETF — 분산 투자 특성');
      add(divY,5,divY>0.02?5:1,'배당');
    }
    const score=maxScore?Math.max(0,Math.min(100,Math.round((rawScore/maxScore)*100))):50;
    let grade,gColor;
    if(score>=70){grade='우수';gColor='var(--good)'}
    else if(score>=55){grade='양호';gColor='var(--primary)'}
    else if(score>=40){grade='보통';gColor='var(--neutral)'}
    else{grade='주의';gColor='var(--bad)'}

    const tagList=[];
    if(sector&&sector!=='—')tagList.push(sector);
    if(industry&&industry!=='—')tagList.push(industry);
    if(country)tagList.push(country);
    if(qt.quoteType)tagList.push(qt.quoteType);

    const cards=[
      {t:'시가총액',m:fmtBig(mcap),d:'기업 규모'},
      {t:'P/E (TTM)',m:pe!=null?fmtNum(pe):'—',d:fpe!=null?'Forward '+fmtNum(fpe):'주가/이익 비율'},
      {t:'PEG',m:peg!=null?fmtNum(peg):'—',d:pegCalculated?'이익 성장률 기반 계산값':'성장 대비 밸류'},
      {t:'P/B',m:pb!=null?fmtNum(pb):'—',d:'주가/순자산'},
      {t:'P/S',m:ps!=null?fmtNum(ps):'—',d:'주가/매출'},
      {t:'배당수익률',m:divY!=null?(divY*100).toFixed(2)+'%':'—',d:'연간 배당'},
      {t:'ROE',m:roe!=null?(roe*100).toFixed(1)+'%':'—',d:'자기자본이익률'},
      {t:'순이익률',m:margin!=null?(margin*100).toFixed(1)+'%':'—',d:opMargin!=null?'영업 '+(opMargin*100).toFixed(1)+'%':''},
    ];
    if(usedFallback&&r._fallback){
      cards.splice(0,0,
        {t:'현재가',m:'$'+fmtNum(r._fallback.last),d:'공개 가격 데이터 기준'},
        {t:'1년 범위',m:'$'+fmtNum(r._fallback.yLow)+' ~ $'+fmtNum(r._fallback.yHigh),d:'52주 유사 범위'},
        {t:'1년 변화',m:fmtPct(r._fallback.momentum),d:'차트 기반 대체 지표'}
      );
    }

    const bars=[
      {l:'매출 성장',v:revGrowth,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,(x+0.1)*333)),cls:x=>x>0.15?'good':x>0?'neutral':'bad'},
      {l:'이익 성장',v:earnGrowth,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,(x+0.1)*333)),cls:x=>x>0.15?'good':x>0?'neutral':'bad'},
      {l:'ROE',v:roe,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,x*333)),cls:x=>x>0.20?'good':x>0.10?'neutral':'bad'},
      {l:'순이익률',v:margin,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,x*333)),cls:x=>x>0.15?'good':x>0?'neutral':'bad'},
      {l:'부채비율(D/E)',v:debtEq,fmt:x=>x.toFixed(0)+'%',scale:x=>Math.max(0,Math.min(100,100-x/3)),cls:x=>x<50?'good':x<150?'neutral':'bad'},
    ].filter(b=>b.v!=null&&isFinite(b.v));

    const dets=[];
    if(pe!=null)dets.push({ok:pe>0&&pe<25,bad:pe<0||pe>40,t:`P/E ${fmtNum(pe)}`,v:pe>0&&pe<25?'합리적':pe>40?'고평가 우려':pe<0?'적자':'다소 높음'});
    if(roe!=null)dets.push({ok:roe>0.15,bad:roe<0,t:`ROE ${(roe*100).toFixed(1)}%`,v:roe>0.20?'매우 우수':roe>0.10?'양호':roe<0?'손실':'평범'});
    if(revGrowth!=null)dets.push({ok:revGrowth>0.10,bad:revGrowth<0,t:`매출 성장 ${(revGrowth*100).toFixed(1)}%`,v:revGrowth>0.15?'고성장':revGrowth>0?'성장':'역성장'});
    if(debtEq!=null)dets.push({ok:debtEq<50,bad:debtEq>200,t:`D/E ${debtEq.toFixed(0)}%`,v:debtEq<50?'재무 건전':debtEq<150?'보통':'부채 부담'});
    if(beta!=null)dets.push({ok:false,bad:false,t:`베타 ${fmtNum(beta)}`,v:beta>1.3?'고변동성':beta<0.7?'저변동성':'시장 수준'});

    box.innerHTML=`
      <div class="card">
        <div class="section-title">펀더멘털 요약</div>
        <div class="fundamental-hero">
          <div class="company-box">
            <div class="company-name">${name}</div>
            <div class="company-meta">${ticker}${employees?` · 직원 ${employees.toLocaleString()}명`:''}</div>
            <div class="tag-row">${tagList.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          </div>
          <div class="fund-score">
            <div class="score-number" style="color:${gColor}">${score}</div>
            <div class="score-label">펀더멘털 점수 — <strong style="color:${gColor}">${grade}</strong></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">한눈에 보는 핵심 항목</div>
        <div class="fund-grid">
          ${cards.map(c=>`<div class="fund-card"><div class="fund-title">${c.t}</div><div class="fund-main">${c.m}</div><div class="fund-desc">${c.d}</div></div>`).join('')}
        </div>
      </div>
      ${dets.length?`<div class="card">
        <div class="section-title">세부 판단</div>
        ${dets.map(d=>`<div class="signal ${d.ok?'signal-good':d.bad?'signal-bad':'signal-neutral'}"><span>${d.ok?'✓':d.bad?'✗':'•'} ${d.t}</span><strong>${d.v}</strong></div>`).join('')}
      </div>`:''}
      ${bars.length?`<div class="card">
        <div class="section-title">시각화</div>
        <div class="bar-list">
          ${bars.map(b=>`<div class="bar-row"><div class="bar-label">${b.l}</div><div class="bar-track"><div class="bar-fill ${b.cls(b.v)}" style="width:${b.scale(b.v)}%"></div></div><div class="bar-val">${b.fmt(b.v)}</div></div>`).join('')}
        </div>
        <div class="mini-note">※ 데이터 소스: ${sourceNote}. ${usedFallback?'Yahoo 상세 API가 제한되어 보강 소스를 우선 사용했습니다.':'Yahoo 상세 API를 우선 사용했습니다.'}${knownUsed&&known?' · 일부 값은 최후 대체 스냅샷입니다.':''} ETF/ADR은 소스별 산식 차이로 값이 조금 다를 수 있습니다.</div>
      </div>`:''}
    `;
  }catch(e){
    box.innerHTML=`<div class="card"><div class="section-title">펀더멘털 요약</div><div class="fundamental-hero"><div class="company-box"><div class="company-name">${ticker}</div><div class="company-meta">공개 데이터 연결이 제한되어 기본 분석만 표시합니다.</div><div class="tag-row"><span class="tag">대체 모드</span></div></div><div class="fund-score"><div class="score-number" style="color:var(--neutral)">50</div><div class="score-label">펀더멘털 점수 — <strong style="color:var(--neutral)">보통</strong></div></div></div></div><div class="card"><div class="empty-state">현재 무료 공개 소스에서 상세 지표를 찾지 못했습니다. 기술적 분석과 가격 기반 대체 지표를 함께 참고해 주세요.</div></div>`;
  }
}

// auto run
window.addEventListener('load',()=>run());
</script>
