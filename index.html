<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Momentum Checker — 주식 이평선 분석기</title>
    <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
    <style>
        :root {
            --bg: #faf8f3; --surface: #ffffff; --text: #1f1f1d;
            --text-secondary: #6c6c66; --text-tertiary: #a8a8a0;
            --border: rgba(0,0,0,0.08); --good: #2d8659; --good-bg: #e8f5ee;
            --bad: #c44343; --bad-bg: #fcebec; --neutral: #b07d2e;
            --neutral-bg: #fbf2e1; --primary: #1a4d8c; --primary-hover: #0e3a73;
            --price: #1a4d8c; --ma50: #d97942; --ma200: #6c6c66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Pretendard Variable", sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; line-height: 1.5; }
        .container { max-width: 720px; margin: 0 auto; }
        .card { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .search-row { display: flex; gap: 10px; }
        .ticker-input { flex: 1; max-width: 180px; padding: 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 16px; font-weight: 600; text-transform: uppercase; outline: none; }
        .ticker-input:focus { border-color: var(--primary); }
        button.primary { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; }
        .quick-buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .quick-btn { background: white; border: 1px solid var(--border); padding: 6px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); }
        .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 480px) { .metrics { grid-template-columns: repeat(4, 1fr); } }
        .metric { padding: 16px; background: var(--bg); border-radius: 10px; text-align: center; }
        .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 800; }
        .signal { padding: 14px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; font-size: 14.5px; align-items: center; }
        .signal-good { background: var(--good-bg); color: var(--good); }
        .signal-bad { background: var(--bad-bg); color: var(--bad); }
        .signal-neutral { background: var(--neutral-bg); color: var(--neutral); }
        .summary { margin-top: 16px; padding: 18px; border-radius: 12px; font-weight: 800; text-align: center; font-size: 18px; }
        .footer { text-align: center; color: var(--text-tertiary); font-size: 12px; margin-top: 40px; }
        .loader { width: 20px; height: 20px; border: 3px solid #CCC; border-bottom-color: var(--primary); border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <header style="margin-bottom:24px; text-align: center;">
        <h1 style="font-size: 26px;">📈 모멘텀 신호 체크</h1>
    </header>
    
    <div class="card">
        <div class="search-row">
            <input type="text" id="ticker" class="ticker-input" value="TSM" placeholder="티커 입력">
            <button class="primary" id="searchBtn">분석하기</button>
        </div>
        <div class="quick-buttons">
            <button class="quick-btn" data-ticker="TSM">TSM</button>
            <button class="quick-btn" data-ticker="NVDA">NVDA</button>
            <button class="quick-btn" data-ticker="AAPL">AAPL</button>
            <button class="quick-btn" data-ticker="MSFT">MSFT</button>
            <button class="quick-btn" data-ticker="QQQ">QQQ</button>
            <button class="quick-btn" data-ticker="SPY">SPY</button>
        </div>
    </div>

    <div id="status" style="display:none; text-align:center; padding:30px;" class="card"></div>

    <div id="results" style="display:none;">
        <div class="card">
            <div class="metrics" id="metrics"></div>
        </div>
        <div class="card">
            <div id="signals"></div>
            <div id="summary"></div>
        </div>
        <div class="card">
            <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 10px;">최근 6개월 추세 (파랑:가격 / 주황:50일선 / 회색점선:200일선)</div>
            <svg id="chart" viewBox="0 0 700 320" style="width:100%; height:auto;"></svg>
        </div>
    </div>

    <div class="footer">
        데이터 출처: Stooq.com (미국 주식) &copy; 2026
    </div>
</div>

<script>
const tickerInput = document.getElementById('ticker');
const searchBtn = document.getElementById('searchBtn');
const resultsDiv = document.getElementById('results');
const statusDiv = document.getElementById('status');

searchBtn.addEventListener('click', () => analyze(tickerInput.value.trim().toUpperCase()));
document.querySelectorAll('.quick-btn').forEach(b => b.addEventListener('click', () => analyze(b.dataset.ticker)));

async function analyze(ticker) {
    if(!ticker) return;
    tickerInput.value = ticker;
    showStatus('<span class="loader"></span> 최신 데이터를 분석 중입니다...', false);
    resultsDiv.style.display = 'none';

    try {
        const csv = await fetchStockData(ticker);
        const data = parseCSV(csv);
        
        // 데이터 정렬 및 유효성 검사
        data.sort((a, b) => a.date.localeCompare(b.date));
        
        if (data.length < 200) {
            throw new Error(`데이터가 부족합니다. (확보된 데이터: ${data.length}일치)`);
        }

        const closes = data.map(d => d.close);
        const ma50 = calculateSMA(closes, 50);
        const ma200 = calculateSMA(closes, 200);
        
        const current = {
            price: closes[closes.length - 1],
            ma50: ma50[ma50.length - 1],
            ma200: ma200[ma200.length - 1],
            high52: Math.max(...closes.slice(-Math.min(252, closes.length)))
        };

        if (isNaN(current.ma200)) throw new Error("장기 이동평균선 계산에 실패했습니다.");

        renderUI(current, ma50, ma200, data);
        statusDiv.style.display = 'none';
        resultsDiv.style.display = 'block';
    } catch (err) {
        showStatus('❌ ' + err.message, true);
    }
}

// Stooq에서 API key를 요구하는 경우 아래에 입력하세요.
// 예: const STOOQ_API_KEY = "발급받은키";
const STOOQ_API_KEY = "";

async function fetchStockData(ticker) {
    const symbol = normalizeStooqTicker(ticker);

    // 200일선 계산에는 1년보다 긴 데이터가 필요합니다.
    // 전체 이력을 받으면 무료 프록시의 용량 제한에 걸리기 쉬우므로 최근 3년만 요청합니다.
    const end = new Date();
    const start = new Date();
    start.setFullYear(end.getFullYear() - 3);

    const params = new URLSearchParams({
        s: symbol,
        d1: formatYYYYMMDD(start),
        d2: formatYYYYMMDD(end),
        i: "d"
    });

    if (STOOQ_API_KEY.trim()) {
        params.set("apikey", STOOQ_API_KEY.trim());
    }

    // Stooq CSV 다운로드 기본 형식: /q/d/l/?s=티커&i=d
    const baseUrl = `https://stooq.com/q/d/l/?${params.toString()}`;

    // direct는 CORS 설정에 따라 실패할 수 있으므로, 실패하면 프록시를 순차 시도합니다.
    const candidates = [
        { name: "direct", url: baseUrl },
        { name: "allorigins", url: `https://api.allorigins.win/raw?url=${encodeURIComponent(baseUrl)}` },
        // corsproxy.io는 ?url=<encoded-url> 형식이어야 합니다.
        { name: "corsproxy.io", url: `https://corsproxy.io/?url=${encodeURIComponent(baseUrl)}` },
        { name: "thingproxy", url: `https://thingproxy.freeboard.io/fetch/${baseUrl}` }
    ];

    const errors = [];

    for (const candidate of candidates) {
        try {
            const text = await fetchTextWithTimeout(candidate.url, 12000);
            const csv = unwrapPossibleProxyPayload(text);
            const lower = csv.toLowerCase();

            if (lower.includes("get your apikey") || lower.includes("get_apikey")) {
                throw new Error(`${candidate.name}: Stooq API key 필요`);
            }

            if (isValidStooqCSV(csv)) {
                return csv;
            }

            const preview = csv.replace(/\s+/g, " ").slice(0, 120);
            throw new Error(`${candidate.name}: CSV 응답이 아님 (${preview || "빈 응답"})`);
        } catch (e) {
            errors.push(e.message);
        }
    }

    console.warn("Stock fetch failed:", errors);

    if (!STOOQ_API_KEY.trim() && errors.some(e => e.toLowerCase().includes("api key"))) {
        throw new Error("Stooq가 CSV 다운로드에 API key를 요구했습니다. Stooq에서 키를 발급받아 코드의 STOOQ_API_KEY에 입력해주세요.");
    }

    throw new Error(`데이터를 가져오지 못했습니다. 티커가 맞다면 CORS 프록시 또는 Stooq 응답 문제입니다. 상세: ${errors[errors.length - 1] || "원인 미상"}`);
}

function normalizeStooqTicker(raw) {
    let t = (raw || "").trim().toLowerCase().replace(/\s+/g, "");
    if (!t) throw new Error("티커를 입력해주세요.");

    // 지수는 Stooq에서 ^SPX처럼 접미사 없이 사용합니다.
    if (t.startsWith("^")) return t;

    // 사용자가 TSM.US처럼 거래소 접미사를 이미 붙인 경우 중복으로 .us를 붙이지 않습니다.
    const knownMarketSuffixes = [".us", ".uk", ".de", ".jp", ".hk", ".pl", ".hu"];
    if (knownMarketSuffixes.some(suffix => t.endsWith(suffix))) return t;

    // BRK.B 같은 클래스 주식은 brk.b.us로 만들어야 하므로 점이 있어도 .us를 붙입니다.
    return `${t}.us`;
}

function formatYYYYMMDD(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}${m}${d}`;
}

async function fetchTextWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    try {
        const response = await fetch(url, {
            signal: controller.signal,
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        return await response.text();
    } finally {
        clearTimeout(timer);
    }
}

function unwrapPossibleProxyPayload(text) {
    const trimmed = text.trim();

    // AllOrigins의 /get 엔드포인트 등 JSON 포장 응답이 들어와도 처리할 수 있게 방어합니다.
    if (trimmed.startsWith("{")) {
        try {
            const json = JSON.parse(trimmed);
            if (typeof json.contents === "string") return json.contents;
        } catch (_) {}
    }

    return text;
}

function isValidStooqCSV(csv) {
    const lines = csv.trim().split(/\r?\n/);
    if (lines.length < 2) return false;

    const header = lines[0].toLowerCase().replace(/\s+/g, "");
    return header.includes("date") && header.includes("close");
}

function parseCSV(csv) {
    const lines = csv.trim().split('\n');
    const header = lines[0].toLowerCase().split(',');
    
    const closeIdx = header.indexOf('close');
    const dateIdx = header.indexOf('date');
    
    if (closeIdx === -1 || dateIdx === -1) throw new Error("데이터 형식을 읽을 수 없습니다.");

    return lines.slice(1).map(line => {
        const cols = line.split(',');
        return { 
            date: cols[dateIdx], 
            close: parseFloat(cols[closeIdx]) 
        };
    }).filter(d => !isNaN(d.close) && d.date);
}

function calculateSMA(data, period) {
    let result = new Array(data.length).fill(NaN);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
        sum += data[i];
        if (i >= period) sum -= data[i - period];
        if (i >= period - 1) result[i] = sum / period;
    }
    return result;
}

function showStatus(msg, isError) {
    statusDiv.style.display = 'block';
    statusDiv.innerHTML = msg;
    statusDiv.style.color = isError ? 'var(--bad)' : 'var(--text-secondary)';
}

function renderUI(cur, ma50, ma200, allData) {
    const dist52 = (cur.price / cur.high52 * 100).toFixed(1);
    document.getElementById('metrics').innerHTML = `
        <div class="metric"><div class="metric-label">현재가</div><div class="metric-value">$${cur.price.toFixed(2)}</div></div>
        <div class="metric"><div class="metric-label">50일선</div><div class="metric-value">$${cur.ma50.toFixed(1)}</div></div>
        <div class="metric"><div class="metric-label">200일선</div><div class="metric-value">$${cur.ma200.toFixed(1)}</div></div>
        <div class="metric"><div class="metric-label">52주 고점대비</div><div class="metric-value">${dist52}%</div></div>
    `;

    let signals = [];
    if (cur.price > cur.ma200) signals.push({type:'good', txt:'장기 추세 상방 유지'});
    else signals.push({type:'bad', txt:'장기 추세 하방 국면'});

    if (cur.ma50 > cur.ma200) signals.push({type:'good', txt:'이평선 정배열 상태'});
    else signals.push({type:'bad', txt:'이평선 역배열 상태'});

    document.getElementById('signals').innerHTML = signals.map(s => 
        `<div class="signal signal-${s.type}"><span>${s.txt}</span></div>`
    ).join('');

    const goodCount = signals.filter(s => s.type === 'good').length;
    const sumEl = document.getElementById('summary');
    sumEl.className = 'summary ' + (goodCount === 2 ? 'signal-good' : goodCount === 1 ? 'signal-neutral' : 'signal-bad');
    sumEl.textContent = goodCount === 2 ? "🚀 매수 우위" : goodCount === 1 ? "⚖️ 관망 필요" : "⚠️ 주의 요망";

    drawSimpleChart(allData.slice(-125).map(d => d.close), ma50.slice(-125), ma200.slice(-125));
}

function drawSimpleChart(prices, m50, m200) {
    const svg = document.getElementById('chart');
    const W = 700, H = 320, pad = 50;
    
    const validM200 = m200.filter(v => !isNaN(v));
    const allValues = [...prices, ...m50, ...validM200];
    const min = Math.min(...allValues) * 0.98;
    const max = Math.max(...allValues) * 1.02;
    
    const getX = (i) => (i / (prices.length - 1)) * (W - pad * 2) + pad;
    const getY = (v) => H - ((v - min) / (max - min)) * (H - pad * 2) - pad;
    
    const line = (data, color, isDash) => {
        let path = "";
        let started = false;
        data.forEach((v, i) => {
            if(isNaN(v)) return;
            const x = getX(i), y = getY(v);
            path += (started ? " L " : "M ") + x + " " + y;
            started = true;
        });
        return `<path d="${path}" fill="none" stroke="${color}" stroke-width="${isDash?1.5:2.5}" ${isDash?'stroke-dasharray="6 4"':''}/>`;
    };
    
    svg.innerHTML = line(m200, '#6c6c66', true) + line(m50, '#d97942', false) + line(prices, '#1a4d8c', false);
}
</script>
</body>
</html>
