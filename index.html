<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Momentum Checker Pro — 모멘텀 점수 분석기</title>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#faf8f3;--surface:#fff;--text:#1f1f1d;--text-secondary:#6c6c66;--text-tertiary:#a8a8a0;--border:rgba(0,0,0,0.08);--good:#2d8659;--good-bg:#e8f5ee;--bad:#c44343;--bad-bg:#fcebec;--neutral:#b07d2e;--neutral-bg:#fbf2e1;--primary:#1a4d8c;--primary-hover:#0e3a73;--price:#1a4d8c;--ma50:#d97942;--ma200:#6c6c66}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;min-height:100vh;line-height:1.5}
.container{max-width:840px;margin:0 auto}
header{margin-bottom:24px;text-align:center}
h1{font-size:26px;letter-spacing:-0.03em}
.subtitle{color:var(--text-secondary);font-size:13px;margin-top:6px}
.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.search-row{display:flex;gap:10px}
.ticker-input{flex:1;max-width:200px;padding:12px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;font-weight:700;outline:none}
.ticker-input:focus{border-color:var(--primary)}
button.primary{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
button.primary:hover{background:var(--primary-hover)}
.quick-buttons{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.quick-btn{background:#fff;border:1px solid var(--border);padding:6px 14px;font-size:13px;border-radius:6px;cursor:pointer;color:var(--text-secondary)}
.quick-btn:hover{border-color:var(--primary);color:var(--primary)}
.quick-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.quick-flag{font-size:14px;opacity:0.7}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{padding:16px;background:var(--bg);border-radius:10px;text-align:center}
.metric-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.metric-value{font-size:18px;font-weight:850;letter-spacing:-0.02em}
.metric-note{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.signal{padding:14px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;gap:12px;font-size:14.5px;align-items:center}
.signal strong{white-space:nowrap}
.signal-good{background:var(--good-bg);color:var(--good)}
.signal-bad{background:var(--bad-bg);color:var(--bad)}
.signal-neutral{background:var(--neutral-bg);color:var(--neutral)}
.summary{margin-top:16px;padding:18px;border-radius:12px;font-weight:850;text-align:center;font-size:19px}
.summary-sub{font-size:13px;margin-top:6px;font-weight:500;opacity:0.86}
.section-title{font-size:14px;font-weight:800;margin-bottom:10px;color:var(--text-secondary)}
.legend{font-size:12px;color:var(--text-tertiary);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle;border-radius:10px}
.legend .p::before{background:var(--price)}
.legend .m50::before{background:var(--ma50)}
.legend .m200::before{background:var(--ma200);border-top:2px dashed var(--ma200);height:0}
.footer{text-align:center;color:var(--text-tertiary);font-size:12px;margin-top:40px}
.loader{width:20px;height:20px;border:3px solid #CCC;border-bottom-color:var(--primary);border-radius:50%;display:inline-block;animation:rot 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes rot{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:rgba(255,255,255,0.52);border:1px solid var(--border);padding:6px;border-radius:12px}
.tab-btn{flex:1;border:none;background:transparent;color:var(--text-secondary);padding:11px 12px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.fundamental-hero{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.fundamental-hero{grid-template-columns:1.2fr 0.8fr;align-items:stretch}}
.company-box{background:var(--bg);border-radius:12px;padding:16px}
.company-name{font-size:20px;font-weight:900;letter-spacing:-0.03em}
.company-meta{font-size:12px;color:var(--text-secondary);margin-top:6px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:rgba(26,77,140,0.08);color:var(--primary)}
.tag.kr{background:rgba(196,67,67,0.08);color:var(--bad)}
.fund-score{background:linear-gradient(135deg,rgba(26,77,140,0.10),rgba(45,134,89,0.10));border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.fund-score .score-number{font-size:34px;font-weight:950;letter-spacing:-0.05em}
.fund-score .score-label{font-size:13px;color:var(--text-secondary);margin-top:2px}
.fund-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.fund-grid{grid-template-columns:repeat(4,1fr)}}
.fund-card{background:var(--bg);border-radius:12px;padding:15px;min-height:120px}
.fund-title{font-size:12px;color:var(--text-secondary);font-weight:800;margin-bottom:8px}
.fund-main{font-size:20px;font-weight:950;letter-spacing:-0.03em}
.fund-desc{font-size:11.5px;color:var(--text-secondary);margin-top:6px;line-height:1.45}
.bar-list{display:grid;gap:18px}
.bar-row{display:grid;grid-template-columns:1fr;gap:6px;font-size:13px}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar-label{color:var(--text-secondary);font-weight:800;display:inline-flex;align-items:center;gap:6px}
.bar-sub{color:var(--text-tertiary);font-weight:500;font-size:11.5px;margin-left:2px}
.bar-rating{display:flex;align-items:center;gap:8px}
.bar-val{font-weight:850;font-size:14.5px;letter-spacing:-.01em;color:var(--text)}
.bar-verdict{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.bar-verdict.good{background:var(--good-bg);color:var(--good)}
.bar-verdict.neutral{background:var(--neutral-bg);color:var(--neutral)}
.bar-verdict.bad{background:var(--bad-bg);color:var(--bad)}
.bar-track{position:relative;height:14px;background:rgba(0,0,0,0.04);border-radius:999px;overflow:hidden}
.bar-zones{position:absolute;inset:0;display:flex;opacity:.22}
.bar-zones .zone{height:100%}
.bar-zones .zone.zone-bad{background:var(--bad)}
.bar-zones .zone.zone-neutral{background:var(--neutral)}
.bar-zones .zone.zone-good{background:var(--good)}
.bar-marker{position:absolute;top:-3px;bottom:-3px;width:4px;background:var(--text);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px rgba(255,255,255,.95);transition:left .6s}
.bar-hint{font-size:11px;color:var(--text-tertiary);line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 10px}
.bar-hint span{white-space:nowrap}
.mini-note{margin-top:12px;color:var(--text-tertiary);font-size:12px;line-height:1.55}
.empty-state{background:var(--neutral-bg);color:var(--neutral);border-radius:12px;padding:18px;font-size:14px;line-height:1.6}

/* Recent ticker history */
.recent-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.recent-label{font-size:12px;color:var(--text-tertiary);font-weight:700}
.recent-chip{display:inline-flex;align-items:center;gap:0;background:#fff;border:1px solid var(--border);padding:5px 4px 5px 11px;font-size:12.5px;border-radius:999px;cursor:pointer;color:var(--text-secondary);font-weight:600;font-family:inherit}
.recent-chip:hover{border-color:var(--primary);color:var(--primary)}
.recent-chip .recent-chip-text{padding-right:6px}
.recent-x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.04);color:var(--text-tertiary);font-size:13px;line-height:1;margin-left:0;border:none;cursor:pointer;font-family:inherit;padding:0}
.recent-x:hover{background:var(--bad);color:#fff}
.recent-clear{background:none;border:none;color:var(--text-tertiary);font-size:11.5px;padding:4px 6px;cursor:pointer;margin-left:auto;font-family:inherit}
.recent-clear:hover{color:var(--bad)}

/* Info tooltip system (cross-platform: hover + tap) */
.info-tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.08);color:var(--text-secondary);font-size:10px;font-weight:800;cursor:help;user-select:none;border:none;padding:0;margin:0 0 0 4px;font-family:inherit;line-height:1;vertical-align:1px;flex-shrink:0}
.info-tip:hover,.info-tip:focus-visible{background:var(--primary);color:#fff;outline:none}
.tooltip-popover{position:absolute;z-index:1000;max-width:min(320px,calc(100vw - 16px));background:#1f1f1d;color:#fff;font-size:12.5px;line-height:1.65;padding:11px 13px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:pre-line;word-break:keep-all;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease;top:0;left:0}
.tooltip-popover.show{opacity:1;visibility:visible}

/* Card sub-explanation for beginners */
.fund-sub{font-size:11px;color:var(--text-tertiary);margin-top:8px;line-height:1.5;border-top:1px dashed rgba(0,0,0,.06);padding-top:6px}
.fund-title{display:flex;align-items:center}
.signal span{display:inline-flex;align-items:center;gap:6px}
</style>

</div>

<script>
const PROXIES=[
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
];

async function fetchJSON(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      const j=JSON.parse(t);
      if(!j||typeof j!=='object') throw new Error('empty response');
      return j;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('all proxies failed');
}
async function fetchText(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.text();
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('all proxies failed');
}

// ─── Korean stock utilities ───────────────────────────────────────────────────
function isKoreanTicker(t){return /^\d{6}$/.test(String(t||'').trim())}

async function resolveKoreanTicker(code){
  for(const sfx of ['.KS','.KQ']){
    try{
      const url=`https://query1.finance.yahoo.com/v8/finance/chart/${code}${sfx}?range=5d&interval=1d`;
      const j=await fetchJSON(url);
      if(j?.chart?.result?.[0]) return{yahooTicker:code+sfx,market:sfx==='.KS'?'KOSPI':'KOSDAQ'};
    }catch(_){}
  }
  throw new Error('KOSPI/KOSDAQ 모두에서 해당 종목을 찾을 수 없습니다 (코드를 확인해 주세요)');
}

function fmtPriceKRW(n){
  if(n==null||!isFinite(n))return'—';
  return'₩'+Math.round(n).toLocaleString('ko-KR');
}
function fmtBigKRW(n){
  if(n==null||!isFinite(n))return'—';
  const a=Math.abs(n);
  if(a>=1e12)return(n/1e12).toFixed(1)+'조원';
  if(a>=1e8)return Math.round(n/1e8)+'억원';
  if(a>=1e4)return Math.round(n/1e4)+'만원';
  return'₩'+Math.round(n).toLocaleString('ko-KR');
}

async function getNaverFinanceData(code){
  try{
    const url=`https://finance.naver.com/item/main.naver?code=${encodeURIComponent(code)}`;
    const html=await fetchText(url);
    const doc=new DOMParser().parseFromString(html,'text/html');
    const m={};
    const text=htmlToPlainText(html);

    // DOM 파싱: .per_table의 th/td 구조 + 추가 테이블 스캔
    doc.querySelectorAll('table tr').forEach(row=>{
      const cells=row.querySelectorAll('th,td');
      let lastKey=null;
      cells.forEach(cell=>{
        const cellText=cell.textContent.trim();
        if(cell.tagName==='TH'||cellText.match(/^(PER|PBR|ROE|ROA|부채|매출|이익|배당|EPS)/)){
          lastKey=cellText.replace(/[:\s]+$/,'');
        }else if(lastKey&&cell.tagName==='TD'){
          const em=cell.querySelector('em');
          let val=(em?em.textContent:cellText).trim().replace(/[,배원%]/g,'');
          if(val&&val!=='—'&&!m[lastKey])m[lastKey]=val;
          lastKey=null;
        }
      });
    });

    // 텍스트 정규식 추출 — 여러 패턴 시도
    const tryRegex=(key,patterns)=>{
      if(!m[key]&&Array.isArray(patterns)){
        for(const re of patterns){
          const x=text.match(re);
          if(x){m[key]=x[1];break}
        }
      }
    };
    // 엄격한 패턴: 라벨과 값 사이에 공백/콜론/파이프만 허용 (다른 필드 숫자 오인 방지)
    const SEP='\\s*[:：|]?\\s*';
    const NUM='(-?[0-9]+(?:\\.[0-9]+)?)';
    tryRegex('PER',[new RegExp(`(?:^|\\s)PER${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`주가수익비율${SEP}${NUM}\\s*배`)]);
    tryRegex('PBR',[new RegExp(`(?:^|\\s)PBR${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`주가순자산비율${SEP}${NUM}\\s*배`)]);
    tryRegex('추정PER',[new RegExp(`추정\\s*PER${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`Forward\\s*(?:PER|P/E)${SEP}${NUM}`)]);
    tryRegex('PSR',[new RegExp(`(?:^|\\s)P/S${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`주가매출액비율${SEP}${NUM}`)]);
    tryRegex('ROE',[new RegExp(`(?:^|\\s)ROE${SEP}${NUM}\\s*%`),new RegExp(`자기자본이익률${SEP}${NUM}\\s*%`)]);
    tryRegex('ROA',[new RegExp(`(?:^|\\s)ROA${SEP}${NUM}\\s*%`),new RegExp(`총자산이익률${SEP}${NUM}\\s*%`)]);
    // 배당수익률은 "배당성향(payout ratio)"과 헷갈리지 않도록 매우 엄격하게
    tryRegex('배당수익률',[new RegExp(`시가배당률${SEP}${NUM}\\s*%`),new RegExp(`배당수익률${SEP}${NUM}\\s*%`)]);
    tryRegex('부채비율',[new RegExp(`(?:^|\\s)부채비율${SEP}${NUM}\\s*%`)]);
    tryRegex('유동비율',[new RegExp(`(?:^|\\s)유동비율${SEP}${NUM}\\s*%`)]);
    // 순이익률/영업이익률은 라벨 직후의 % 값만 (성장률 등 다른 필드와 분리)
    tryRegex('순이익률',[new RegExp(`(?:^|\\s)순이익률${SEP}${NUM}\\s*%`)]);
    tryRegex('영업이익률',[new RegExp(`(?:^|\\s)영업이익률${SEP}${NUM}\\s*%`)]);
    tryRegex('매출액증가율',[new RegExp(`매출액증가율${SEP}${NUM}\\s*%`)]);
    tryRegex('당기순이익증가율',[new RegExp(`당기순이익증가율${SEP}${NUM}\\s*%`)]);

    // 시가총액 (조원/억원 단위)
    let mcap=null;
    const mcapEl=doc.querySelector('#_market_sum');
    if(mcapEl){
      const txt=mcapEl.textContent.trim().replace(/,/g,'');
      const joM=txt.match(/([0-9]+(?:\.[0-9]+)?)\s*조\s*([0-9]*)?/);
      if(joM){
        mcap=parseFloat(joM[1])*1e12;
        if(joM[2]&&joM[2].trim())mcap+=parseFloat(joM[2])*1e8;
      }else{
        const eokM=txt.match(/([0-9]+)/);
        if(eokM)mcap=parseFloat(eokM[1])*1e8;
      }
    }

    // 회사명 추출
    const nameEl=doc.querySelector('.wrap_company h2 a, .h_nm');
    const naverName=nameEl?nameEl.textContent.trim():null;

    const result={
      pe:numFromText(m['PER']||null),
      fpe:numFromText(m['추정PER']||null),
      pb:numFromText(m['PBR']||null),
      ps:numFromText(m['PSR']||null),
      divY:pctFromText(m['배당수익률']||null),
      roe:pctFromText(m['ROE']||null),
      roa:pctFromText(m['ROA']||null),
      debtEq:numFromText(m['부채비율']||null),
      currRatio:numFromText(m['유동비율']||null),
      profitM:pctFromText(m['순이익률']||null),
      opMargin:pctFromText(m['영업이익률']||null),
      revGrowth:pctFromText(m['매출액증가율']||null),
      earnGrowth:pctFromText(m['당기순이익증가율']||null),
      mcap,
      naverName
    };

    // 하나라도 유효값이 있으면 반환
    if(Object.values(result).some(v=>v!=null)) return result;
    return null;
  }catch(_){return null}
}

// ─── 툴팁 팝오버 (데스크톱 hover + 모바일 tap, 줄바꿈 안전) ────────────────────
(function(){
  let tipEl=null;
  let activeKey=null;
  let touchUsed=false;
  function ensureEl(){
    if(tipEl)return tipEl;
    tipEl=document.createElement('div');
    tipEl.className='tooltip-popover';
    tipEl.setAttribute('role','tooltip');
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function position(target){
    const el=ensureEl();
    const r=target.getBoundingClientRect();
    el.style.visibility='hidden';
    el.style.opacity='0';
    el.classList.add('show');
    const tw=el.offsetWidth,th=el.offsetHeight;
    const vw=document.documentElement.clientWidth;
    const padding=8;
    let left=r.left+r.width/2-tw/2+window.scrollX;
    if(left<8)left=8;
    if(left+tw>vw-8)left=Math.max(8,vw-8-tw);
    let top=r.bottom+padding+window.scrollY;
    const spaceBelow=window.innerHeight-r.bottom;
    if(spaceBelow<th+padding+8&&r.top>th+padding+8){
      top=r.top-th-padding+window.scrollY;
    }
    el.style.left=left+'px';
    el.style.top=top+'px';
    el.style.visibility='';
    el.style.opacity='';
  }
  function show(target,key){
    const g=GLOSSARY[key];
    if(!g)return;
    const el=ensureEl();
    el.textContent=g.long;
    activeKey=key;
    requestAnimationFrame(()=>position(target));
  }
  function hide(){
    if(!tipEl)return;
    tipEl.classList.remove('show');
    activeKey=null;
  }
  // 터치 이벤트 감지 (모바일에서 hover 충돌 방지)
  document.addEventListener('touchstart',()=>{touchUsed=true},{passive:true,once:true});
  // hover (데스크톱)
  document.addEventListener('mouseover',e=>{
    if(touchUsed)return;
    const t=e.target.closest('[data-tip-key]');
    if(!t)return;
    show(t,t.dataset.tipKey);
  });
  document.addEventListener('mouseout',e=>{
    if(touchUsed)return;
    const t=e.target.closest('[data-tip-key]');
    if(!t)return;
    if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip-key]')===t)return;
    hide();
  });
  // tap / click (모바일·데스크톱 공통 토글)
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-tip-key]');
    if(t){
      e.preventDefault();
      e.stopPropagation();
      const k=t.dataset.tipKey;
      if(activeKey===k&&tipEl&&tipEl.classList.contains('show')){hide()}
      else{show(t,k)}
      return;
    }
    if(!e.target.closest('.tooltip-popover'))hide();
  });
  // 키보드 접근성
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
  document.addEventListener('focusin',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip-key]');
    if(t)show(t,t.dataset.tipKey);
  });
  document.addEventListener('focusout',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip-key]');
    if(t)hide();
  });
  // 스크롤·리사이즈 시 닫기 (위치 어긋남 방지)
  window.addEventListener('scroll',()=>{if(activeKey)hide()},{passive:true});
  window.addEventListener('resize',()=>{if(activeKey)hide()});
})();

const RECENT_KEY='momcheck.recent.v1';

function tickerLabel(t){
  const u=String(t||'').trim().toUpperCase();
  if(/^\d{6}$/.test(u))return KR_NAMES[u]||u;
  return u;
}
function escAttr(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addToRecent(t){
  const u=String(t||'').trim().toUpperCase();
  if(!u)return;
  const arr=loadRecent().filter(x=>x.t!==u);
  arr.unshift({t:u,l:tickerLabel(u)});
  saveRecent(arr);
  renderRecent();
}
function removeFromRecent(t){
  saveRecent(loadRecent().filter(x=>x.t!==t));
  renderRecent();
}
function clearRecent(){saveRecent([]);renderRecent()}
function renderRecent(){
  const el=document.getElementById('recent');
  if(!el)return;
  const arr=loadRecent();
  if(!arr.length){el.style.display='none';el.innerHTML='';return}
  el.style.display='flex';
  el.innerHTML='<span class="recent-label">🕘 최근 본 종목</span>'
    +arr.map(x=>`<span class="recent-chip" onclick="setT('${escAttr(x.t)}')"><span class="recent-chip-text">${escAttr(x.l)}</span><button type="button" class="recent-x" onclick="event.stopPropagation();removeFromRecent('${escAttr(x.t)}')" aria-label="${escAttr(x.l)} 삭제">×</button></span>`).join('')

async function getChart(ticker){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=2y&interval=1d`;
  try{
    const j=await fetchJSON(url);
    const r=j.chart.result[0];
    const ts=r.timestamp;
    const c=r.indicators.quote[0].close;
    const v=r.indicators.quote[0].volume;
    const out=[];
    for(let i=0;i<ts.length;i++){
      if(c[i]!=null) out.push({d:new Date(ts[i]*1000),c:c[i],v:v[i]||0});
    }
    return out;
  }catch(e){
    // Stooq 백업 — 미국 주식만 지원
    if(/\.(KS|KQ)$/i.test(ticker)) throw e;
    const sym=ticker.toLowerCase()+'.us';
    const t=await fetchText(`https://stooq.com/q/d/l/?s=${sym}&i=d`);
    const lines=t.trim().split('\n').slice(1);
    return lines.map(l=>{const p=l.split(',');return{d:new Date(p[0]),c:+p[4],v:+p[5]||0}}).filter(x=>!isNaN(x.c)).slice(-520);
  }
}

async function getQuoteSummary(ticker){
  const full='summaryDetail,defaultKeyStatistics,financialData,assetProfile,price,quoteType';
  const slim='summaryDetail,defaultKeyStatistics,financialData,price,quoteType';
  const attempts=[
    `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${full}`,
    `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${full}`,
    `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${slim}`,
    `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${slim}`,
  ];
  let lastErr;
  for(const url of attempts){
    try{
      const j=await fetchJSON(url);
      const row=j?.quoteSummary?.result?.[0];
      if(row) return row;
      lastErr=new Error(j?.quoteSummary?.error?.description||'no quoteSummary data');
    }catch(e){lastErr=e}
  }
  // 최후 수단: 모듈을 그룹별로 병렬 요청 후 병합 (하나의 모듈이 전체 요청을 막을 때 대응)
  // 손익계산서·재무상태표 포함 — financialData 모듈이 없을 때 직접 계산용
  const modGroups=[
    'summaryDetail,defaultKeyStatistics',
    'financialData',
    'price,quoteType',
    'assetProfile',
    'incomeStatementHistory,incomeStatementHistoryQuarterly',
    'balanceSheetHistory,balanceSheetHistoryQuarterly',
  ];
  const merged={};
  await Promise.allSettled(modGroups.flatMap(mods=>
    ['query1','query2'].map(async host=>{
      try{
        const j=await fetchJSON(`https://${host}.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${mods}`);
        const row=j?.quoteSummary?.result?.[0];
        if(row) Object.assign(merged,row);
      }catch(_){}
    })
  ));
  if(Object.keys(merged).length>0) return merged;
  throw lastErr||new Error('no quoteSummary data');
}

async function getKoreanStockDetailData(code){
  // 한국 주식의 상세 데이터를 여러 소스에서 수집 (선택사항 — 실패해도 무방)
  try{
    const overviewUrl=`https://finance.naver.com/item/coinfo.naver?code=${encodeURIComponent(code)}`;
    const html=await fetchText(overviewUrl);
    if(!html||html.length<100)return null; // 최소 길이 확인

    const doc=new DOMParser().parseFromString(html,'text/html');
    const m={};

    // 테이블에서 지표 추출 (안전하게)
    try{
      doc.querySelectorAll('table tr').forEach(row=>{
        try{
          const cells=row.querySelectorAll('td');
          if(cells.length>=2){
            const key=cells[0]?.textContent?.trim();
            const val=cells[1]?.textContent?.trim();
            if(key&&val&&!m[key])m[key]=val;
          }
        }catch(e){}
      });
    }catch(e){}

    // 텍스트 기반 정규식 추출
    const text=htmlToPlainText(html);
    const tryRegex=(key,patterns)=>{
      if(!m[key]&&Array.isArray(patterns)){
        for(const re of patterns){
          const x=text.match(re);
          if(x){m[key]=x[1];break}
        }
      }
    };

    tryRegex('영업이익률',[/영업이익률[^\d]*(-?[0-9]+(?:\.[0-9]+)?)\s*%/]);
    tryRegex('순이익률',[/순이익률[^\d]*(-?[0-9]+(?:\.[0-9]+)?)\s*%/]);

    // 결과가 있으면 반환, 없으면 null
    return Object.keys(m).length>0?m:null;
  }catch(e){
    return null; // 모든 오류 무시
  }
}

function decodeHtmlEntities(s){

  if(typeof document!=='undefined'){

    .replace(/<style[\s\S]*?<\/style>/gi,' ')
    .replace(/<[^>]+>/g,' '))
    .replace(/\s+/g,' ').trim();
}
function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function metricBlocksFromText(text,labels=FUND_LABELS){
  const compact=String(text||'').replace(/\s+/g,' ').trim();
  const matches=[];
  const sorted=[...labels].sort((a,b)=>b.length-a.length);
  for(const label of sorted){
    const pat=escapeRegExp(label).replace(/\s+/g,'\\s+');
    const re=new RegExp(`(^|\\s)${pat}(?=\\s|:|$)`,'gi');
    let m;
    while((m=re.exec(compact))){
      const lead=m[1]?m[1].length:0;
      matches.push({label,start:m.index+lead,end:m.index+m[0].length});
    }
  }
  matches.sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));
  const filtered=[];
  for(const m of matches){
    if(filtered.some(x=>m.start>=x.start&&m.end<=x.end)) continue;
    filtered.push(m);
  }
  filtered.sort((a,b)=>a.start-b.start);
  const out={};
  for(let i=0;i<filtered.length;i++){
    const cur=filtered[i];
    const next=filtered[i+1];
    if(out[cur.label]!=null) continue;
    let val=compact.slice(cur.end,next?next.start:cur.end+180).trim();
    val=val.replace(/^[\s:·•|–—-]+/,'').trim();
    if(val) out[cur.label]=val.slice(0,180).trim();
  }
  return out;
}
function firstMetric(m,...names){
  for(const n of names){
    const v=m?.[n];
    if(v!=null&&String(v).trim()!==''&&String(v).trim().toLowerCase()!=='n/a'&&String(v).trim()!=='-')return v;
  }
  return null;
}
function numFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const m=s.match(/-?\$?\s*([0-9]+(?:\.[0-9]+)?)/);
  if(!m)return null;
  const n=parseFloat(m[0].replace(/[$\s]/g,''));
  return isFinite(n)?n:null;
}
function pctFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const pm=s.match(/(-?[0-9]+(?:\.[0-9]+)?)\s*%/);
  if(pm){const n=parseFloat(pm[1]);return isFinite(n)?n/100:null}
  const n=numFromText(s);
  if(n==null)return null;
  return Math.abs(n)>1?n/100:n;
}
function bigFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const m=s.match(/-?\$?\s*([0-9]+(?:\.[0-9]+)?)\s*(trillion|billion|million|thousand|T|B|M|K)?/i);
  if(!m)return null;
  const n=parseFloat(m[1]);
  if(!isFinite(n))return null;
  const u=(m[2]||'').toLowerCase();
  const mult=u==='t'||u==='trillion'?1e12:u==='b'||u==='billion'?1e9:u==='m'||u==='million'?1e6:u==='k'||u==='thousand'?1e3:1;
  return n*mult;
}

function sma(arr,n){if(arr.length<n)return null;return arr.slice(-n).reduce((a,b)=>a+b,0)/n}
function rsi(closes,n=14){
  if(closes.length<n+1)return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}
  let ag=g/n,al=l/n;
  for(let i=n+1;i<closes.length;i++){const d=closes[i]-closes[i-1];const u=d>0?d:0,dn=d<0?-d:0;ag=(ag*(n-1)+u)/n;al=(al*(n-1)+dn)/n}
  if(al===0)return 100;
  return 100-100/(1+ag/al);
}
function pct(a,b){return((a-b)/b)*100}
function fmtNum(n,d=2){if(n==null||!isFinite(n))return'—';return n.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})}
function fmtPct(n,d=1){if(n==null||!isFinite(n))return'—';return(n>=0?'+':'')+n.toFixed(d)+'%'}
function fmtBig(n){if(n==null||!isFinite(n))return'—';const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2)+'T';if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';return n.toLocaleString()}

  // 보조 소스: 한국 주식은 네이버 금융(2곳), 미국 주식은 Finviz + StockAnalysis
  const results=await Promise.allSettled([
    isKorean?getNaverFinanceData(code):getFinvizData(ticker),
    isKorean?getKoreanStockDetailData(code):getStockAnalysisData(ticker),
    getQuote(ticker)
  ]);

  const supp1=results[0].status==='fulfilled'?results[0].value:null;
  const supp2=results[1].status==='fulfilled'?results[1].value:null;
  const qteRaw=results[2].status==='fulfilled'?results[2].value:null;

  }
  const fvz=isKorean?null:supp1;
  const sa=isKorean?null:supp2;
  const known=getLastKnownFundamental(isKorean?code:ticker);
  let knownUsed=false;

  try{
    const sd=r.summaryDetail||{},ks=r.defaultKeyStatistics||{},fd=r.financialData||{},ap=r.assetProfile||{},pr=r.price||{},qt=r.quoteType||{};
    const v=o=>o&&o.raw!=null?o.raw:null;
    const pickNum=(key,...vals)=>{
      const valid=vals.filter(x=>x!=null&&isFinite(x));
      if(valid.length===0){
        if(known&&known[key]!=null&&isFinite(known[key])){knownUsed=true;return known[key]}

    // ─── 손익계산서·재무상태표에서 직접 계산 ────────────────────────────────────
    // financialData 모듈이 없거나 불완전할 때 보완.
    // 1순위: 연간 (안정적), 2순위: 최근 4분기 합산 TTM (연간이 없거나 오래된 경우)
    const isAnn=r.incomeStatementHistory?.incomeStatementHistory;
    const bsAnn=r.balanceSheetHistory?.balanceSheetHistory;
    const isAnnLast=isAnn?.[0]||{};
    const isAnnPrev=isAnn?.[1]||{};
    const bsLast=bsAnn?.[0]||{};
    // TTM (최근 4분기 합산) — 연간 데이터가 비었을 때만 사용
    const isQtrAll=r.incomeStatementHistoryQuarterly?.incomeStatementHistory||[];
    const sumQtr=(field,n=4)=>{
      if(!Array.isArray(isQtrAll)||isQtrAll.length<n)return null;
      let s=0,ok=0;
      for(let i=0;i<n;i++){const x=v(isQtrAll[i]?.[field]);if(x!=null){s+=x;ok++}}
      return ok===n?s:null;
    };
    const annRevenue=v(isAnnLast.totalRevenue);
    const annNetIncome=v(isAnnLast.netIncome);
    const annGrossProfit=v(isAnnLast.grossProfit);
    const annOpIncome=v(isAnnLast.operatingIncome)||v(isAnnLast.ebit);
    const ttmRevenue=sumQtr('totalRevenue');
    const ttmNetIncome=sumQtr('netIncome');
    const ttmGrossProfit=sumQtr('grossProfit');
    const ttmOpIncome=sumQtr('operatingIncome')||sumQtr('ebit');
    // 직전 4분기(=8분기 중 5~8번째) 합 — TTM 기준 YoY 매출 성장률 비교용
    const sumQtrPrior=field=>{
      if(!Array.isArray(isQtrAll)||isQtrAll.length<8)return null;
      let s=0,ok=0;
      for(let i=4;i<8;i++){const x=v(isQtrAll[i]?.[field]);if(x!=null){s+=x;ok++}}
      return ok===4?s:null;
    };
    const ttmPrevRevenue=sumQtrPrior('totalRevenue');
    const stmtRevenue=annRevenue??ttmRevenue;
    // stmtRevenue 가 어느 기준이냐에 따라 prev도 같은 기준으로 매칭 (단위 일치)
    const stmtPrevRevenue=annRevenue!=null?v(isAnnPrev.totalRevenue):ttmPrevRevenue;
    const stmtNetIncome=annNetIncome??ttmNetIncome;
    const stmtGrossProfit=annGrossProfit??ttmGrossProfit;
    const stmtOpIncome=annOpIncome??ttmOpIncome;
    const stmtSE=v(bsLast.totalStockholderEquity);
    const stmtAssets=v(bsLast.totalAssets);
    const stmtLiabilities=v(bsLast.totalLiab)||v(bsLast.totalLiabilities);
    // totalDebt(=장단기 합)을 우선 사용 — longTermDebt만 잡으면 단기 부채 누락
    const stmtDebt=v(bsLast.totalDebt)??((v(bsLast.longTermDebt)||0)+(v(bsLast.shortTermDebt)||0))||null;
    const calcROE=stmtNetIncome!=null&&stmtSE!=null&&stmtSE!==0?stmtNetIncome/stmtSE:null;
    const calcROA=stmtNetIncome!=null&&stmtAssets!=null&&stmtAssets!==0?stmtNetIncome/stmtAssets:null;
    const calcProfitM=stmtNetIncome!=null&&stmtRevenue!=null&&stmtRevenue!==0?stmtNetIncome/stmtRevenue:null;
    const calcGrossM=stmtGrossProfit!=null&&stmtRevenue!=null&&stmtRevenue!==0?stmtGrossProfit/stmtRevenue:null;
    const calcOpM=stmtOpIncome!=null&&stmtRevenue!=null&&stmtRevenue!==0?stmtOpIncome/stmtRevenue:null;
    const calcRevGrowth=stmtRevenue!=null&&stmtPrevRevenue!=null&&stmtPrevRevenue!==0?(stmtRevenue-stmtPrevRevenue)/Math.abs(stmtPrevRevenue):null;
    // 데이터 신선도 — 가장 최근 결산일 (연간 우선, 없으면 분기)
    const annEndRaw=v(isAnnLast.endDate);
    const qtrEndRaw=v(isQtrAll?.[0]?.endDate);
    const reportEndTs=qtrEndRaw&&(!annEndRaw||qtrEndRaw>annEndRaw)?qtrEndRaw:annEndRaw;
    const reportIsAnnual=reportEndTs===annEndRaw&&annEndRaw!=null;
    const reportLabel=(()=>{
      if(!reportEndTs)return null;
      const d=new Date(reportEndTs*1000);
      if(isNaN(d.getTime()))return null;
      const y=d.getFullYear(),m=d.getMonth()+1,q=Math.ceil(m/3);
      return reportIsAnnual?`${y} 연간 결산`:`${y} Q${q}`;
    })();
    // P/S 계산 (시가총액 / 매출) — 여러 소스에서 시도
    let calcPS=null;
    if(mcapCalc&&stmtRevenue&&stmtRevenue!==0){
      calcPS=mcapCalc/stmtRevenue;
    }else if(mcap&&stmtRevenue&&stmtRevenue!==0){
      calcPS=mcap/stmtRevenue;
    }
    // 연간 매출이 없으면 분기 데이터로 TTM(최근 4분기 합) 산출 — 단순 ×4 는 계절성 왜곡
    if(calcPS==null){
      const isQtr=r.incomeStatementHistoryQuarterly?.incomeStatementHistory;
      if(Array.isArray(isQtr)&&isQtr.length>=4&&(mcapCalc||mcap)){
        const ttmRev=isQtr.slice(0,4).reduce((s,q)=>{const x=v(q?.totalRevenue);return x!=null?s+x:s},0);
        if(ttmRev>0)calcPS=(mcapCalc||mcap)/ttmRev;
      }else if(isQtr?.[0]?.totalRevenue&&(mcapCalc||mcap)){
        // 분기 1개만 있을 때만 ×4 근사 (마지막 폴백)
        const annRevEst=v(isQtr[0].totalRevenue)*4;
        if(annRevEst>0)calcPS=(mcapCalc||mcap)/annRevEst;
      }
    }
    let usedStmtCalc=false; // 재무제표 계산값 사용 여부

    // qteRaw (Yahoo v7 quote) + 재무제표 계산값을 pickNum fallback에 직접 연결
    // 한국/미국 모두 Yahoo 우선 — 네이버 스크래핑은 부정확하므로 fallback 전용
    let pe=pickNum('pe',v(sd.trailingPE),v(ks.trailingPE),qteRaw?.trailingPE,naver?.pe,fvz?.pe,sa?.pe);
    let fpe=pickNum('fpe',v(sd.forwardPE),v(ks.forwardPE),qteRaw?.forwardPE,naver?.fpe,fvz?.fpe,sa?.fpe);
    // P/E 검증: 극단값 수정 (적자 표시 무효화)
    if(pe!=null&&pe<-100)pe=null;
    if(fpe!=null&&fpe<-100)fpe=null;
    let pb=pickNum('pb',v(ks.priceToBook),qteRaw?.priceToBook,naver?.pb,fvz?.pb,sa?.pb);
    let ps=pickNum('ps',v(sd.priceToSalesTrailing12Months),qteRaw?.priceToSalesTrailing12Months,naver?.ps,calcPS,fvz?.ps,sa?.ps);
    let divY=pickNum('divY',v(sd.dividendYield),qteRaw?.trailingAnnualDividendYield,naver?.divY,fvz?.divY,sa?.divY);
    // Yahoo financialData 우선 → 재무제표 계산 → 네이버 fallback
    const _roe0=pickNum('roe',v(fd.returnOnEquity),fvz?.roe,sa?.roe,naver?.roe);
    let roe=(()=>{if(_roe0!=null)return _roe0;if(calcROE!=null){usedStmtCalc=true;return calcROE}return null})();
    const _roa0=pickNum('roa',v(fd.returnOnAssets),fvz?.roa,sa?.roa,naver?.roa);
    let roa=(()=>{if(_roa0!=null)return _roa0;if(calcROA!=null){usedStmtCalc=true;return calcROA}return null})();
    const _margin0=pickNum('profitM',v(fd.profitMargins),v(ks.profitMargins),fvz?.profitM,sa?.profitM,naver?.profitM);
    let margin=(()=>{if(_margin0!=null)return _margin0;if(calcProfitM!=null){usedStmtCalc=true;return calcProfitM}return null})();
    const _opM0=pickNum('opMargin',v(fd.operatingMargins),fvz?.opMargin,sa?.opMargin,naver?.opMargin);
    let opMargin=(()=>{if(_opM0!=null)return _opM0;if(calcOpM!=null){usedStmtCalc=true;return calcOpM}return null})();
    const _revG0=pickNum('revGrowth',v(fd.revenueGrowth),fvz?.revGrowth,sa?.revGrowth,naver?.revGrowth);
    let revGrowth=(()=>{if(_revG0!=null)return _revG0;if(calcRevGrowth!=null){usedStmtCalc=true;return calcRevGrowth}return null})();
    const _earnG0=pickNum('earnGrowth',v(fd.earningsGrowth),v(fd.earningsQuarterlyGrowth),fvz?.earnGrowth,sa?.earnGrowth,naver?.earnGrowth);
    let earnGrowth=(()=>{if(_earnG0!=null)return _earnG0;return null})();
    const _debtEq0=pickNum('debtEq',v(fd.debtToEquity),fvz?.debtEq,sa?.debtEq,naver?.debtEq);
    let debtEq=(()=>{if(_debtEq0!=null)return _debtEq0;return null})();
    // D/E 단위 자동 정규화: Yahoo는 보통 %(예: 63.5)지만 일부 응답에서 비율(0.63)로 옴.
    // 0~5 범위면 비율로 간주해 ×100, 그 외는 % 그대로.
    // (다만 절대값이 아주 작은 진짜 % 케이스(예: 0.5% = 거의 무차입)는 0~5 비율 범위와
    //  구분 어려우므로 재무제표 직접 계산값과 비교해 보정)
    if(debtEq!=null&&debtEq>=0&&debtEq<=5&&stmtLiabilities!=null&&stmtSE!=null&&stmtSE>0){
      const calcDe=(stmtLiabilities/stmtSE)*100;
      if(calcDe>10&&Math.abs(debtEq*100-calcDe)<Math.abs(debtEq-calcDe)){debtEq=debtEq*100;}
    }
    const _currRatio0=pickNum('currRatio',v(fd.currentRatio),fvz?.currRatio,sa?.currRatio,naver?.currRatio);
    let currentRatio=(()=>{if(_currRatio0!=null)return _currRatio0;return null})();
    const beta=pickNum('beta',v(sd.beta),v(ks.beta),qteRaw?.beta,fvz?.beta,sa?.beta);
    let peg=pickNum('peg',v(ks.pegRatio),fvz?.peg,sa?.peg);
    let pegCalculated=false;
    if((peg==null||!isFinite(peg))&&pe!=null&&pe>0&&earnGrowth!=null&&earnGrowth>0){peg=pe/(earnGrowth*100);pegCalculated=true}

    // ─── 빠진 지표 보완 계산 ────────────────────────────────────────────────────
    // 0. 순이익률 역산: margin = (P/S) / (P/E) — 흑자 기업에 한해 정확
    let marginCalculated=false;
    if(margin==null&&pe!=null&&pe>0&&ps!=null&&ps>0){margin=ps/pe;marginCalculated=true;}
    // ROE × Equity/Sales = NI/Sales 관계로도 시도 (PB·PS·ROE 모두 양수일 때)
    if(margin==null&&roe!=null&&roe>0&&pb!=null&&pb>0&&ps!=null&&ps>0){margin=roe*ps/pb;marginCalculated=true;}
    // (제거) ROE = PB × ROA 폴백: 수학적으로 ROE = ROA × (Assets/Equity) 이며
    //   PB는 가격 멀티플이라 ROE와 무관 — 잘못된 값을 만들어 등급 왜곡 원인이었음.
    // (제거) margin/(1-D/E) 폴백: D/E 단위 혼선과 결합해 비현실적 ROE 양산.
    // (제거) ROA = margin × 0.5 추정: 자산회전율은 업종별 0.1~3+ 으로 편차가 커
    //   고정 0.5 가정이 점수 결과를 왜곡시킴.
    // ROE/ROA는 재무제표 직접 계산(calcROE/calcROA)이 가능할 때만 채워짐.
    // 3. P/S 계산: P/E × 순이익률
    if(ps==null&&pe!=null&&margin!=null&&pe>0&&margin>0){ps=pe*margin;}
    // 4. PB 역산: PB = PE × ROE
    if(pb==null&&pe!=null&&roe!=null&&pe>0&&roe>0){pb=pe*roe;}
    // 5. 성장률 추정: ROE - 배당수익률 = 내부 성장률
    if(earnGrowth==null&&roe!=null&&divY!=null&&roe>0){
      earnGrowth=Math.max(0,roe-divY);
    }
    // 6. ROE 역산 (이미 위에서 계산했으면 스킵)
    // 7. ROA 역산 (이미 위에서 계산했으면 스킵)
    // 8. 부채비율은 위의 stmtLiabilities 기반 계산 참고
    // 6. 부채비율 계산: 재무제표 기반 D/E = 부채/자기자본
    if(debtEq==null&&stmtLiabilities!=null&&stmtSE!=null&&stmtSE!==0){
      debtEq=(stmtLiabilities/stmtSE)*100;
    }else if(debtEq==null&&stmtDebt!=null&&stmtSE!=null&&stmtSE!==0){
      debtEq=(stmtDebt/stmtSE)*100;
    }
    // (제거) 유동비율→D/E 환산 폴백: 두 지표는 수학적으로 무관해 잡음만 만듦
    // (제거) D/E 300% 캡: 부채 위험 기업을 정상처럼 보이게 만들던 가림막
    //   실제 위험을 그대로 노출하기 위해 상한 강제 절단을 하지 않는다.

    // ─── 최종 값 sanity 검증: 명백히 비현실적인 값은 null로 ─────────────────────
    // (네이버/Finviz 정규식이 다른 필드 숫자를 잘못 매칭하는 케이스 차단)
    if(divY!=null&&(divY<0||divY>0.20))divY=null;          // 배당수익률 >20% 비현실적 (배당성향 오인)
    // 적자 성장주(예: IONQ)도 진짜 값을 통과시킨다.
    // 상한은 잘못된 정규식 매칭 차단용으로 좁게 유지하고, 하한만 크게 완화.
    if(margin!=null&&(margin<-50||margin>1))margin=null;
    if(opMargin!=null&&(opMargin<-50||opMargin>1))opMargin=null;
    // ROE 상한을 3배(=300%)에서 1.5배(=150%)로 좁힘 — 자기자본 잠식 직전 잡음 방지
    if(roe!=null&&(roe<-10||roe>1.5))roe=null;
    if(roa!=null&&(roa<-10||roa>1))roa=null;
    if(pe!=null&&(pe>1000||pe<-1000))pe=null;
    if(fpe!=null&&(fpe>1000||fpe<-1000))fpe=null;
    if(pb!=null&&(pb<0||pb>100))pb=null;
    if(ps!=null&&(ps<0||ps>100))ps=null;
    if(revGrowth!=null&&(revGrowth<-1||revGrowth>10))revGrowth=null;
    // earnGrowth 상한을 20배(=2000%)에서 5배(=500%)로 좁힘 — 비현실적 분기 비교 잡음 차단
    if(earnGrowth!=null&&(earnGrowth<-2||earnGrowth>5))earnGrowth=null;
    if(currentRatio!=null&&(currentRatio<0||currentRatio>50))currentRatio=null;
    // D/E 자체 sanity: 음수는 자기자본 잠식 — 상한 캡 없이 노출 (실제 위험 표시)
    if(debtEq!=null&&debtEq<0)debtEq=null;

    // P/S 추가 fallback: mcap/매출이 가능하면 계산
    if(ps==null&&mcap!=null&&stmtRevenue!=null&&stmtRevenue>0){
      const calc=mcap/stmtRevenue;
      if(calc>0&&calc<100)ps=calc;
    }

    // ─── 시가총액 보강 fallback (직접 소스가 모두 비었을 때) ─────────────────
    // 1) P/S × 매출 = 시가총액 (대수적으로 정확)
    if(mcap==null&&ps!=null&&ps>0&&stmtRevenue!=null&&stmtRevenue>0){
      mcap=ps*stmtRevenue;
    }
    // 2) P/E × 순이익 = 시가총액 (흑자 기업만)
    if(mcap==null&&pe!=null&&pe>0&&stmtNetIncome!=null&&stmtNetIncome>0){
      mcap=pe*stmtNetIncome;
    }
    // 3) 마지막 수단: 알려진 시가총액 스냅샷
    if(mcap==null){
      const kmKey=isKorean?code:String(ticker).toUpperCase();
      const km=KNOWN_MCAP[kmKey];
      if(km!=null){mcap=km;mcapApprox=true;}
    }

    const sourceParts=[];
    if(!usedFallback)sourceParts.push('Yahoo Finance');
    else if(qteRaw)sourceParts.push('Yahoo Finance (기본)');
    if(usedStmtCalc)sourceParts.push('Yahoo 재무제표 계산');
    if(naver)sourceParts.push('네이버 금융');
    if(fvz)sourceParts.push('Finviz');
    if(sa)sourceParts.push('StockAnalysis');
    if(knownUsed&&known)sourceParts.push(`${known.source}(${known.asOf})`);
    const sourceNote=sourceParts.length?sourceParts.join(' + '):'공개 가격/차트 데이터';
    const freshnessNote=reportLabel?` · 재무 기준일: ${reportLabel}`:'';

    // ─── 펀더멘털 점수 (0~100) ────────────────────────────────────────────────
    const isETF=isETFRaw;
    // 성장 섹터: 섹터명은 정확 일치, 산업명은 한국어 키워드만 부분일치 허용
    // (기존엔 'IT' 같은 짧은 토큰이 무관한 industry 문자열에 부분일치해 false positive 발생)
    const GROWTH_SECTOR_EXACT=new Set(['Technology','Communication Services','Consumer Cyclical','Healthcare']);
    const GROWTH_INDUSTRY_KO=['반도체','바이오','소프트웨어','게임','인터넷','2차전지','전기차','클라우드'];
    const isGrowth=GROWTH_SECTOR_EXACT.has(String(sector||''))
      ||GROWTH_INDUSTRY_KO.some(s=>String(industry||'').includes(s));

    // PE 기준: 한국은 미국보다 낮음 (성장주는 더 관대하게)
    const peGood=isKorean?(isGrowth?22:12):(isGrowth?35:20);
    const peBad=isKorean?(isGrowth?35:20):(isGrowth?55:35);
    // 부채비율 기준: 한국 기업은 부채가 많은 경향
    const deqGood=isKorean?120:50;
    const deqBad=isKorean?250:150;

    let rawScore=0,maxScore=0;
    const add=(val,maxPts,pts)=>{if(val==null||!isFinite(val))return;rawScore+=pts;maxScore+=maxPts};

    if(!isETF){
      // P/E가 음수(적자)이면서 Forward P/E가 양수이면 회복 중으로 간주해 과도한 감점 방지
      const peRecovering=pe!=null&&pe<0&&fpe!=null&&fpe>0&&fpe<peBad;
      add(pe,10, pe>0&&pe<peGood?10:pe>0&&pe<peBad?4:pe>0?-4:peRecovering?-2:-8);
      add(peg,8,  peg>0&&peg<1?8:peg>0&&peg<2?4:peg>0?-3:0);
      add(roe,15, roe>0.15?15:roe>0.08?8:roe>=0?2:-12);
      // margin이 P/S÷P/E 역산값이면 점수 산정에서 제외 (시각화에는 그대로 표시)
      if(!marginCalculated)add(margin,12, margin>0.15?12:margin>0.03?6:margin>=0?1:-12);
      add(revGrowth,12, revGrowth>0.10?12:revGrowth>0?5:-10);
      add(earnGrowth,10, earnGrowth>0.10?10:earnGrowth>0?4:-8);
      add(debtEq,6, debtEq<deqGood?6:debtEq<deqBad?2:-8);
      add(currentRatio,5, currentRatio>1.5?5:currentRatio>1?2:-5);
    }
    // ETF는 펀더멘털 점수 산정에서 제외 — 무조건 만점을 주던 기존 로직은
    // 모든 ETF를 "양호 이상"으로 보이게 만들어 의미가 없었음.
    // (등급은 grade='데이터 부족'이 표시되며, 카드/시각화는 그대로 노출)
    // 점수 계산: 유효한 지표가 너무 적으면 등급을 매기지 않고 "데이터 부족"으로 표기
    // (기존의 +15 보정은 부실 기업을 가리는 부작용이 있어 제거)
    // 임계: 유효 지표의 max 가중치 합이 30 미만이면 표본 부족으로 판단
    // (전체 가중치 합은 약 78점 — pe10+peg8+roe15+margin12+revGrowth12+earnGrowth10+debtEq6+currRatio5)
    const score=maxScore?Math.max(0,Math.min(100,Math.round((rawScore/maxScore)*100))):null;
    const dataInsufficient=(maxScore<30);
    const adjustedScore=score;
    let grade,gColor;
    if(isETF){grade='ETF (점수 미산정)';gColor='var(--text-tertiary)'}
    else if(dataInsufficient||adjustedScore==null){grade='데이터 부족';gColor='var(--text-tertiary)'}
    else if(adjustedScore>=70){grade='우수';gColor='var(--good)'}
    else if(adjustedScore>=55){grade='양호';gColor='var(--primary)'}
    else if(adjustedScore>=40){grade='보통';gColor='var(--neutral)'}
    else{grade='주의';gColor='var(--bad)'}

    const tagList=[];
    if(market)tagList.push({t:market,kr:true});
    if(sector&&sector!=='—')tagList.push({t:sector});
    if(industry&&industry!=='—')tagList.push({t:industry});
    if(country&&!isKorean)tagList.push({t:country});
    const displayQuoteType=qt.quoteType||qteRaw?.quoteType;
    if(displayQuoteType&&!isKorean)tagList.push({t:displayQuoteType});

    // 통화 포매터
    const fmtMcap=n=>isKorean?fmtBigKRW(n):fmtBig(n);
    const fmtCurr=n=>isKorean?fmtPriceKRW(n):('$'+fmtNum(n));

    const grossM=pickNum('grossM',v(fd.grossMargins),calcGrossM);
    // 배당 미지급 판정: 다른 펀더멘털은 받아왔는데 배당값이 0/null이면 무배당으로 간주.
    // (분기 누락 vs 미지급을 구분하기 위해 다른 데이터가 들어왔을 때만 적용)
    const hasFundamentalSignal=pe!=null||pb!=null||ps!=null||roe!=null||margin!=null||revGrowth!=null||opMargin!=null;
    const isNoDividend=hasFundamentalSignal&&(divY==null||divY===0);
    const peDesc=(()=>{
      if(pe==null)return'주가/이익 비율';
      if(pe<0&&fpe!=null&&fpe>0)return`Forward ${fmtNum(fpe)} (실적 회복 중)`;
      if(pe<0)return'적자 (TTM 기준)';
      return fpe!=null?'Forward '+fmtNum(fpe):'주가/이익 비율';
    })();
    const cards=[
      {t:'시가총액',k:'mcap',m:fmtMcap(mcap)+(mcapApprox?' *':''),d:mcapApprox?'근사값 (API 제한)':'기업 규모'},
      {t:'P/E (TTM)',k:'pe',m:pe!=null?fmtNum(pe):'—',d:peDesc},
      {t:'PEG',k:'peg',m:peg!=null?fmtNum(peg):'—',d:pegCalculated?'이익 성장률 기반 계산값':'성장 대비 밸류'},
      {t:'P/B',k:'pb',m:pb!=null?fmtNum(pb):'—',d:'주가/순자산'},
      {t:'P/S',k:'ps',m:ps!=null?fmtNum(ps):'—',d:'주가/매출'},
      {t:'배당수익률',k:'divY',m:divY!=null&&divY>0?(divY*100).toFixed(2)+'%':isNoDividend?'무배당':'—',d:isNoDividend?'배당 미지급 종목':'연간 배당'},
      {t:'ROE',k:'roe',m:roe!=null?(roe*100).toFixed(1)+'%':'—',d:roa!=null?'ROA '+(roa*100).toFixed(1)+'%':'자기자본이익률'},
      {t:'순이익률',k:'margin',m:margin!=null?(margin*100).toFixed(1)+'%'+(marginCalculated?' *':''):'—',d:margin==null?(usedFallback?'외부 소스 미제공':'데이터 없음'):marginCalculated?'P/S÷P/E 역산':opMargin!=null?'영업 '+(opMargin*100).toFixed(1)+'%':grossM!=null?'매출총이익 '+(grossM*100).toFixed(1)+'%':'순이익/매출'},
    ];
    // 핵심 지표가 하나도 없을 때만 차트 기반 대체 카드 표시
    const hasFundamentals=pe!=null||pb!=null||ps!=null||roe!=null||margin!=null;
    if(usedFallback&&r._fallback&&!hasFundamentals){
      cards.splice(0,0,
        {t:'현재가',m:fmtCurr(r._fallback.last),d:'공개 가격 데이터 기준'},
        {t:'1년 범위',m:fmtCurr(r._fallback.yLow)+' ~ '+fmtCurr(r._fallback.yHigh),d:'52주 유사 범위'},
        {t:'1년 변화',m:fmtPct(r._fallback.momentum),d:'차트 기반 대체 지표'}
      );
    }

    // ─── 시각화 막대 정의 ─────────────────────────────────────────────────────
    // pos(x): 값을 막대 위 0~100% 위치로 매핑 (구간별 piecewise 매핑으로
    //   임계값이 시각적으로 같은 위치에 오게 함)
    // zones: 막대 배경의 빨강·노랑·초록 영역(폭은 % 합계 100)
    // hint: 막대 아래에 보일 임계 기준 설명 (초보자용)
    const bars=[
      {l:'매출 성장',sub:'전년 대비',k:'revGrowth',v:revGrowth,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?Math.max(0,25+x*100):x<0.1?25+(x/0.1)*25:x<0.3?50+((x-0.1)/0.2)*25:Math.min(100,75+((x-0.3)/0.7)*25),
       zones:[{w:25,c:'bad'},{w:25,c:'neutral'},{w:50,c:'good'}],
       cls:x=>x>0.10?'good':x>0?'neutral':'bad',
       verdict:x=>x>0.30?'고성장':x>0.10?'양호':x>0?'성장 중':'역성장',
       hint:'0% 미만 = 역성장 · 10% 이상 = 양호 · 30% 이상 = 고성장'},
      {l:'이익 성장',sub:'전년 대비',k:'earnGrowth',v:earnGrowth,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?Math.max(0,25+x*100):x<0.1?25+(x/0.1)*25:x<0.3?50+((x-0.1)/0.2)*25:Math.min(100,75+((x-0.3)/0.7)*25),
       zones:[{w:25,c:'bad'},{w:25,c:'neutral'},{w:50,c:'good'}],
       cls:x=>x>0.10?'good':x>0?'neutral':'bad',
       verdict:x=>x>0.30?'우수':x>0.10?'양호':x>0?'성장 중':'이익 감소',
       hint:'0% 미만 = 감소 · 10% 이상 = 양호 · 30% 이상 = 우수'},
      {l:'ROE',sub:'자기자본이익률',k:'roe',v:roe,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?Math.max(0,15+x*150):x<0.08?15+(x/0.08)*30:x<0.15?45+((x-0.08)/0.07)*30:Math.min(100,75+((x-0.15)/0.15)*25),
       zones:[{w:15,c:'bad'},{w:30,c:'neutral'},{w:55,c:'good'}],
       cls:x=>x>0.15?'good':x>0.08?'neutral':'bad',
       verdict:x=>x>0.20?'매우 우수':x>0.15?'우수':x>0.08?'양호':x>=0?'평범':'손실',
       hint:'0% 미만 = 손실 · 8% 이상 = 양호 · 15% 이상 = 우수'},
      {l:'매출총이익률',sub:'원가 빼고 남는 비율',k:'grossM',v:grossM,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<0?0:x<0.2?(x/0.2)*25:x<0.4?25+((x-0.2)/0.2)*25:x<0.6?50+((x-0.4)/0.2)*25:Math.min(100,75+((x-0.6)/0.4)*25),
       zones:[{w:25,c:'bad'},{w:25,c:'neutral'},{w:50,c:'good'}],
       cls:x=>x>0.40?'good':x>0.20?'neutral':'bad',
       verdict:x=>x>0.60?'매우 우수':x>0.40?'양호':x>0.20?'평범':'박한 마진',
       hint:'20% 미만 = 박함 · 40% 이상 = 양호 · 60% 이상 = 우수'},
      {l:'순이익률',sub:'매출 100원당 순이익',k:'margin',v:margin,
       fmt:x=>(x*100).toFixed(1)+'%',
       pos:x=>x<-0.10?Math.max(0,15+(x+0.1)*100):x<0?15+((x+0.1)/0.1)*15:x<0.10?30+(x/0.10)*30:x<0.20?60+((x-0.1)/0.1)*20:Math.min(100,80+((x-0.2)/0.3)*20),
       zones:[{w:30,c:'bad'},{w:30,c:'neutral'},{w:40,c:'good'}],
       cls:x=>x>0.10?'good':x>0?'neutral':'bad',
       verdict:x=>x>0.20?'매우 우수':x>0.10?'양호':x>0?'박한 흑자':'적자',
       hint:'0% 미만 = 적자 · 10% 이상 = 양호 · 20% 이상 = 우수'},
      {l:'부채비율(D/E)',sub:'낮을수록 좋음',k:'debtEq',v:debtEq,
       fmt:x=>x.toFixed(0)+'%',
       pos:x=>{const g=deqGood,b=deqBad;return x<=0?100:x<g?100-(x/g)*30:x<b?70-((x-g)/(b-g))*40:Math.max(0,30-((x-b)/b)*30)},
       zones:[{w:30,c:'bad'},{w:40,c:'neutral'},{w:30,c:'good'}],
       cls:x=>x<deqGood?'good':x<deqBad?'neutral':'bad',
       verdict:x=>x<deqGood?'재무 건전':x<deqBad?'보통':'부채 부담',
       hint:`${deqGood}% 이하 = 건전 · ${deqBad}% 초과 = 부담${isKorean?' (한국 시장 기준)':''}`},
    ].filter(b=>b.v!=null&&isFinite(b.v));

    const dets=[];
    if(pe!=null)dets.push({k:'pe',ok:pe>0&&pe<peGood,bad:pe<0&&!(fpe!=null&&fpe>0&&fpe<peBad)||pe>peBad*1.3,t:`P/E ${fmtNum(pe)}`,v:pe>0&&pe<peGood?'합리적':pe>peBad?'고평가 우려':pe<0&&fpe!=null&&fpe>0?'실적 회복 중':pe<0?'적자':'다소 높음'});
    if(roe!=null)dets.push({k:'roe',ok:roe>0.15,bad:roe<0,t:`ROE ${(roe*100).toFixed(1)}%`,v:roe>0.15?'우수':roe>0.08?'양호':roe<0?'손실':'평범'});
    if(revGrowth!=null)dets.push({k:'revGrowth',ok:revGrowth>0.05,bad:revGrowth<0,t:`매출 성장 ${(revGrowth*100).toFixed(1)}%`,v:revGrowth>0.10?'고성장':revGrowth>0?'성장':'역성장'});
    if(debtEq!=null)dets.push({k:'debtEq',ok:debtEq<deqGood,bad:debtEq>deqBad*1.5,t:`D/E ${debtEq.toFixed(0)}%`,v:debtEq<deqGood?'재무 건전':debtEq<deqBad?'보통':'부채 부담'});
    if(beta!=null)dets.push({k:'beta',ok:false,bad:false,t:`베타 ${fmtNum(beta)}`,v:beta>1.3?'고변동성':beta<0.7?'저변동성':'시장 수준'});

    const marketNote=isKorean
      ?'한국 주식은 KRW(₩) 기준으로 표시됩니다. PE/D/E 기준은 한국 시장 평균을 반영해 조정됩니다.'
      :'ETF/ADR은 소스별 산식 차이로 값이 조금 다를 수 있습니다.';

    box.innerHTML=`
      <div class="card">
        <div class="section-title">펀더멘털 요약</div>
        <div class="fundamental-hero">
          <div class="company-box">
            <div class="company-name">${name}</div>
            <div class="company-meta">${isKorean?code:ticker}${employees?` · 직원 ${employees.toLocaleString()}명`:''}</div>
            <div class="tag-row">${tagList.map(t=>`<span class="tag${t.kr?' kr':''}">${t.t}</span>`).join('')}</div>
          </div>
          <div class="fund-score">
            <div class="score-number" style="color:${gColor}">${adjustedScore!=null?adjustedScore:'—'}</div>
            <div class="score-label">펀더멘털 점수 — <strong style="color:${gColor}">${grade}</strong></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">한눈에 보는 핵심 항목 <span style="color:var(--text-tertiary);font-weight:500;font-size:11.5px">· 항목 옆 ? 를 누르면 자세한 설명</span></div>
        <div class="fund-grid">
          ${cards.map(c=>`<div class="fund-card"><div class="fund-title">${c.t}${c.k?tip(c.k):''}</div><div class="fund-main">${c.m}</div><div class="fund-desc">${c.d}</div>${c.k&&GLOSSARY[c.k]?`<div class="fund-sub">${GLOSSARY[c.k].short}</div>`:''}</div>`).join('')}
        </div>
      </div>
      ${dets.length?`<div class="card">
        <div class="section-title">세부 판단</div>
        ${dets.map(d=>`<div class="signal ${d.ok?'signal-good':d.bad?'signal-bad':'signal-neutral'}"><span>${d.ok?'✓':d.bad?'✗':'•'} ${d.t}${d.k?tip(d.k):''}</span><strong>${d.v}</strong></div>`).join('')}
      </div>`:''}
      ${bars.length?`<div class="card">
        <div class="section-title">시각화 <span style="color:var(--text-tertiary);font-weight:500;font-size:11.5px">· 검은 막대 = 현재 위치, 배경색 = 좋음(초록)/보통(노랑)/주의(빨강) 구간</span></div>
        <div class="bar-list">
          ${bars.map(b=>{const p=Math.max(0,Math.min(100,b.pos(b.v)));const cls=b.cls(b.v);return `<div class="bar-row">
            <div class="bar-head">
              <div class="bar-label">${b.l}${b.sub?` <span class="bar-sub">${b.sub}</span>`:''}${b.k?tip(b.k):''}</div>
              <div class="bar-rating"><span class="bar-val">${b.fmt(b.v)}</span><span class="bar-verdict ${cls}">${b.verdict(b.v)}</span></div>
            </div>
            <div class="bar-track">
              <div class="bar-zones">${b.zones.map(z=>`<div class="zone zone-${z.c}" style="width:${z.w}%"></div>`).join('')}</div>
              <div class="bar-marker" style="left:${p}%"></div>
            </div>
            <div class="bar-hint">${b.hint.split(' · ').map(s=>`<span>${s}</span>`).join('')}</div>
          </div>`}).join('')}
        </div>
        <div class="mini-note">※ 데이터 소스: ${sourceNote}${freshnessNote}. ${usedFallback?'Yahoo 상세 API가 제한되어 보강 소스를 우선 사용했습니다.':'Yahoo 상세 API를 우선 사용했습니다.'}${knownUsed&&known?' · 일부 값은 최후 대체 스냅샷입니다.':''} ${marketNote}</div>
      </div>`:''}
    `;
  }catch(e){
    box.innerHTML=`<div class="card"><div class="section-title">펀더멘털 요약</div><div class="fundamental-hero"><div class="company-box"><div class="company-name">${isKorean?code:ticker}</div><div class="company-meta">공개 데이터 연결이 제한되어 기본 분석만 표시합니다.</div><div class="tag-row">${market?`<span class="tag kr">${market}</span>`:''}<span class="tag">대체 모드</span></div></div><div class="fund-score"><div class="score-number" style="color:var(--neutral)">50</div><div class="score-label">펀더멘털 점수 — <strong style="color:var(--neutral)">보통</strong></div></div></div></div><div class="card"><div class="empty-state">현재 무료 공개 소스에서 상세 지표를 찾지 못했습니다. 기술적 분석과 가격 기반 대체 지표를 함께 참고해 주세요.</div></div>`;
  }
}

document.getElementById('ticker').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
renderRecent();
</script>
</body>
</html>
