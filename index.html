<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Momentum Checker Pro — 모멘텀 점수 분석기</title>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#faf8f3;--surface:#fff;--text:#1f1f1d;--text-secondary:#6c6c66;--text-tertiary:#a8a8a0;--border:rgba(0,0,0,0.08);--good:#2d8659;--good-bg:#e8f5ee;--bad:#c44343;--bad-bg:#fcebec;--neutral:#b07d2e;--neutral-bg:#fbf2e1;--primary:#1a4d8c;--primary-hover:#0e3a73;--price:#1a4d8c;--ma50:#d97942;--ma200:#6c6c66}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;min-height:100vh;line-height:1.5}
.container{max-width:840px;margin:0 auto}
header{margin-bottom:24px;text-align:center}
h1{font-size:26px;letter-spacing:-0.03em}
.subtitle{color:var(--text-secondary);font-size:13px;margin-top:6px}
.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.search-row{display:flex;gap:10px;position:relative;flex-wrap:wrap}
.ticker-input{flex:1;max-width:280px;padding:12px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;font-weight:700;outline:none}
.ticker-input:focus{border-color:var(--primary)}
#suggest-list{position:absolute;top:100%;left:0;right:0;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:300px;overflow-y:auto;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.10);display:none}
#suggest-list.open{display:block}
.suggest-item{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;border-bottom:1px solid rgba(0,0,0,0.04);gap:10px}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover, .suggest-item.active{background:var(--bg)}
.suggest-name{font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.suggest-meta{color:var(--text-tertiary);font-size:11.5px;font-weight:600;flex-shrink:0;display:flex;gap:6px;align-items:center}
.suggest-symbol{color:var(--text-secondary)}
.suggest-empty{padding:14px 12px;color:var(--text-tertiary);font-size:12.5px;text-align:center}
button.primary{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
button.primary:hover{background:var(--primary-hover)}
.quick-buttons{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.quick-btn{background:#fff;border:1px solid var(--border);padding:6px 14px;font-size:13px;border-radius:6px;cursor:pointer;color:var(--text-secondary)}
.quick-btn:hover{border-color:var(--primary);color:var(--primary)}
.quick-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.quick-flag{font-size:14px;opacity:0.7}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{padding:16px;background:var(--bg);border-radius:10px;text-align:center}
.metric-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.metric-value{font-size:18px;font-weight:850;letter-spacing:-0.02em}
.metric-note{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.signal{padding:14px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;gap:12px;font-size:14.5px;align-items:center}
.signal strong{white-space:nowrap}
.signal-good{background:var(--good-bg);color:var(--good)}
.signal-bad{background:var(--bad-bg);color:var(--bad)}
.signal-neutral{background:var(--neutral-bg);color:var(--neutral)}
.summary{margin-top:16px;padding:18px;border-radius:12px;font-weight:850;text-align:center;font-size:19px}
.summary-sub{font-size:13px;margin-top:6px;font-weight:500;opacity:0.86}
.section-title{font-size:14px;font-weight:800;margin-bottom:10px;color:var(--text-secondary)}
.sector-hint{font-size:11px;font-weight:600;color:var(--text-tertiary);background:var(--bg);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.result-header{padding:8px 4px 14px 4px;font-size:18px;line-height:1.3}
.result-header strong{font-weight:800;color:var(--text)}
.result-header .muted{color:var(--text-tertiary);font-size:13px;margin-left:8px;font-weight:500}
.svg-chart{width:100%;height:220px;display:block}
.svg-chart-vol{height:80px;margin-top:6px}
.svg-chart-rsi{height:120px}
.svg-chart svg{width:100%;height:100%;display:block}
.line-price{stroke:var(--price);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.line-ma50{stroke:var(--ma50);stroke-width:1.2;fill:none}
.line-ma200{stroke:var(--ma200);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.line-rsi{stroke:#7c3aed;stroke-width:1.5;fill:none}
.bar-vol-up{fill:var(--good);opacity:.65}
.bar-vol-down{fill:var(--bad);opacity:.65}
.ref-line{stroke:#9ca3af;stroke-dasharray:3 3;stroke-width:1;fill:none}
.chart-axis{font-size:10px;fill:var(--text-tertiary)}
.chart-grid{stroke:rgba(0,0,0,0.05);stroke-width:1}
.chart-caption{font-size:11px;color:var(--text-tertiary);margin-top:8px;padding-left:4px;line-height:1.5}
.chart-caption .cap-up{color:var(--good);font-weight:700}
.chart-caption .cap-down{color:var(--bad);font-weight:700}
.signal-legend{font-size:11.5px;font-weight:500;margin-left:8px;color:var(--text-tertiary)}
.signal-legend .lg-good{color:var(--good);font-weight:700}
.signal-legend .lg-bad{color:var(--bad);font-weight:700}
.signal-legend .lg-neutral{color:var(--neutral);font-weight:700}
.legend{font-size:12px;color:var(--text-tertiary);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle;border-radius:10px}
.legend .p::before{background:var(--price)}
.legend .m50::before{background:var(--ma50)}
.legend .m200::before{background:var(--ma200);border-top:2px dashed var(--ma200);height:0}
.footer{text-align:center;color:var(--text-tertiary);font-size:12px;margin-top:40px}
.loader{width:20px;height:20px;border:3px solid #CCC;border-bottom-color:var(--primary);border-radius:50%;display:inline-block;animation:rot 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes rot{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(255,255,255,0.52);border:1px solid var(--border);padding:6px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1 1 auto;min-width:max-content;border:none;background:transparent;color:var(--text-secondary);padding:11px 12px;border-radius:9px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.fundamental-hero{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.fundamental-hero{grid-template-columns:1.2fr 0.8fr;align-items:stretch}}
.company-box{background:var(--bg);border-radius:12px;padding:16px}
.company-name{font-size:20px;font-weight:900;letter-spacing:-0.03em}
.company-meta{font-size:12px;color:var(--text-secondary);margin-top:6px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:rgba(26,77,140,0.08);color:var(--primary)}
.tag.kr{background:rgba(196,67,67,0.08);color:var(--bad)}
.fund-score{background:linear-gradient(135deg,rgba(26,77,140,0.10),rgba(45,134,89,0.10));border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.fund-score .score-number{font-size:34px;font-weight:950;letter-spacing:-0.05em}
.fund-score .score-label{font-size:13px;color:var(--text-secondary);margin-top:2px}
.fund-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.fund-grid{grid-template-columns:repeat(4,1fr)}}
.fund-card{background:var(--bg);border-radius:12px;padding:15px;min-height:120px}
.fund-title{font-size:12px;color:var(--text-secondary);font-weight:800;margin-bottom:8px}
.fund-main{font-size:20px;font-weight:950;letter-spacing:-0.03em}
.fund-desc{font-size:11.5px;color:var(--text-secondary);margin-top:6px;line-height:1.45}
.bar-list{display:grid;gap:18px}
.bar-row{display:grid;grid-template-columns:1fr;gap:6px;font-size:13px}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar-label{color:var(--text-secondary);font-weight:800;display:inline-flex;align-items:center;gap:6px}
.bar-sub{color:var(--text-tertiary);font-weight:500;font-size:11.5px;margin-left:2px}
.bar-rating{display:flex;align-items:center;gap:8px}
.bar-val{font-weight:850;font-size:14.5px;letter-spacing:-.01em;color:var(--text)}
.bar-verdict{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.bar-verdict.good{background:var(--good-bg);color:var(--good)}
.bar-verdict.neutral{background:var(--neutral-bg);color:var(--neutral)}
.bar-verdict.bad{background:var(--bad-bg);color:var(--bad)}
.bar-track{position:relative;height:14px;background:rgba(0,0,0,0.04);border-radius:999px;overflow:hidden}
.bar-zones{position:absolute;inset:0;display:flex;opacity:.22}
.bar-zones .zone{height:100%}
.bar-zones .zone.zone-bad{background:var(--bad)}
.bar-zones .zone.zone-neutral{background:var(--neutral)}
.bar-zones .zone.zone-good{background:var(--good)}
.bar-marker{position:absolute;top:-3px;bottom:-3px;width:4px;background:var(--text);border-radius:3px;transform:translateX(-50%);box-shadow:0 0 0 2px rgba(255,255,255,.95);transition:left .6s}
.bar-hint{font-size:11px;color:var(--text-tertiary);line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 10px}
.bar-hint span{white-space:nowrap}
.mini-note{margin-top:12px;color:var(--text-tertiary);font-size:12px;line-height:1.55}
.empty-state{background:var(--neutral-bg);color:var(--neutral);border-radius:12px;padding:18px;font-size:14px;line-height:1.6}

/* Recent ticker history */
.recent-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.recent-label{font-size:12px;color:var(--text-tertiary);font-weight:700}
.recent-chip{display:inline-flex;align-items:center;gap:0;background:#fff;border:1px solid var(--border);padding:5px 4px 5px 11px;font-size:12.5px;border-radius:999px;cursor:pointer;color:var(--text-secondary);font-weight:600;font-family:inherit}
.recent-chip:hover{border-color:var(--primary);color:var(--primary)}
.recent-chip .recent-chip-text{padding-right:6px}
.recent-x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.04);color:var(--text-tertiary);font-size:13px;line-height:1;margin-left:0;border:none;cursor:pointer;font-family:inherit;padding:0}
.recent-x:hover{background:var(--bad);color:#fff}
.recent-clear{background:none;border:none;color:var(--text-tertiary);font-size:11.5px;padding:4px 6px;cursor:pointer;margin-left:auto;font-family:inherit}
.recent-clear:hover{color:var(--bad)}

/* Info tooltip system (cross-platform: hover + tap) */
.info-tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.08);color:var(--text-secondary);font-size:10px;font-weight:800;cursor:help;user-select:none;border:none;padding:0;margin:0 0 0 4px;font-family:inherit;line-height:1;vertical-align:1px;flex-shrink:0}
.info-tip:hover,.info-tip:focus-visible{background:var(--primary);color:#fff;outline:none}
.tooltip-popover{position:absolute;z-index:1000;max-width:min(320px,calc(100vw - 16px));background:#1f1f1d;color:#fff;font-size:12.5px;line-height:1.65;padding:11px 13px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:pre-line;word-break:keep-all;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease;top:0;left:0}
.tooltip-popover.show{opacity:1;visibility:visible}

/* Card sub-explanation for beginners */
.fund-sub{font-size:11px;color:var(--text-tertiary);margin-top:8px;line-height:1.5;border-top:1px dashed rgba(0,0,0,.06);padding-top:6px}
.fund-title{display:flex;align-items:center}
.signal span{display:inline-flex;align-items:center;gap:6px}

/* Flow / Short tab tables */
.flow-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.flow-table th,.flow-table td{padding:8px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
.flow-table th{font-size:11.5px;font-weight:800;color:var(--text-secondary);background:var(--bg);text-align:right}
.flow-table th:first-child,.flow-table td:first-child{text-align:left}
.flow-table tr:last-child td{border-bottom:none}
.flow-table .pos{color:var(--good);font-weight:700}
.flow-table .neg{color:var(--bad);font-weight:700}
.flow-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.flow-summary{grid-template-columns:repeat(4,1fr)}}
.flow-stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.flow-stat-label{font-size:11.5px;color:var(--text-secondary);margin-bottom:4px;font-weight:700}
.flow-stat-value{font-size:16px;font-weight:900;letter-spacing:-0.02em}
.flow-stat-sub{font-size:10.5px;color:var(--text-tertiary);margin-top:3px}
.flow-bar-cell{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.flow-mini-bar{display:inline-block;height:6px;background:rgba(0,0,0,0.06);border-radius:3px;width:42px;position:relative;overflow:hidden}
.flow-mini-bar .fill{position:absolute;top:0;bottom:0;left:50%;background:var(--text-tertiary)}
.flow-mini-bar .fill.pos{background:var(--good)}
.flow-mini-bar .fill.neg{background:var(--bad)}
.anom-row{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;background:var(--bg);margin-bottom:6px;font-size:13px;align-items:center}
.anom-row .anom-tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.anom-row .anom-tag.up{background:var(--good-bg);color:var(--good)}
.anom-row .anom-tag.dn{background:var(--bad-bg);color:var(--bad)}
.anom-row .anom-tag.vol{background:var(--neutral-bg);color:var(--neutral)}
.anom-row .anom-date{font-weight:800;color:var(--text)}
.anom-row .anom-detail{color:var(--text-secondary);font-size:12px}
.disclaimer{background:var(--neutral-bg);color:var(--neutral);border-radius:10px;padding:11px 14px;font-size:12px;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📈 모멘텀 신호 체크 Pro</h1>
<div class="subtitle">이평선 + RSI + 거래량 + 기간 수익률 + 펀더멘털 · 미국 &amp; 한국 주식</div>
</header>

<div class="card">
<div class="search-row">
<input id="ticker" class="ticker-input" placeholder="티커 또는 회사명 (예: AAPL, 005930, 삼성전자)" autocomplete="off">
<button class="primary" onclick="run()">분석하기</button>
<div id="suggest-list" role="listbox"></div>
</div>
<div class="quick-buttons">
<span class="quick-flag">🇺🇸</span>
<button class="quick-btn" onclick="setT('TSM')">TSM</button>
<button class="quick-btn" onclick="setT('NVDA')">NVDA</button>
<button class="quick-btn" onclick="setT('AAPL')">AAPL</button>
<button class="quick-btn" onclick="setT('MSFT')">MSFT</button>
<button class="quick-btn" onclick="setT('QQQ')">QQQ</button>
<button class="quick-btn" onclick="setT('SPY')">SPY</button>
<div class="quick-sep"></div>
<span class="quick-flag">🇰🇷</span>
<button class="quick-btn" onclick="setT('005930')">삼성전자</button>
<button class="quick-btn" onclick="setT('000660')">SK하이닉스</button>
<button class="quick-btn" onclick="setT('035420')">NAVER</button>
<button class="quick-btn" onclick="setT('005380')">현대차</button>
<button class="quick-btn" onclick="setT('051910')">LG화학</button>
</div>
<div id="recent" class="recent-row" style="display:none"></div>
</div>

<div id="results" style="display:none">
<div class="tabs">
<button class="tab-btn active" data-tab="tech" onclick="switchTab('tech')">📈 기술적 분석</button>
<button class="tab-btn" data-tab="fund" onclick="switchTab('fund')">🏢 펀더멘털 분석</button>
<button class="tab-btn" data-tab="flow" onclick="switchTab('flow')">🏦 수급 동향</button>
<button class="tab-btn" data-tab="short" onclick="switchTab('short')">🩳 공매도·이상신호</button>
</div>

<div id="tab-tech" class="tab-panel active">
<div id="result-header"></div>
<div class="card">
<div class="section-title">핵심 지표</div>
<div id="metrics" class="metrics"></div>
</div>
<div class="card">
<div class="section-title">가격 추이 (1년)</div>
<div class="legend"><span class="p">현재가</span><span class="m50">50일 이동평균</span><span class="m200">200일 이동평균</span></div>
<div id="chart-price" class="svg-chart"></div>
<div id="chart-volume" class="svg-chart svg-chart-vol"></div>
<div class="chart-caption">최근 60일 거래량 · <span class="cap-up">초록</span> 가격 상승일 / <span class="cap-down">빨강</span> 하락일</div>
</div>
<div class="card">
<div class="section-title">RSI(14)</div>
<div id="chart-rsi" class="svg-chart svg-chart-rsi"></div>
</div>
<div class="card">
<div class="section-title">종합 신호 <span class="signal-legend"><span class="lg-good">✓ 긍정</span> · <span class="lg-bad">✗ 부정</span> · <span class="lg-neutral">• 중립</span></span></div>
<div id="signals"></div>
<div id="summary"></div>
</div>
</div>

<div id="tab-fund" class="tab-panel">
<div id="fund-content"></div>
</div>

<div id="tab-flow" class="tab-panel">
<div id="flow-content"></div>
</div>

<div id="tab-short" class="tab-panel">
<div id="short-content"></div>
</div>
</div>

<div id="status" class="card" style="display:none"></div>
<div class="footer">데이터 출처: Yahoo Finance(공개 엔드포인트, CORS 프록시 경유) · 네이버 금융(한국 주식 보완) · Stooq(미국 차트 백업)</div>
</div>

<script>
const PROXIES=[
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>'https://proxy.cors.sh/'+u,
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
];

// 프록시 레이싱: 첫 프록시 즉시 발사, 나머지는 220ms 간격 점진 발사 → 첫 성공 채택.
// 한 곳이 죽거나 느려도 다른 프록시가 곧 응답하면 전체 대기시간이 "가장 빠른 프록시"로 수렴.
const PROXY_STAGGER_MS=220;
async function racingFetch(url,validate){
  const ctrls=PROXIES.map(()=>new AbortController());
  const timers=[];
  const launch=i=>fetch(PROXIES[i](url),{signal:ctrls[i].signal,cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
    .then(t=>{if(validate)validate(t);return t}); // 잘못된 본문이면 reject → 다른 racer가 채택됨
  const racers=PROXIES.map((_,i)=>{
    if(i===0)return launch(0);
    return new Promise((resolve,reject)=>{
      const t=setTimeout(()=>launch(i).then(resolve,reject),PROXY_STAGGER_MS*i);
      timers.push(t);
      ctrls[i].signal.addEventListener('abort',()=>{clearTimeout(t);reject(new DOMException('aborted','AbortError'))});
    });
  });
  try{
    const txt=await Promise.any(racers);
    ctrls.forEach(c=>c.abort());
    timers.forEach(t=>clearTimeout(t));
    return txt;
  }catch(e){
    ctrls.forEach(c=>c.abort());
    timers.forEach(t=>clearTimeout(t));
    const errs=(e&&e.errors)||[e];
    throw errs[errs.length-1]||new Error('all proxies failed');
  }
}

// ─── 응답 캐시 (localStorage, TTL + Stale-While-Revalidate) ──────────────────
// URL → {t: timestamp_ms, v: body_text}. 키는 원본 URL(프록시 미포함).
const CACHE_KEY='momcheck.cache.v1';
const CACHE_MAX_TOTAL=4*1024*1024; // 4MB
const CACHE_MAX_ITEM=1*1024*1024;  // 1MB
let _cacheMem=null;
function _loadCache(){
  if(_cacheMem)return _cacheMem;
  try{const raw=localStorage.getItem(CACHE_KEY);_cacheMem=raw?JSON.parse(raw):{}}catch(_){_cacheMem={}}
  return _cacheMem;
}
function _saveCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(_cacheMem||{}))}
  catch(_){
    // quota 초과 시 가장 오래된 절반 evict 후 재시도
    try{
      const c=_cacheMem||{};
      const ents=Object.entries(c).sort((a,b)=>(a[1].t||0)-(b[1].t||0));
      for(let i=0;i<Math.floor(ents.length/2);i++)delete c[ents[i][0]];
      localStorage.setItem(CACHE_KEY,JSON.stringify(c));
    }catch(__){}
  }
}
function _enforceCacheBudget(){
  const c=_cacheMem||{};
  let total=0;const sizes=[];
  for(const k in c){
    const s=k.length+(c[k].v?c[k].v.length:0)+32;
    sizes.push([k,s,c[k].t||0]); total+=s;
  }
  if(total<=CACHE_MAX_TOTAL)return;
  sizes.sort((a,b)=>a[2]-b[2]);
  let i=0;
  while(total>CACHE_MAX_TOTAL&&i<sizes.length){delete c[sizes[i][0]];total-=sizes[i][1];i++}
}
function cacheGet(url){return _loadCache()[url]||null}
function cacheSet(url,body){
  if(typeof body!=='string')return;
  if(body.length>CACHE_MAX_ITEM)return;
  const c=_loadCache();
  c[url]={t:Date.now(),v:body};
  _enforceCacheBudget();
  _saveCache();
}

// SWR 백그라운드 갱신 — 동일 URL 동시 요청 한 건으로 합치기
const _swrInflight={};
function _scheduleRefresh(url,validate){
  if(_swrInflight[url])return _swrInflight[url];
  _swrInflight[url]=racingFetch(url,validate)
    .then(t=>{cacheSet(url,t);return t})
    .catch(()=>null)
    .finally(()=>{delete _swrInflight[url]});
  return _swrInflight[url];
}

// 마지막 응답이 stale였는지 표시 (UI 인디케이터용). 호출자가 consumeStaleFlag로 회수.
let _staleHit=false;
function consumeStaleFlag(){const s=_staleHit;_staleHit=false;return s}

// 정책: ttlMs 이내 → 즉시. ttlMs~ttlMs+swrMs → stale 즉시 + 백그라운드 갱신. 그 외 → 네트워크.
// validate(body): 캐시 본문 또는 racing 응답을 검증. 실패 시 캐시 무시 + 다른 racer 채택.
async function cachedFetch(url,policy,validate){
  const{ttlMs=0,swrMs=0}=policy||{};
  const ent=cacheGet(url);
  const now=Date.now();
  const cacheValid=ent&&(()=>{try{if(validate)validate(ent.v);return true}catch(_){return false}})();
  if(cacheValid&&(now-ent.t)<=ttlMs)return ent.v;
  if(cacheValid&&ttlMs+swrMs>0&&(now-ent.t)<=ttlMs+swrMs){
    _staleHit=true;
    _scheduleRefresh(url,validate);
    return ent.v;
  }
  const body=await racingFetch(url,validate);
  cacheSet(url,body);
  return body;
}

const _validateJSON=t=>{const j=JSON.parse(t);if(!j||typeof j!=='object')throw new Error('empty response');};
async function fetchJSON(url,policy){
  const body=await cachedFetch(url,policy,_validateJSON);
  return JSON.parse(body);
}
async function fetchText(url,policy){
  return await cachedFetch(url,policy);
}

// 정책 프리셋 (사용자 선택: 더 길게)

  CHART:    {ttlMs:24*60*60*1000, swrMs:48*60*60*1000}, // 24h / +48h SWR

  QUOTE:    {ttlMs: 6*60*60*1000, swrMs:18*60*60*1000}, // 6h / +18h SWR

};

  // 시장 식별만 필요해서 5일치 차트(가벼움)를 캐시 정책 적용해 받음.

  catch(_){throw new Error('KOSPI/KOSDAQ 모두에서 해당 종목을 찾을 수 없습니다 (코드를 확인해 주세요)')}
}

function fmtPriceKRW(n){
  if(n==null||!isFinite(n))return'—';
  return'₩'+Math.round(n).toLocaleString('ko-KR');
}
function fmtBigKRW(n){
  if(n==null||!isFinite(n))return'—';
  const a=Math.abs(n);
  if(a>=1e12)return(n/1e12).toFixed(1)+'조원';
  if(a>=1e8)return Math.round(n/1e8)+'억원';
  if(a>=1e4)return Math.round(n/1e4)+'만원';
  return'₩'+Math.round(n).toLocaleString('ko-KR');
}

// ─── 네이버 모바일 JSON API (HTML 파싱보다 안정적) ────────────────────────────
async function getNaverStockJSON(code){
  try{
    const toN=v=>{const n=parseFloat(String(v||'').replace(/[,\s]/g,''));return isFinite(n)?n:null};
    const toP=v=>{const n=toN(v);return n!=null?n/100:null};

    // 1차: 기본 정보 (PER, PBR, 배당 등)
    const base=await fetchText(`https://m.stock.naver.com/api/stock/${code}/basicInfo`,TTL.QUOTE)
      .then(t=>JSON.parse(t)).catch(()=>null);
    // 2차: 재무 요약 (ROE, 영업이익률 등)
    const fin=await fetchText(`https://m.stock.naver.com/api/stock/${code}/financeSummary`,TTL.QUOTE)
      .then(t=>JSON.parse(t)).catch(()=>null);

    if(!base&&!fin)return null;

    // base 필드: per, pbr, eps, roe, marketValue(억원), stockName 등
    const b=base||{};
    // fin 필드: 연간 실적 배열 (매출, 영업이익, 순이익, ROE 등)
    const f=fin||{};
    const ann=Array.isArray(f.financeInfo)?f.financeInfo.find(x=>x.financeInfoType==='ANNUAL')?.financeItem:null;
    const getAnn=key=>{
      if(!Array.isArray(ann))return null;
      const item=ann.find(x=>x.key===key);
      return item?.value?.[item.value.length-1]??null;
    };

    const mcapRaw=toN(b.marketValue||b.marketCap);
    return{
      pe:   toN(b.per||b.PER),
      pb:   toN(b.pbr||b.PBR),
      roe:  toP(b.roe||b.ROE||getAnn('ROE')),
      divY: toP(b.dividend||b.dividendYield),
      mcap: mcapRaw!=null?mcapRaw*1e8:null, // 억원→원
      naverName: b.stockName||b.itemName||null,
      // fin 기반 추가 지표
      opMargin: toP(getAnn('operatingProfitRate')||getAnn('영업이익률')),
      profitM:  toP(getAnn('netProfitRate')||getAnn('순이익률')),
      revGrowth: (()=>{
        // 매출액 최근 2개년 성장률
        if(!Array.isArray(ann))return null;
        const rev=ann.find(x=>x.key==='revenue'||x.key==='매출액');
        if(!rev||!Array.isArray(rev.value)||rev.value.length<2)return null;
        const cur=toN(rev.value[rev.value.length-1]);
        const prev=toN(rev.value[rev.value.length-2]);
        if(!cur||!prev||prev===0)return null;
        return(cur-prev)/Math.abs(prev);
      })(),
    };
  }catch(_){return null}
}

async function getNaverFinanceData(code){
  // JSON API를 먼저 시도 — HTML 파싱보다 훨씬 안정적
  const jsonData=await getNaverStockJSON(code);

  try{
    const url=`https://finance.naver.com/item/main.naver?code=${encodeURIComponent(code)}`;
    const html=await fetchText(url,TTL.HTML);
    const doc=new DOMParser().parseFromString(html,'text/html');
    const m={};
    const text=htmlToPlainText(html);

    // DOM 파싱: .per_table의 th/td 구조 + 추가 테이블 스캔
    doc.querySelectorAll('table tr').forEach(row=>{
      const cells=row.querySelectorAll('th,td');
      let lastKey=null;
      cells.forEach(cell=>{
        const cellText=cell.textContent.trim();
        if(cell.tagName==='TH'||cellText.match(/^(PER|PBR|ROE|ROA|부채|매출|이익|배당|EPS)/)){
          lastKey=cellText.replace(/[:\s]+$/,'');
        }else if(lastKey&&cell.tagName==='TD'){
          const em=cell.querySelector('em');
          let val=(em?em.textContent:cellText).trim().replace(/[,배원%]/g,'');
          if(val&&val!=='—'&&!m[lastKey])m[lastKey]=val;
          lastKey=null;
        }
      });
    });

    // 텍스트 정규식 추출 — 여러 패턴 시도
    const tryRegex=(key,patterns)=>{
      if(!m[key]&&Array.isArray(patterns)){
        for(const re of patterns){
          const x=text.match(re);
          if(x){m[key]=x[1];break}
        }
      }
    };
    // 엄격한 패턴: 라벨과 값 사이에 공백/콜론/파이프만 허용 (다른 필드 숫자 오인 방지)
    const SEP='\\s*[:：|]?\\s*';
    const NUM='(-?[0-9]+(?:\\.[0-9]+)?)';
    // 퍼센트 값은 %를 캡처에 포함 — pctFromText가 단위 정보를 잃지 않게 함
    // (예: 0.5% 같은 작은 비율도 0.5 vs 0.005 추정 없이 정확히 변환)
    const PCT='((?:-?[0-9]+(?:\\.[0-9]+)?)\\s*%)';
    tryRegex('PER',[new RegExp(`(?:^|\\s)PER${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`주가수익비율${SEP}${NUM}\\s*배`)]);
    tryRegex('PBR',[new RegExp(`(?:^|\\s)PBR${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`주가순자산비율${SEP}${NUM}\\s*배`)]);
    tryRegex('추정PER',[new RegExp(`추정\\s*PER${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`Forward\\s*(?:PER|P/E)${SEP}${NUM}`)]);
    tryRegex('PSR',[new RegExp(`(?:^|\\s)P/S${SEP}${NUM}\\s*(?:배|$|\\s)`),new RegExp(`주가매출액비율${SEP}${NUM}`)]);
    tryRegex('ROE',[new RegExp(`(?:^|\\s)ROE${SEP}${PCT}`),new RegExp(`자기자본이익률${SEP}${PCT}`)]);
    tryRegex('ROA',[new RegExp(`(?:^|\\s)ROA${SEP}${PCT}`),new RegExp(`총자산이익률${SEP}${PCT}`)]);
    // 배당수익률은 "배당성향(payout ratio)"과 헷갈리지 않도록 매우 엄격하게
    tryRegex('배당수익률',[new RegExp(`시가배당률${SEP}${PCT}`),new RegExp(`배당수익률${SEP}${PCT}`)]);
    tryRegex('부채비율',[new RegExp(`(?:^|\\s)부채비율${SEP}${PCT}`)]);
    tryRegex('유동비율',[new RegExp(`(?:^|\\s)유동비율${SEP}${PCT}`)]);
    // 순이익률/영업이익률은 라벨 직후의 % 값만 (성장률 등 다른 필드와 분리)
    tryRegex('순이익률',[new RegExp(`(?:^|\\s)순이익률${SEP}${PCT}`)]);
    tryRegex('영업이익률',[new RegExp(`(?:^|\\s)영업이익률${SEP}${PCT}`)]);
    tryRegex('매출액증가율',[new RegExp(`매출액증가율${SEP}${PCT}`)]);
    tryRegex('당기순이익증가율',[new RegExp(`당기순이익증가율${SEP}${PCT}`)]);

    // 시가총액 (조원/억원 단위)
    let mcap=null;
    const mcapEl=doc.querySelector('#_market_sum');
    if(mcapEl){
      const txt=mcapEl.textContent.trim().replace(/,/g,'');
      const joM=txt.match(/([0-9]+(?:\.[0-9]+)?)\s*조\s*([0-9]*)?/);
      if(joM){
        mcap=parseFloat(joM[1])*1e12;
        if(joM[2]&&joM[2].trim())mcap+=parseFloat(joM[2])*1e8;
      }else{
        const eokM=txt.match(/([0-9]+)/);
        if(eokM)mcap=parseFloat(eokM[1])*1e8;
      }
    }

    // 회사명 추출
    const nameEl=doc.querySelector('.wrap_company h2 a, .h_nm');
    const naverName=nameEl?nameEl.textContent.trim():null;

    const htmlResult={
      pe:numFromText(m['PER']||null),
      fpe:numFromText(m['추정PER']||null),
      pb:numFromText(m['PBR']||null),
      ps:numFromText(m['PSR']||null),
      divY:pctFromText(m['배당수익률']||null),
      roe:pctFromText(m['ROE']||null),
      roa:pctFromText(m['ROA']||null),
      debtEq:numFromText(m['부채비율']||null),
      currRatio:numFromText(m['유동비율']||null),
      profitM:pctFromText(m['순이익률']||null),
      opMargin:pctFromText(m['영업이익률']||null),
      revGrowth:pctFromText(m['매출액증가율']||null),
      earnGrowth:pctFromText(m['당기순이익증가율']||null),
      mcap,
      naverName
    };

    // JSON API 데이터를 우선 사용하고, 없는 필드만 HTML 파싱으로 보충
    const merged={...htmlResult};
    if(jsonData){
      // JSON이 더 신뢰성 높으므로 우선 적용
      if(jsonData.pe!=null) merged.pe=jsonData.pe;
      if(jsonData.pb!=null) merged.pb=jsonData.pb;
      if(jsonData.roe!=null) merged.roe=jsonData.roe;
      if(jsonData.divY!=null) merged.divY=jsonData.divY;
      if(jsonData.mcap!=null) merged.mcap=jsonData.mcap;
      if(jsonData.naverName) merged.naverName=jsonData.naverName;
      if(jsonData.opMargin!=null&&merged.opMargin==null) merged.opMargin=jsonData.opMargin;
      if(jsonData.profitM!=null&&merged.profitM==null) merged.profitM=jsonData.profitM;
      if(jsonData.revGrowth!=null&&merged.revGrowth==null) merged.revGrowth=jsonData.revGrowth;
    }

    if(Object.values(merged).some(v=>v!=null)) return merged;
    // HTML도 실패했지만 JSON은 있으면 JSON 반환
    if(jsonData&&Object.values(jsonData).some(v=>v!=null)) return jsonData;
    return null;
  }catch(_){
    // HTML 파싱 실패해도 JSON 데이터는 반환
    if(jsonData&&Object.values(jsonData).some(v=>v!=null)) return jsonData;
    return null;
  }
}

// ─── 툴팁 팝오버 (데스크톱 hover + 모바일 tap, 줄바꿈 안전) ────────────────────
(function(){
  let tipEl=null;
  let activeKey=null;
  let touchUsed=false;
  function ensureEl(){
    if(tipEl)return tipEl;
    tipEl=document.createElement('div');
    tipEl.className='tooltip-popover';
    tipEl.setAttribute('role','tooltip');
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function position(target){
    const el=ensureEl();
    const r=target.getBoundingClientRect();
    el.style.visibility='hidden';
    el.style.opacity='0';
    el.classList.add('show');
    const tw=el.offsetWidth,th=el.offsetHeight;
    const vw=document.documentElement.clientWidth;
    const padding=8;
    let left=r.left+r.width/2-tw/2+window.scrollX;
    if(left<8)left=8;
    if(left+tw>vw-8)left=Math.max(8,vw-8-tw);
    let top=r.bottom+padding+window.scrollY;
    const spaceBelow=window.innerHeight-r.bottom;
    if(spaceBelow<th+padding+8&&r.top>th+padding+8){
      top=r.top-th-padding+window.scrollY;
    }
    el.style.left=left+'px';
    el.style.top=top+'px';
    el.style.visibility='';
    el.style.opacity='';
  }
  function show(target,key){
    const g=GLOSSARY[key];
    if(!g)return;
    const el=ensureEl();
    el.textContent=g.long;
    activeKey=key;
    requestAnimationFrame(()=>position(target));
  }
  function hide(){
    if(!tipEl)return;
    tipEl.classList.remove('show');
    activeKey=null;
  }
  // 터치 이벤트 감지 (모바일에서 hover 충돌 방지)
  document.addEventListener('touchstart',()=>{touchUsed=true},{passive:true,once:true});
  // hover (데스크톱)
  document.addEventListener('mouseover',e=>{
    if(touchUsed)return;
    const t=e.target.closest('[data-tip-key]');
    if(!t)return;
    show(t,t.dataset.tipKey);
  });
  document.addEventListener('mouseout',e=>{
    if(touchUsed)return;
    const t=e.target.closest('[data-tip-key]');
    if(!t)return;
    if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip-key]')===t)return;
    hide();
  });
  // tap / click (모바일·데스크톱 공통 토글)
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-tip-key]');
    if(t){
      e.preventDefault();
      e.stopPropagation();
      const k=t.dataset.tipKey;
      if(activeKey===k&&tipEl&&tipEl.classList.contains('show')){hide()}
      else{show(t,k)}
      return;
    }
    if(!e.target.closest('.tooltip-popover'))hide();
  });
  // 키보드 접근성
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
  document.addEventListener('focusin',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip-key]');
    if(t)show(t,t.dataset.tipKey);
  });
  document.addEventListener('focusout',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip-key]');
    if(t)hide();
  });
  // 스크롤·리사이즈 시 닫기 (위치 어긋남 방지)
  window.addEventListener('scroll',()=>{if(activeKey)hide()},{passive:true});
  window.addEventListener('resize',()=>{if(activeKey)hide()});
})();

const RECENT_KEY='momcheck.recent.v1';

function tickerLabel(t){

function escAttr(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addToRecent(t){
  const u=String(t||'').trim().toUpperCase();
  if(!u)return;
  const arr=loadRecent().filter(x=>x.t!==u);

function removeFromRecent(t){

// ─── 자동완성 (회사명/티커 검색) ─────────────────────────────────────────────
let _searchDebounceId=0;
let _searchAbort=null;
let _activeSuggest=-1;
let _currentSuggestions=[];
function hideSuggest(){
  const el=document.getElementById('suggest-list');
  if(el){el.classList.remove('open');el.innerHTML=''}
  _activeSuggest=-1;
  _currentSuggestions=[];
}
// 로컬 매칭: KR_NAMES(이름·코드 양방향), KR_NAMES 코드 prefix
function localSuggestions(q){
  const s=String(q||'').trim();
  if(!s)return[];
  const sLower=s.toLowerCase();
  const out=[];
  // 1) 한국 회사명 부분 일치
  for(const [name,code] of Object.entries(KR_NAME_TO_CODE)){
    if(name.includes(s)||name.toLowerCase().includes(sLower)){
      out.push({symbol:code,name,exch:'KRX',source:'local'});
    }
  }
  // 2) 코드 prefix 매칭 (한국 6자리)
  for(const [code,name] of Object.entries(KR_NAMES)){
    if(code.startsWith(s)&&!out.some(x=>x.symbol===code)){
      out.push({symbol:code,name,exch:'KRX',source:'local'});
    }
  }
  return out.slice(0,6);
}
async function fetchYahooSuggestions(q){
  const url=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0`;
  try{
    const j=await fetchJSON(url,{ttlMs:15*60*1000,swrMs:30*60*1000});
    const quotes=j?.quotes||[];
    return quotes
      .filter(x=>x.symbol&&(x.quoteType==='EQUITY'||x.quoteType==='ETF'))
      .map(x=>({
        symbol:x.symbol,
        name:x.shortname||x.longname||x.symbol,
        exch:x.exchDisp||x.exchange||'',
        source:'yahoo'
      }));
  }catch(_){return[]}
}
function mergeSuggestions(local,remote,limit=6){
  const seen=new Set();
  const out=[];
  for(const x of local){if(!seen.has(x.symbol)){seen.add(x.symbol);out.push(x)}}
  for(const x of remote){if(!seen.has(x.symbol)){seen.add(x.symbol);out.push(x)}}
  return out.slice(0,limit);
}
function renderSuggestions(items){
  const el=document.getElementById('suggest-list');
  if(!el)return;
  _currentSuggestions=items||[];
  if(!items||!items.length){el.innerHTML='';el.classList.remove('open');return}
  _activeSuggest=-1;
  el.innerHTML=items.map((x,i)=>
    `<div class="suggest-item" data-i="${i}" role="option">
       <span class="suggest-name">${escAttr(x.name)}</span>
       <span class="suggest-meta"><span class="suggest-symbol">${escAttr(x.symbol)}</span>${x.exch?`<span>· ${escAttr(x.exch)}</span>`:''}</span>
     </div>`
  ).join('');
  el.classList.add('open');
}
function pickSuggestion(i){
  const x=_currentSuggestions[i];
  if(!x)return;
  setT(x.symbol);
}
function moveSuggest(delta){
  if(!_currentSuggestions.length)return;
  _activeSuggest=(_activeSuggest+delta+_currentSuggestions.length+1)%(_currentSuggestions.length+1)-1;
  // -1 ~ length-1 순환 (인풋 자체 포커스 상태 포함)
  const items=document.querySelectorAll('#suggest-list .suggest-item');
  items.forEach((el,idx)=>el.classList.toggle('active',idx===_activeSuggest));
  if(_activeSuggest>=0&&items[_activeSuggest])items[_activeSuggest].scrollIntoView({block:'nearest'});
}
async function handleSearchInput(q){
  // 1차: 로컬 결과 즉시 그리기 — 동기, 0ms
  const local=localSuggestions(q);
  if(local.length)renderSuggestions(local);
  // 2차: Yahoo 결과 머지 — debounced
  if(_searchAbort)_searchAbort.abort();
  clearTimeout(_searchDebounceId);
  if(q.length<1){hideSuggest();return}
  _searchDebounceId=setTimeout(async()=>{
    const myAbort=new AbortController();
    _searchAbort=myAbort;
    const remote=await fetchYahooSuggestions(q);
    if(myAbort.signal.aborted)return; // 다음 키 입력에 의해 취소됨
    renderSuggestions(mergeSuggestions(local,remote,6));
  },200);
}

async function getChart(ticker){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=2y&interval=1d`;
  const policy=chartPolicy(ticker);
  try{
    const j=await fetchJSON(url,policy);
    const r=j.chart.result[0];
    const ts=r.timestamp;
    const c=r.indicators.quote[0].close;
    const v=r.indicators.quote[0].volume;
    const out=[];
    for(let i=0;i<ts.length;i++){
      if(c[i]!=null) out.push({d:new Date(ts[i]*1000),c:c[i],v:v[i]||0});
    }
    out._meta=r.meta||null; // 차트 응답 메타(shortName/longName 등) — 회사명 즉시 표시용
    return out;
  }catch(e){
    // Stooq 백업 — 미국 주식만 지원
    if(/\.(KS|KQ)$/i.test(ticker)) throw e;
    const sym=ticker.toLowerCase()+'.us';
    const t=await fetchText(`https://stooq.com/q/d/l/?s=${sym}&i=d`,policy);
    const lines=t.trim().split('\n').slice(1);
    return lines.map(l=>{const p=l.split(',');return{d:new Date(p[0]),c:+p[4],v:+p[5]||0}}).filter(x=>!isNaN(x.c)).slice(-520);
  }
}

async function getQuoteSummary(ticker){
  const full='summaryDetail,defaultKeyStatistics,financialData,assetProfile,price,quoteType';
  const slim='summaryDetail,defaultKeyStatistics,financialData,price,quoteType';
  const attempts=[
    `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${full}`,
    `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${full}`,
    `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${slim}`,
    `https://query2.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${slim}`,
  ];
  // 4개 엔드포인트를 동시 발사 → 첫 성공 채택. 직렬 try의 타임아웃 누적 제거.
  try{
    const row=await Promise.any(attempts.map(async url=>{
      const j=await fetchJSON(url,TTL.QUOTE);
      const row=j?.quoteSummary?.result?.[0];
      if(!row)throw new Error(j?.quoteSummary?.error?.description||'no quoteSummary data');
      return row;
    }));
    if(row)return row;
  }catch(_){}
  // 최후 수단: 모듈을 그룹별로 병렬 요청 후 병합 (하나의 모듈이 전체 요청을 막을 때 대응)
  // 손익계산서·재무상태표 포함 — financialData 모듈이 없을 때 직접 계산용
  const modGroups=[
    'summaryDetail,defaultKeyStatistics',
    'financialData',
    'price,quoteType',
    'assetProfile',
    'incomeStatementHistory,incomeStatementHistoryQuarterly',
    'balanceSheetHistory,balanceSheetHistoryQuarterly',
  ];
  const merged={};
  await Promise.allSettled(modGroups.flatMap(mods=>
    ['query1','query2'].map(async host=>{
      try{
        const j=await fetchJSON(`https://${host}.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${mods}`,TTL.QUOTE);
        const row=j?.quoteSummary?.result?.[0];
        if(row) Object.assign(merged,row);
      }catch(_){}
    })
  ));
  if(Object.keys(merged).length>0) return merged;
  throw new Error('no quoteSummary data');
}

async function getKoreanStockDetailData(code){
  // 한국 주식의 상세 데이터를 여러 소스에서 수집 (선택사항 — 실패해도 무방)
  try{
    const overviewUrl=`https://finance.naver.com/item/coinfo.naver?code=${encodeURIComponent(code)}`;
    const html=await fetchText(overviewUrl,TTL.HTML);
    if(!html||html.length<100)return null; // 최소 길이 확인

    const doc=new DOMParser().parseFromString(html,'text/html');
    const m={};

    // 테이블에서 지표 추출 (안전하게)
    try{
      doc.querySelectorAll('table tr').forEach(row=>{
        try{
          const cells=row.querySelectorAll('td');
          if(cells.length>=2){
            const key=cells[0]?.textContent?.trim();
            const val=cells[1]?.textContent?.trim();
            if(key&&val&&!m[key])m[key]=val;
          }
        }catch(e){}
      });
    }catch(e){}

    // 텍스트 기반 정규식 추출
    const text=htmlToPlainText(html);
    const tryRegex=(key,patterns)=>{
      if(!m[key]&&Array.isArray(patterns)){
        for(const re of patterns){
          const x=text.match(re);
          if(x){m[key]=x[1];break}
        }
      }
    };

    tryRegex('영업이익률',[/영업이익률[^\d]*(-?[0-9]+(?:\.[0-9]+)?)\s*%/]);
    tryRegex('순이익률',[/순이익률[^\d]*(-?[0-9]+(?:\.[0-9]+)?)\s*%/]);

    // 결과가 있으면 반환, 없으면 null
    return Object.keys(m).length>0?m:null;
  }catch(e){
    return null; // 모든 오류 무시
  }
}

function decodeHtmlEntities(s){

}
function htmlToPlainText(html){
  return decodeHtmlEntities(String(html||'')

    .replace(/<style[\s\S]*?<\/style>/gi,' ')
    .replace(/<[^>]+>/g,' '))
    .replace(/\s+/g,' ').trim();
}
function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function metricBlocksFromText(text,labels=FUND_LABELS){
  const compact=String(text||'').replace(/\s+/g,' ').trim();
  const matches=[];
  const sorted=[...labels].sort((a,b)=>b.length-a.length);
  for(const label of sorted){
    const pat=escapeRegExp(label).replace(/\s+/g,'\\s+');
    const re=new RegExp(`(^|\\s)${pat}(?=\\s|:|$)`,'gi');
    let m;
    while((m=re.exec(compact))){
      const lead=m[1]?m[1].length:0;
      matches.push({label,start:m.index+lead,end:m.index+m[0].length});
    }
  }
  matches.sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));
  const filtered=[];
  for(const m of matches){
    if(filtered.some(x=>m.start>=x.start&&m.end<=x.end)) continue;
    filtered.push(m);
  }
  filtered.sort((a,b)=>a.start-b.start);
  const out={};
  for(let i=0;i<filtered.length;i++){
    const cur=filtered[i];
    const next=filtered[i+1];
    if(out[cur.label]!=null) continue;
    let val=compact.slice(cur.end,next?next.start:cur.end+180).trim();
    val=val.replace(/^[\s:·•|–—-]+/,'').trim();
    if(val) out[cur.label]=val.slice(0,180).trim();
  }
  return out;
}

  }
  return null;
}
function numFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const m=s.match(/-?\$?\s*([0-9]+(?:\.[0-9]+)?)/);
  if(!m)return null;
  const n=parseFloat(m[0].replace(/[$\s]/g,''));
  return isFinite(n)?n:null;
}
function pctFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const pm=s.match(/(-?[0-9]+(?:\.[0-9]+)?)\s*%/);
  if(pm){const n=parseFloat(pm[1]);return isFinite(n)?n/100:null}
  const n=numFromText(s);
  if(n==null)return null;
  return Math.abs(n)>1?n/100:n;
}
function bigFromText(v){
  if(v==null)return null;
  const s=String(v).replace(/,/g,'');
  if(/^\s*(n\/a|-|—)\s*$/i.test(s))return null;
  const m=s.match(/-?\$?\s*([0-9]+(?:\.[0-9]+)?)\s*(trillion|billion|million|thousand|T|B|M|K)?/i);
  if(!m)return null;
  const n=parseFloat(m[1]);
  if(!isFinite(n))return null;
  const u=(m[2]||'').toLowerCase();

  return n*mult;
}

function sma(arr,n){if(arr.length<n)return null;return arr.slice(-n).reduce((a,b)=>a+b,0)/n}
function rsi(closes,n=14){
  if(closes.length<n+1)return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}
  let ag=g/n,al=l/n;
  for(let i=n+1;i<closes.length;i++){const d=closes[i]-closes[i-1];const u=d>0?d:0,dn=d<0?-d:0;ag=(ag*(n-1)+u)/n;al=(al*(n-1)+dn)/n}
  if(al===0)return 100;
  return 100-100/(1+ag/al);
}
// 차트 오버레이용 시리즈 (롤링 윈도우, O(N))
function smaSeries(arr,n){
  const out=new Array(arr.length).fill(null);
  if(arr.length<n)return out;
  let s=0;
  for(let i=0;i<n;i++)s+=arr[i];
  out[n-1]=s/n;
  for(let i=n;i<arr.length;i++){s+=arr[i]-arr[i-n];out[i]=s/n}
  return out;
}
function rsiSeries(closes,n=14){
  const out=new Array(closes.length).fill(null);
  if(closes.length<n+1)return out;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}
  let ag=g/n,al=l/n;
  out[n]=al===0?100:100-100/(1+ag/al);
  for(let i=n+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    const u=d>0?d:0,dn=d<0?-d:0;
    ag=(ag*(n-1)+u)/n; al=(al*(n-1)+dn)/n;
    out[i]=al===0?100:100-100/(1+ag/al);
  }
  return out;
}

  const fmtP=opts.isKorean
    ?(hi>=1e6?(v=>'₩'+(v/1e4).toFixed(1)+'만'):(v=>'₩'+Math.round(v).toLocaleString('ko-KR')))
    :(hi>=1e4?(v=>'$'+(v/1e3).toFixed(1)+'K'):(v=>'$'+v.toFixed(2)));
  // y축 그리드 3선
  const grid=[];
  for(let i=0;i<=3;i++){
    const yv=lo+(hi-lo)*(i/3);
    const yp=y(yv);
    grid.push(`<line class="chart-grid" x1="${padL}" y1="${yp.toFixed(1)}" x2="${W-padR}" y2="${yp.toFixed(1)}"/>`);
    grid.push(`<text class="chart-axis" x="${padL-4}" y="${(yp+3).toFixed(1)}" text-anchor="end">${fmtP(yv)}</text>`);
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="가격 차트">
    ${grid.join('')}
    <path class="line-ma200" d="${path(m200)}"/>
    <path class="line-ma50" d="${path(m50)}"/>
    <path class="line-price" d="${path(closes)}"/>
    <text class="chart-axis" x="${padL}" y="${H-4}" text-anchor="start">${fmt(startDate)}</text>
    <text class="chart-axis" x="${W-padR}" y="${H-4}" text-anchor="end">${fmt(endDate)}</text>
  </svg>`;
}
// 거래량 막대 — 최근 60일, 직전 종가 대비 up/down 색상 분기
function renderVolumeChart(containerId,chart,opts={}){
  const el=document.getElementById(containerId);
  if(!el||!chart||chart.length<2)return;
  const N=Math.min(chart.length,60);
  const start=chart.length-N;
  const slice=chart.slice(start);
  let maxV=0;
  for(const x of slice)if(x.v>maxV)maxV=x.v;
  if(maxV<=0){el.innerHTML='';return}
  // padL은 가격 차트와 동일하게 — 좌측 정렬을 맞춰 시각적 통일성 유지
  const W=600,H=70,padL=opts.isKorean?56:48,padR=8,padT=4,padB=4;
  const bw=(W-padL-padR)/N*0.8;
  const gap=(W-padL-padR)/N*0.2;
  const bars=[];
  for(let i=0;i<slice.length;i++){
    const cur=slice[i],prev=i===0?(start>0?chart[start-1]:cur):slice[i-1];
    const up=cur.c>=prev.c;
    const h=(cur.v/maxV)*(H-padT-padB);
    const xx=padL+i*((W-padL-padR)/N)+gap/2;
    const yy=H-padB-h;
    bars.push(`<rect class="${up?'bar-vol-up':'bar-vol-down'}" x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"/>`);
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="거래량 차트">
    ${bars.join('')}
  </svg>`;
}
// RSI(14) 라인 차트 — 30/70 기준선 포함
function renderRsiChart(containerId,rsiArr){
  const el=document.getElementById(containerId);
  if(!el||!rsiArr)return;
  const N=Math.min(rsiArr.length,252);
  const start=rsiArr.length-N;
  const slice=rsiArr.slice(start);
  if(!slice.some(v=>v!=null)){el.innerHTML='';return}
  const W=600,H=110,padL=28,padR=8,padT=4,padB=14;
  const x=i=>padL+(i/(N-1))*(W-padL-padR);
  const y=v=>padT+(1-v/100)*(H-padT-padB);
  let d='',started=false;
  for(let i=0;i<slice.length;i++){
    const v=slice[i];
    if(v==null||!isFinite(v))continue;
    d+=(started?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';
    started=true;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="RSI 차트">
    <line class="ref-line" x1="${padL}" y1="${y(70).toFixed(1)}" x2="${W-padR}" y2="${y(70).toFixed(1)}"/>
    <line class="ref-line" x1="${padL}" y1="${y(30).toFixed(1)}" x2="${W-padR}" y2="${y(30).toFixed(1)}"/>
    <text class="chart-axis" x="${padL-4}" y="${(y(70)+3).toFixed(1)}" text-anchor="end">70</text>
    <text class="chart-axis" x="${padL-4}" y="${(y(30)+3).toFixed(1)}" text-anchor="end">30</text>
    <path class="line-rsi" d="${d.trim()}"/>
  </svg>`;
}
function pct(a,b){return((a-b)/b)*100}
function fmtNum(n,d=2){if(n==null||!isFinite(n))return'—';return n.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})}
function fmtPct(n,d=1){if(n==null||!isFinite(n))return'—';return(n>=0?'+':'')+n.toFixed(d)+'%'}
function fmtBig(n){if(n==null||!isFinite(n))return'—';const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2)+'T';if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';return n.toLocaleString()}

async function run(){

  const isKr=isKoreanTicker(rawTicker);

  }
  // 차트 로드 성공한 시점에만 최근 본 종목에 추가 (잘못된 티커가 히스토리에 남지 않도록)
  addToRecent(rawTicker);
  // 회사명 즉시 표시 — 펀더멘털 로드 전에 사용자가 어떤 회사인지 인지 가능
  const headerName=chart._meta?.shortName||chart._meta?.longName
    ||(isKr?(KR_NAMES[rawTicker]||displayTicker):displayTicker);

    `<div class="result-header"><strong>${escAttr(headerName)}</strong><span class="muted">${escAttr(displayTicker)}${headerSub?' · '+escAttr(headerSub):''}</span></div>`;
  status.innerHTML='<span class="loader"></span> 시그널 계산 중...';

  const closes=chart.map(x=>x.c);
  const vols=chart.map(x=>x.v);
  const last=closes[closes.length-1];
  const ma50=sma(closes,50),ma200=sma(closes,200);
  // 골든/데드 크로스 "이벤트" 판정용 — 10거래일 전 시점의 MA
  const closesLag=closes.slice(0,-10);
  const ma50Lag=closesLag.length>=50?sma(closesLag,50):null;
  const ma200Lag=closesLag.length>=200?sma(closesLag,200):null;
  const goldenCross=(ma50!=null&&ma200!=null&&ma50Lag!=null&&ma200Lag!=null)
    ?(ma50>ma200&&ma50Lag<=ma200Lag):null;
  const deadCross=(ma50!=null&&ma200!=null&&ma50Lag!=null&&ma200Lag!=null)
    ?(ma50<ma200&&ma50Lag>=ma200Lag):null;
  const r=rsi(closes);
  // 영업일 표준치 적용 (3M=63, 6M=126, 1Y=252)
  const r1m=closes.length>=22?pct(last,closes[closes.length-22]):null;
  const r3m=closes.length>=63?pct(last,closes[closes.length-63]):null;
  const r6m=closes.length>=126?pct(last,closes[closes.length-126]):null;
  const r1y=closes.length>=252?pct(last,closes[closes.length-252]):null;
  // 거래량: 마지막 봉(장중 미완성 가능)을 단독으로 쓰지 않고 최근 5일 평균을 20일 평균과 비교
  const volAvg=sma(vols,20);
  const volRecent=sma(vols,5);
  const volRatio=volAvg&&volRecent?volRecent/volAvg:null;

  // 상대강도(RS): 단순 차감 대신 표준 비율식 ((1+r)/(1+rRef) - 1)
  // 변동성 큰 지수와 비교할 때도 비율 의미가 보존됨.
  let rsRef1=null,rsRef2=null;
  if(ref1.length>=63&&r3m!=null){
    const rL=ref1[ref1.length-1].c;
    const rR3=pct(rL,ref1[ref1.length-63].c);
    rsRef1=((1+r3m/100)/(1+rR3/100)-1)*100;
  }
  if(ref2.length>=63&&r3m!=null){
    const rL=ref2[ref2.length-1].c;
    const rR3=pct(rL,ref2[ref2.length-63].c);
    rsRef2=((1+r3m/100)/(1+rR3/100)-1)*100;
  }

  const fmtP=n=>isKr?fmtPriceKRW(n):('$'+fmtNum(n));

  document.getElementById('metrics').innerHTML=[
    ['현재가',fmtP(last),''],
    ['RSI(14)',r?r.toFixed(1):'—',r?(r>70?'과매수':r<30?'과매도':'중립'):''],
    ['3개월 수익률',fmtPct(r3m),''],
    ['거래량 비율',volRatio?volRatio.toFixed(2)+'x':'—','20일 평균 대비'],
  ].map(m=>`<div class="metric"><div class="metric-label">${m[0]}</div><div class="metric-value">${m[1]}</div><div class="metric-note">${m[2]}</div></div>`).join('');

  const sigs=[];
  // sig(ok, bad, txt, val, w):
  //   ok=true → ✓ 초록 (긍정 신호), bad=true → ✗ 빨강 (부정 신호), 둘 다 false → • 회색 (중립)
  //   라벨(txt)은 사실 그대로 표기, 판정은 색·아이콘이 표시. "강세/양호/활발" 같은 평가 단어는 라벨에서 제거.
  const sig=(ok,bad,txt,val,w=1)=>sigs.push({ok,bad,txt,val,w});
  sig(ma200&&last>ma200,ma200&&last<ma200,'장기 추세선 위 (200일선)',ma200?fmtP(ma200):'—',3);
  // 골든/데드 크로스: "최근 10일 내 교차" 이벤트만 인정 (단순 상태가 아님)
  // 상태(ma50>ma200)는 별도 가중치 1로 분리해서 점수 왜곡 줄임
  sig(goldenCross===true,deadCross===true,
      '이동평균선 교차 (최근 10일)',
      goldenCross===true?'🌟 골든크로스 (강세 신호)':deadCross===true?'⚠️ 데드크로스 (약세 신호)':'최근 10일 내 교차 없음',
      3);
  sig(ma50&&ma200&&ma50>ma200,ma50&&ma200&&ma50<ma200,'단기선이 장기선 위 (정배열)','',1);
  sig(ma50&&last>ma50,ma50&&last<ma50,'단기 추세선 위 (50일선)',ma50?fmtP(ma50):'—',2);
  // RSI: 추세 추종에서 70 이상도 강세 지속 신호 — 50 이상이면 양호로 판단
  // 단, 80 초과는 과열로 별도 표시 (점수에는 미반영)
  sig(r!=null&&r>=50,r!=null&&r<40,'단기 매수세 (RSI 50 이상)',r!=null?r.toFixed(1):'—',2);
  sig(r3m!=null&&r3m>5,r3m!=null&&r3m<0,'3개월 수익률',fmtPct(r3m),2);
  sig(r6m!=null&&r6m>10,r6m!=null&&r6m<0,'6개월 수익률',fmtPct(r6m),2);
  sig(r1y!=null&&r1y>20,r1y!=null&&r1y<0,'1년 수익률',fmtPct(r1y),2);
  sig(rsRef1!=null&&rsRef1>0,rsRef1!=null&&rsRef1<0,ref1Label+' 대비 수익률',fmtPct(rsRef1),2);
  sig(rsRef2!=null&&rsRef2>0,rsRef2!=null&&rsRef2<0,ref2Label+' 대비 수익률',fmtPct(rsRef2),2);
  sig(r1m!=null&&r1m>0,r1m!=null&&r1m<0,'1개월 수익률',fmtPct(r1m),1);
  sig(volRatio!=null&&volRatio>1.2,volRatio!=null&&volRatio<0.7,'최근 5일 거래량 (20일 평균 대비)',volRatio?volRatio.toFixed(2)+'x':'—',1);

  document.getElementById('signals').innerHTML=sigs.map(s=>{

    const ic=s.ok?'✓':s.bad?'✗':'•';
    return`<div class="signal ${cls}"><span>${ic} ${s.txt}</span><strong>${s.val}</strong></div>`;
  }).join('');

  const totalW=sigs.reduce((s,x)=>s+x.w,0);
  const earnedW=sigs.filter(s=>s.ok).reduce((s,x)=>s+x.w,0);
  const ratio=totalW>0?earnedW/totalW:0;
  let verdict,bg;
  if(ratio>=0.65){verdict='🚀 강한 모멘텀';bg='var(--good-bg)';}

  // 펀더멘털 카드(#fund-content) 내부에 이미 로더가 있어 사용자가 진행 상태를 인지 가능.
  status.style.display='none';

  showStaleNoticeIfAny();
  // SVG 차트 3종 — rAF로 결과 패널 첫 paint 후로 미뤄 입력 응답성 보호
