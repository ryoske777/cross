<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Momentum Checker Pro — 모멘텀 점수 분석기</title>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#faf8f3;--surface:#fff;--text:#1f1f1d;--text-secondary:#6c6c66;--text-tertiary:#a8a8a0;--border:rgba(0,0,0,0.08);--good:#2d8659;--good-bg:#e8f5ee;--bad:#c44343;--bad-bg:#fcebec;--neutral:#b07d2e;--neutral-bg:#fbf2e1;--primary:#1a4d8c;--primary-hover:#0e3a73;--price:#1a4d8c;--ma50:#d97942;--ma200:#6c6c66}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px;min-height:100vh;line-height:1.5}
.container{max-width:840px;margin:0 auto}
header{margin-bottom:24px;text-align:center}
h1{font-size:26px;letter-spacing:-0.03em}
.subtitle{color:var(--text-secondary);font-size:13px;margin-top:6px}
.card{background:var(--surface);border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.search-row{display:flex;gap:10px}
.ticker-input{flex:1;max-width:190px;padding:12px;border-radius:8px;border:1.5px solid var(--border);font-size:16px;font-weight:700;text-transform:uppercase;outline:none}
.ticker-input:focus{border-color:var(--primary)}
button.primary{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px}
button.primary:hover{background:var(--primary-hover)}
.quick-buttons{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick-btn{background:#fff;border:1px solid var(--border);padding:6px 14px;font-size:13px;border-radius:6px;cursor:pointer;color:var(--text-secondary)}
.quick-btn:hover{border-color:var(--primary);color:var(--primary)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{padding:16px;background:var(--bg);border-radius:10px;text-align:center}
.metric-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.metric-value{font-size:18px;font-weight:850;letter-spacing:-0.02em}
.metric-note{font-size:11px;color:var(--text-tertiary);margin-top:4px}
.signal{padding:14px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;gap:12px;font-size:14.5px;align-items:center}
.signal strong{white-space:nowrap}
.signal-good{background:var(--good-bg);color:var(--good)}
.signal-bad{background:var(--bad-bg);color:var(--bad)}
.signal-neutral{background:var(--neutral-bg);color:var(--neutral)}
.summary{margin-top:16px;padding:18px;border-radius:12px;font-weight:850;text-align:center;font-size:19px}
.summary-sub{font-size:13px;margin-top:6px;font-weight:500;opacity:0.86}
.section-title{font-size:14px;font-weight:800;margin-bottom:10px;color:var(--text-secondary)}
.legend{font-size:12px;color:var(--text-tertiary);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:middle;border-radius:10px}
.legend .p::before{background:var(--price)}
.legend .m50::before{background:var(--ma50)}
.legend .m200::before{background:var(--ma200);border-top:2px dashed var(--ma200);height:0}
.footer{text-align:center;color:var(--text-tertiary);font-size:12px;margin-top:40px}
.loader{width:20px;height:20px;border:3px solid #CCC;border-bottom-color:var(--primary);border-radius:50%;display:inline-block;animation:rot 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes rot{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:rgba(255,255,255,0.52);border:1px solid var(--border);padding:6px;border-radius:12px}
.tab-btn{flex:1;border:none;background:transparent;color:var(--text-secondary);padding:11px 12px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer}
.tab-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.fundamental-hero{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.fundamental-hero{grid-template-columns:1.2fr 0.8fr;align-items:stretch}}
.company-box{background:var(--bg);border-radius:12px;padding:16px}
.company-name{font-size:20px;font-weight:900;letter-spacing:-0.03em}
.company-meta{font-size:12px;color:var(--text-secondary);margin-top:6px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:rgba(26,77,140,0.08);color:var(--primary)}
.fund-score{background:linear-gradient(135deg,rgba(26,77,140,0.10),rgba(45,134,89,0.10));border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.fund-score .score-number{font-size:34px;font-weight:950;letter-spacing:-0.05em}
.fund-score .score-label{font-size:13px;color:var(--text-secondary);margin-top:2px}
.fund-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.fund-grid{grid-template-columns:repeat(4,1fr)}}
.fund-card{background:var(--bg);border-radius:12px;padding:15px;min-height:120px}
.fund-title{font-size:12px;color:var(--text-secondary);font-weight:800;margin-bottom:8px}
.fund-main{font-size:20px;font-weight:950;letter-spacing:-0.03em}
.fund-desc{font-size:11.5px;color:var(--text-secondary);margin-top:6px;line-height:1.45}
.bar-list{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar-label{color:var(--text-secondary);font-weight:800}
.bar-track{height:10px;background:rgba(0,0,0,0.07);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--primary);width:0%;transition:width .6s}
.bar-fill.good{background:var(--good)}
.bar-fill.neutral{background:var(--neutral)}
.bar-fill.bad{background:var(--bad)}
.bar-val{text-align:right;font-weight:800;font-size:12.5px}
.mini-note{margin-top:12px;color:var(--text-tertiary);font-size:12px;line-height:1.55}
.empty-state{background:var(--neutral-bg);color:var(--neutral);border-radius:12px;padding:18px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📈 모멘텀 신호 체크 Pro</h1>
<div class="subtitle">이평선 + RSI + 거래량 + 기간 수익률 + 펀더멘털</div>
</header>

<div class="card">
<div class="search-row">
<input id="ticker" class="ticker-input" placeholder="TSM" value="TSM">
<button class="primary" onclick="run()">분석하기</button>
</div>
<div class="quick-buttons">
<button class="quick-btn" onclick="setT('TSM')">TSM</button>
<button class="quick-btn" onclick="setT('NVDA')">NVDA</button>
<button class="quick-btn" onclick="setT('AAPL')">AAPL</button>
<button class="quick-btn" onclick="setT('MSFT')">MSFT</button>
<button class="quick-btn" onclick="setT('AMZN')">AMZN</button>
<button class="quick-btn" onclick="setT('GOOGL')">GOOGL</button>
<button class="quick-btn" onclick="setT('QQQ')">QQQ</button>
<button class="quick-btn" onclick="setT('SPY')">SPY</button>
</div>
</div>

<div id="results" style="display:none">
<div class="tabs">
<button class="tab-btn active" data-tab="tech" onclick="switchTab('tech')">📈 기술적 분석</button>
<button class="tab-btn" data-tab="fund" onclick="switchTab('fund')">🏢 펀더멘털 분석</button>
</div>

<div id="tab-tech" class="tab-panel active">
<div class="card">
<div class="section-title">핵심 지표</div>
<div id="metrics" class="metrics"></div>
</div>
<div class="card">
<div class="section-title">종합 신호</div>
<div id="signals"></div>
<div id="summary"></div>
</div>
</div>

<div id="tab-fund" class="tab-panel">
<div id="fund-content"></div>
</div>
</div>

<div id="status" class="card" style="display:none"></div>
<div class="footer">데이터 출처: Yahoo Finance(공개 엔드포인트, CORS 프록시 경유) / Stooq 백업</div>
</div>

<script>
const PROXIES=[
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u,
];

async function fetchJSON(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      return JSON.parse(t);
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('all proxies failed');
}
async function fetchText(url){
  let lastErr;
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.text();
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('all proxies failed');
}

function setT(t){document.getElementById('ticker').value=t;run()}
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
}

async function getChart(ticker){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1y&interval=1d`;
  try{
    const j=await fetchJSON(url);
    const r=j.chart.result[0];
    const ts=r.timestamp;
    const c=r.indicators.quote[0].close;
    const v=r.indicators.quote[0].volume;
    const out=[];
    for(let i=0;i<ts.length;i++){
      if(c[i]!=null) out.push({d:new Date(ts[i]*1000),c:c[i],v:v[i]||0});
    }
    return out;
  }catch(e){
    // Stooq backup
    const sym=ticker.toLowerCase()+'.us';
    const t=await fetchText(`https://stooq.com/q/d/l/?s=${sym}&i=d`);
    const lines=t.trim().split('\n').slice(1);
    return lines.map(l=>{const p=l.split(',');return{d:new Date(p[0]),c:+p[4],v:+p[5]||0}}).filter(x=>!isNaN(x.c)).slice(-260);
  }
}

async function getQuoteSummary(ticker){
  const modules='summaryDetail,defaultKeyStatistics,financialData,assetProfile,price,quoteType';
  const url=`https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=${modules}`;
  const j=await fetchJSON(url);
  return j.quoteSummary.result[0];
}

function sma(arr,n){if(arr.length<n)return null;return arr.slice(-n).reduce((a,b)=>a+b,0)/n}
function rsi(closes,n=14){
  if(closes.length<n+1)return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}
  let ag=g/n,al=l/n;
  for(let i=n+1;i<closes.length;i++){const d=closes[i]-closes[i-1];const u=d>0?d:0,dn=d<0?-d:0;ag=(ag*(n-1)+u)/n;al=(al*(n-1)+dn)/n}
  if(al===0)return 100;
  return 100-100/(1+ag/al);
}
function pct(a,b){return((a-b)/b)*100}
function fmtNum(n,d=2){if(n==null||!isFinite(n))return'—';return n.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d})}
function fmtPct(n,d=1){if(n==null||!isFinite(n))return'—';return(n>=0?'+':'')+n.toFixed(d)+'%'}
function fmtBig(n){if(n==null||!isFinite(n))return'—';const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2)+'T';if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';return n.toLocaleString()}

async function run(){
  const ticker=document.getElementById('ticker').value.trim().toUpperCase();
  if(!ticker)return;
  const status=document.getElementById('status');
  status.style.display='block';status.innerHTML='<span class="loader"></span> 데이터 불러오는 중...';
  document.getElementById('results').style.display='none';

  let chart,spy,qqq;
  try{
    [chart,spy,qqq]=await Promise.all([getChart(ticker),getChart('SPY'),getChart('QQQ')]);
  }catch(e){
    status.innerHTML='<div class="empty-state">차트 데이터 로드 실패: '+e.message+'</div>';return;
  }

  // Technical
  const closes=chart.map(x=>x.c);
  const vols=chart.map(x=>x.v);
  const last=closes[closes.length-1];
  const ma50=sma(closes,50),ma200=sma(closes,200);
  const r=rsi(closes);
  const r1m=closes.length>=22?pct(last,closes[closes.length-22]):null;
  const r3m=closes.length>=66?pct(last,closes[closes.length-66]):null;
  const r6m=closes.length>=132?pct(last,closes[closes.length-132]):null;
  const volAvg=sma(vols,20);
  const volRatio=volAvg?vols[vols.length-1]/volAvg:null;

  const sLast=spy[spy.length-1].c, qLast=qqq[qqq.length-1].c;
  const sR3=spy.length>=66?pct(sLast,spy[spy.length-66].c):0;
  const qR3=qqq.length>=66?pct(qLast,qqq[qqq.length-66].c):0;
  const rsSpy=r3m!=null?r3m-sR3:null;
  const rsQqq=r3m!=null?r3m-qR3:null;

  document.getElementById('metrics').innerHTML=[
    ['현재가','$'+fmtNum(last),''],
    ['RSI(14)',r?r.toFixed(1):'—',r?(r>70?'과매수':r<30?'과매도':'중립'):''],
    ['3개월 수익률',fmtPct(r3m),''],
    ['거래량 비율',volRatio?volRatio.toFixed(2)+'x':'—','20일 평균 대비'],
  ].map(m=>`<div class="metric"><div class="metric-label">${m[0]}</div><div class="metric-value">${m[1]}</div><div class="metric-note">${m[2]}</div></div>`).join('');

  const sigs=[];
  const sig=(ok,bad,txt,val)=>sigs.push({ok,bad,txt,val});
  sig(ma50&&last>ma50,ma50&&last<ma50,'50일선 위', ma50?'$'+fmtNum(ma50):'—');
  sig(ma200&&last>ma200,ma200&&last<ma200,'200일선 위', ma200?'$'+fmtNum(ma200):'—');
  sig(ma50&&ma200&&ma50>ma200,ma50&&ma200&&ma50<ma200,'골든크로스(50>200)','');
  sig(r&&r>50&&r<70,r&&(r>=70||r<40),'RSI 건강 구간(50~70)',r?r.toFixed(1):'—');
  sig(r1m!=null&&r1m>0,r1m!=null&&r1m<0,'1개월 수익률 양호',fmtPct(r1m));
  sig(r3m!=null&&r3m>5,r3m!=null&&r3m<0,'3개월 수익률 강세',fmtPct(r3m));
  sig(r6m!=null&&r6m>10,r6m!=null&&r6m<0,'6개월 수익률 강세',fmtPct(r6m));
  sig(volRatio&&volRatio>1.2,volRatio&&volRatio<0.7,'거래량 활발',volRatio?volRatio.toFixed(2)+'x':'—');
  sig(rsSpy!=null&&rsSpy>0,rsSpy!=null&&rsSpy<0,'SPY 대비 강세',fmtPct(rsSpy));
  sig(rsQqq!=null&&rsQqq>0,rsQqq!=null&&rsQqq<0,'QQQ 대비 강세',fmtPct(rsQqq));

  document.getElementById('signals').innerHTML=sigs.map(s=>{
    const cls=s.ok?'signal-good':s.bad?'signal-bad':'signal-neutral';
    const ic=s.ok?'✓':s.bad?'✗':'•';
    return `<div class="signal ${cls}"><span>${ic} ${s.txt}</span><strong>${s.val}</strong></div>`;
  }).join('');

  const score=sigs.filter(s=>s.ok).length;
  const total=sigs.length;
  let verdict,bg;
  if(score>=total*0.7){verdict='🚀 강한 모멘텀';bg='var(--good-bg)';}
  else if(score>=total*0.4){verdict='⚖️ 혼조';bg='var(--neutral-bg)';}
  else{verdict='🔻 약세';bg='var(--bad-bg)';}
  document.getElementById('summary').innerHTML=`<div class="summary" style="background:${bg}">${verdict}<div class="summary-sub">${score} / ${total} 긍정 신호</div></div>`;

  // Fundamental
  await loadFundamental(ticker);

  status.style.display='none';
  document.getElementById('results').style.display='block';
}

async function loadFundamental(ticker){
  const box=document.getElementById('fund-content');
  box.innerHTML='<div class="card"><span class="loader"></span> 펀더멘털 불러오는 중...</div>';
  try{
    const r=await getQuoteSummary(ticker);
    const sd=r.summaryDetail||{}, ks=r.defaultKeyStatistics||{}, fd=r.financialData||{}, ap=r.assetProfile||{}, pr=r.price||{}, qt=r.quoteType||{};
    const v=o=>o&&o.raw!=null?o.raw:null;

    const name=pr.longName||pr.shortName||qt.shortName||ticker;
    const sector=ap.sector||(qt.quoteType==='ETF'?'ETF':'—');
    const industry=ap.industry||'—';
    const country=ap.country||'';
    const employees=ap.fullTimeEmployees;
    const mcap=v(sd.marketCap)||v(pr.marketCap);
    const pe=v(sd.trailingPE)||v(ks.trailingPE);
    const fpe=v(sd.forwardPE)||v(ks.forwardPE);
    const peg=v(ks.pegRatio);
    const pb=v(ks.priceToBook);
    const ps=v(sd.priceToSalesTrailing12Months);
    const divY=v(sd.dividendYield);
    const roe=v(fd.returnOnEquity);
    const roa=v(fd.returnOnAssets);
    const margin=v(fd.profitMargins)||v(ks.profitMargins);
    const opMargin=v(fd.operatingMargins);
    const revGrowth=v(fd.revenueGrowth);
    const earnGrowth=v(fd.earningsGrowth)||v(fd.earningsQuarterlyGrowth);
    const debtEq=v(fd.debtToEquity);
    const currentRatio=v(fd.currentRatio);
    const beta=v(sd.beta)||v(ks.beta);

    // scoring (0~100) — adapt for ETF
    const isETF=qt.quoteType==='ETF';
    let score=50, items=[];
    const add=(cond,pts,label)=>{if(cond===null||cond===undefined)return;score+=pts;items.push({label,pts})};

    if(!isETF){
      add(pe!=null&&pe>0&&pe<25?true:null, pe!=null&&pe>0&&pe<25?8:(pe!=null&&pe>40?-8:0), 'P/E');
      add(roe!=null?true:null, roe!=null?(roe>0.20?12:roe>0.10?6:roe<0?-10:0):0, 'ROE');
      add(margin!=null?true:null, margin!=null?(margin>0.20?10:margin>0.05?5:margin<0?-10:0):0, '순이익률');
      add(revGrowth!=null?true:null, revGrowth!=null?(revGrowth>0.15?10:revGrowth>0?4:-8):0, '매출 성장');
      add(earnGrowth!=null?true:null, earnGrowth!=null?(earnGrowth>0.15?8:earnGrowth>0?3:-6):0, '이익 성장');
      add(debtEq!=null?true:null, debtEq!=null?(debtEq<50?5:debtEq<150?0:-6):0, '부채비율');
      add(currentRatio!=null?true:null, currentRatio!=null?(currentRatio>1.5?4:currentRatio>1?1:-4):0, '유동비율');
    }else{
      add(true,10,'ETF — 분산 투자 특성');
      add(divY!=null?true:null, divY!=null?(divY>0.02?5:0):0,'배당');
    }
    score=Math.max(0,Math.min(100,Math.round(score)));
    let grade,gColor;
    if(score>=75){grade='우수';gColor='var(--good)'}
    else if(score>=55){grade='양호';gColor='var(--primary)'}
    else if(score>=40){grade='보통';gColor='var(--neutral)'}
    else{grade='주의';gColor='var(--bad)'}

    const tagList=[];
    if(sector&&sector!=='—')tagList.push(sector);
    if(industry&&industry!=='—')tagList.push(industry);
    if(country)tagList.push(country);
    if(qt.quoteType)tagList.push(qt.quoteType);

    const cards=[
      {t:'시가총액',m:fmtBig(mcap),d:'기업 규모'},
      {t:'P/E (TTM)',m:pe!=null?fmtNum(pe):'—',d:fpe!=null?'Forward '+fmtNum(fpe):'주가/이익 비율'},
      {t:'PEG',m:peg!=null?fmtNum(peg):'—',d:'성장 대비 밸류'},
      {t:'P/B',m:pb!=null?fmtNum(pb):'—',d:'주가/순자산'},
      {t:'P/S',m:ps!=null?fmtNum(ps):'—',d:'주가/매출'},
      {t:'배당수익률',m:divY!=null?(divY*100).toFixed(2)+'%':'—',d:'연간 배당'},
      {t:'ROE',m:roe!=null?(roe*100).toFixed(1)+'%':'—',d:'자기자본이익률'},
      {t:'순이익률',m:margin!=null?(margin*100).toFixed(1)+'%':'—',d:opMargin!=null?'영업 '+(opMargin*100).toFixed(1)+'%':''},
    ];

    const bars=[
      {l:'매출 성장',v:revGrowth,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,(x+0.1)*333)),cls:x=>x>0.15?'good':x>0?'neutral':'bad'},
      {l:'이익 성장',v:earnGrowth,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,(x+0.1)*333)),cls:x=>x>0.15?'good':x>0?'neutral':'bad'},
      {l:'ROE',v:roe,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,x*333)),cls:x=>x>0.20?'good':x>0.10?'neutral':'bad'},
      {l:'순이익률',v:margin,fmt:x=>(x*100).toFixed(1)+'%',scale:x=>Math.max(0,Math.min(100,x*333)),cls:x=>x>0.15?'good':x>0?'neutral':'bad'},
      {l:'부채비율(D/E)',v:debtEq,fmt:x=>x.toFixed(0)+'%',scale:x=>Math.max(0,Math.min(100,100-x/3)),cls:x=>x<50?'good':x<150?'neutral':'bad'},
    ].filter(b=>b.v!=null&&isFinite(b.v));

    const dets=[];
    if(pe!=null)dets.push({ok:pe>0&&pe<25,bad:pe<0||pe>40,t:`P/E ${fmtNum(pe)}`,v:pe>0&&pe<25?'합리적':pe>40?'고평가 우려':pe<0?'적자':'다소 높음'});
    if(roe!=null)dets.push({ok:roe>0.15,bad:roe<0,t:`ROE ${(roe*100).toFixed(1)}%`,v:roe>0.20?'매우 우수':roe>0.10?'양호':roe<0?'손실':'평범'});
    if(revGrowth!=null)dets.push({ok:revGrowth>0.10,bad:revGrowth<0,t:`매출 성장 ${(revGrowth*100).toFixed(1)}%`,v:revGrowth>0.15?'고성장':revGrowth>0?'성장':'역성장'});
    if(debtEq!=null)dets.push({ok:debtEq<50,bad:debtEq>200,t:`D/E ${debtEq.toFixed(0)}%`,v:debtEq<50?'재무 건전':debtEq<150?'보통':'부채 부담'});
    if(beta!=null)dets.push({ok:false,bad:false,t:`베타 ${fmtNum(beta)}`,v:beta>1.3?'고변동성':beta<0.7?'저변동성':'시장 수준'});

    box.innerHTML=`
      <div class="card">
        <div class="section-title">펀더멘털 요약</div>
        <div class="fundamental-hero">
          <div class="company-box">
            <div class="company-name">${name}</div>
            <div class="company-meta">${ticker}${employees?` · 직원 ${employees.toLocaleString()}명`:''}</div>
            <div class="tag-row">${tagList.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          </div>
          <div class="fund-score">
            <div class="score-number" style="color:${gColor}">${score}</div>
            <div class="score-label">펀더멘털 점수 — <strong style="color:${gColor}">${grade}</strong></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">한눈에 보는 핵심 항목</div>
        <div class="fund-grid">
          ${cards.map(c=>`<div class="fund-card"><div class="fund-title">${c.t}</div><div class="fund-main">${c.m}</div><div class="fund-desc">${c.d}</div></div>`).join('')}
        </div>
      </div>
      ${dets.length?`<div class="card">
        <div class="section-title">세부 판단</div>
        ${dets.map(d=>`<div class="signal ${d.ok?'signal-good':d.bad?'signal-bad':'signal-neutral'}"><span>${d.ok?'✓':d.bad?'✗':'•'} ${d.t}</span><strong>${d.v}</strong></div>`).join('')}
      </div>`:''}
      ${bars.length?`<div class="card">
        <div class="section-title">시각화</div>
        <div class="bar-list">
          ${bars.map(b=>`<div class="bar-row"><div class="bar-label">${b.l}</div><div class="bar-track"><div class="bar-fill ${b.cls(b.v)}" style="width:${b.scale(b.v)}%"></div></div><div class="bar-val">${b.fmt(b.v)}</div></div>`).join('')}
        </div>
        <div class="mini-note">※ 펀더멘털 데이터는 Yahoo Finance 공개 엔드포인트(CORS 프록시 경유)로 가져옵니다. ETF/ADR은 일부 항목이 비어 있을 수 있습니다.</div>
      </div>`:''}
    `;
  }catch(e){
    box.innerHTML=`<div class="card"><div class="empty-state">펀더멘털 데이터 로드 실패: ${e.message}<br><br>잠시 후 다시 시도해 주세요. (공개 CORS 프록시가 일시적으로 막혔을 수 있습니다)</div></div>`;
  }
}

// auto run
window.addEventListener('load',()=>run());
</script>
</body>
</html>
